た。", "cls": "big", "j": 7, "h": -2, "r": 2, "assets": 300, "quit": false}, {"p": 0.5, "text": "仕事が途切れる時期があり、不安な日々を過ごした。", "cls": "red", "j": -6, "h": -2, "r": 0, "assets": -100, "quit": false}]}, {"t": "工務店に残る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "棟梁として現場を任された。", "cls": "", "j": 5, "h": -2, "r": 2, "assets": 50, "quit": false}, {"p": 0.3, "text": "給料の頭打ちを感じた。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "配管工": [{"title": "高齢者の家で、ついでに不要な工事を勧めれば儲かると先輩に言われた。", "text": "", "opts": [{"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "お客さんに信頼され、次の工事も頼まれた。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 10, "quit": false}, {"p": 0.3, "text": "先輩との関係が悪くなった。", "cls": "red", "j": -4, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "言われた通りにする", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "売上が上がり、褒められた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 10, "quit": false}, {"p": 0.5, "text": "消費者センターに通報された。", "cls": "red big", "j": -12, "h": -2, "r": -3, "assets": -50, "quit": false}]}]}, {"title": "独立して自分の設備会社を立ち上げるか迷っている。", "text": "", "opts": [{"t": "独立する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "地域の工務店と組み、安定した仕事が入るようになった。", "cls": "big", "j": 8, "h": -2, "r": 2, "assets": 400, "quit": false}, {"p": 0.5, "text": "資金繰りに苦しみ、2年で廃業した。", "cls": "red big", "j": -12, "h": -5, "r": -1, "assets": -400, "quit": true}]}, {"t": "会社に残る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "現場責任者に昇格した。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 50, "quit": false}, {"p": 0.3, "text": "若手が育たず、仕事が増えた。", "cls": "", "j": -3, "h": -3, "r": 0, "assets": 0, "quit": false}]}]}], "溶接工": [{"title": "工期に追われる中、上司から「検査は通るだろうから、多少手を抜け」と言われた。", "text": "", "opts": [{"t": "手を抜かない", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "品質の高さが評価され、重要な仕事を任された。", "cls": "", "j": 6, "h": -2, "r": 1, "assets": 20, "quit": false}, {"p": 0.4, "text": "上司と衝突し、現場の空気が悪くなった。", "cls": "red", "j": -4, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "言われた通りにする", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "何事もなく工期内に終わった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "後で不具合が見つかり、責任を問われた。", "cls": "red big", "j": -12, "h": -2, "r": -2, "assets": -30, "quit": false}]}]}, {"title": "海外の造船所から、高給で溶接工を募集している。", "text": "", "opts": [{"t": "海外へ行く", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "年収が倍になり、技術も上がった。", "cls": "big", "j": 8, "h": -2, "r": 0, "assets": 500, "quit": true}, {"p": 0.5, "text": "生活環境が合わず、1年で帰国した。", "cls": "red", "j": -6, "h": -3, "r": -1, "assets": 50, "quit": true}]}, {"t": "国内に残る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "職長に昇格し、若手の指導を任された。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 50, "quit": false}, {"p": 0.3, "text": "景気が悪化し、仕事が減った。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": -30, "quit": false}]}]}], "塗装工": [{"title": "見積もりで、塗料のグレードを下げれば利益が増える。施主は気づかないだろう。", "text": "", "opts": [{"t": "正直に施工する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "10年後もきれいなままで、施主から紹介が来た。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 30, "quit": false}, {"p": 0.3, "text": "利益が減り、その月は赤字だった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": -20, "quit": false}]}, {"t": "グレードを下げる", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "何事もなく利益を得た。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 30, "quit": false}, {"p": 0.5, "text": "3年で塗膜が剥がれ、無償でやり直した。", "cls": "red", "j": -8, "h": -2, "r": -2, "assets": -80, "quit": false}]}]}, {"title": "知り合いから、外壁塗装の訪問販売会社に誘われた。歩合は大きい。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "営業成績トップになり、年収が倍になった。", "cls": "", "j": 3, "h": -2, "r": -1, "assets": 400, "quit": true}, {"p": 0.6, "text": "強引な営業が嫌になり、半年で辞めた。", "cls": "red", "j": -8, "h": -2, "r": -2, "assets": 0, "quit": true}]}, {"t": "職人を続ける", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "親方の仕事を引き継いだ。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 100, "quit": false}, {"p": 0.3, "text": "体力の限界を感じ始めた。", "cls": "", "j": -3, "h": -4, "r": 0, "assets": 0, "quit": false}]}]}], "解体工": [{"title": "解体中、壁の中から古い現金の入った封筒が出てきた。", "text": "", "opts": [{"t": "施主に届ける", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "施主に深く感謝され、謝礼をもらった。", "cls": "big", "j": 7, "h": 0, "r": 2, "assets": 5, "quit": false}, {"p": 0.3, "text": "施主に「もっとあったはずだ」と疑われた。", "cls": "red", "j": -6, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "黙って懐に入れる", "s": "", "w": 1, "outs": [{"p": 0.4, "text": "誰にもバレなかったが、ずっと気まずかった。", "cls": "", "j": -6, "h": 0, "r": 0, "assets": 10, "quit": false}, {"p": 0.6, "text": "同僚にバレて会社をクビになった。", "cls": "red big", "j": -15, "h": 0, "r": -4, "assets": -30, "quit": true}]}]}, {"title": "アスベスト除去の専門資格を取れば、日給が上がる。", "text": "", "opts": [{"t": "資格を取る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "日給が5000円上がった。", "cls": "", "j": 5, "h": 0, "r": 0, "assets": 100, "quit": false}, {"p": 0.3, "text": "体への負担が気になり始めた。", "cls": "", "j": -3, "h": -4, "r": 0, "assets": 80, "quit": false}]}, {"t": "今のままでいい", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "慣れた現場で淡々と働いた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "後輩に先を越され、少し悔しかった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "タクシー運転手": [{"title": "深夜、明らかに泥酔した客が乗り込んできた。行き先も言えない状態だ。", "text": "", "opts": [{"t": "乗せて交番に向かう", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "警察に保護してもらい、後で家族から感謝された。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "車内で吐かれ、清掃で営業が1日潰れた。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": -3, "quit": false}]}, {"t": "乗車を断る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "何事もなく次の客を乗せた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "その客が倒れていたというニュースを翌朝見た。", "cls": "red", "j": -8, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "個人タクシーの資格要件を満たした。独立するか迷っている。", "text": "", "opts": [{"t": "個人タクシーになる", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "自分のペースで働け、手取りが増えた。", "cls": "big", "j": 7, "h": 2, "r": 1, "assets": 200, "quit": true}, {"p": 0.4, "text": "車両代の返済に追われた。", "cls": "red", "j": -4, "h": -2, "r": 0, "assets": -150, "quit": true}]}, {"t": "会社に残る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "無事故表彰をもらった。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 10, "quit": false}, {"p": 0.3, "text": "ノルマに追われ、腰痛が悪化した。", "cls": "red", "j": -4, "h": -5, "r": 0, "assets": 0, "quit": false}]}]}], "バス運転手": [{"title": "乗客の一人が車内で倒れた。次のバス停まであと2分だ。", "text": "", "opts": [{"t": "すぐ停車して救護する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "救急車が来るまで心臓マッサージをし、乗客は助かった。後日表彰された。", "cls": "big", "j": 9, "h": -1, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "他の乗客から「遅れる」と文句を言われた。", "cls": "", "j": -2, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "次の停留所まで走る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "停留所で救急車を呼び、無事搬送された。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "判断の遅れを指摘され、会社に注意された。", "cls": "red", "j": -6, "h": 0, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "観光バス会社から、高い給料で誘われている。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "全国を走り回り、各地のサービスエリアに詳しくなった。", "cls": "", "j": 6, "h": -2, "r": 1, "assets": 100, "quit": true}, {"p": 0.5, "text": "長距離の夜行運転がきつく、体を壊した。", "cls": "red", "j": -6, "h": -8, "r": 0, "assets": 50, "quit": true}]}, {"t": "路線バスを続ける", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "地元の顔なじみが増え、町の一部になった気がした。", "cls": "", "j": 5, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "運転手不足で勤務がさらに過酷になった。", "cls": "red", "j": -5, "h": -5, "r": 0, "assets": 0, "quit": false}]}]}], "宅配ドライバー": [{"title": "ドライバー仲間に、個人事業主として独立しないかと誘われた。", "text": "1個150円の委託単価。", "opts": [{"t": "独立する", "s": "稼げるかも", "w": 2, "outs": [{"p": 0.5, "text": "1日200個さばいて月収が60万円を超えた。体はボロボロだった。", "cls": "big", "j": 5, "h": -8, "r": 0, "assets": 150, "quit": true}, {"p": 0.5, "text": "単価が120円に下がり、ガソリン代で赤字の月が出た。2年で会社員に戻った。", "cls": "red", "j": -10, "h": -5, "r": 0, "assets": -80, "quit": true}]}, {"t": "社員のまま", "s": "安定", "w": 3, "outs": [{"p": 0.7, "text": "ボーナスで家族旅行に行けた。", "cls": "", "j": 3, "h": 0, "r": 3, "assets": 30, "quit": false}, {"p": 0.3, "text": "独立した仲間が新車のハイエースで遊びに来た。少しうらやましかった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "配達先で、荷物を受け取りに出てこない高齢者の家から異臭がした。", "text": "", "opts": [{"t": "通報する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "倒れていたおじいさんが一命を取り留めた。後日、警察から感謝状が届いた。", "cls": "big", "j": 8, "h": 0, "r": 5, "assets": 0, "quit": false}, {"p": 0.4, "text": "ただのぬか漬けだった。おじいさんに笑われて、漬物をもらった。", "cls": "", "j": 4, "h": 0, "r": 2, "assets": 0, "quit": false}]}, {"t": "不在票を入れて去る", "s": "時間がない", "w": 1, "outs": [{"p": 0.5, "text": "何もなかった。でも次の週まで気になった。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "翌週、その家に救急車が止まっていた。ずっと引きずった。", "cls": "red", "j": -12, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "倉庫作業員": [{"title": "会社が自動倉庫ロボットを導入する。リーダーになってロボットの管理を覚えないかと言われた。", "text": "", "opts": [{"t": "引き受ける", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "ロボット相手の仕事に慣れ、月給が4万円上がった。", "cls": "", "j": 5, "h": 0, "r": 0, "assets": 48, "quit": false}, {"p": 0.3, "text": "ロボットが毎晩止まり、深夜3時に呼び出される日々が続いた。", "cls": "red", "j": -8, "h": -6, "r": 0, "assets": 20, "quit": false}]}, {"t": "現場に残る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "人手が減って、仲のいい3人とのんびり働けた。", "cls": "", "j": 3, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.5, "text": "2年後、人員削減の対象になった。", "cls": "red", "j": -10, "h": 0, "r": 0, "assets": -30, "quit": true}]}]}, {"title": "同僚がこっそり商品を持ち帰っているのを見た。", "text": "", "opts": [{"t": "上司に報告", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "同僚は解雇になった。職場の空気が少し冷たくなった。", "cls": "", "j": -3, "h": 0, "r": -5, "assets": 0, "quit": false}, {"p": 0.4, "text": "実は他にも被害が多く、上司に感謝されて班長になった。", "cls": "", "j": 4, "h": 0, "r": 0, "assets": 12, "quit": false}]}, {"t": "本人に注意", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "同僚は泣いて謝り、二度としなかった。その後、一番の飲み仲間になった。", "cls": "", "j": 3, "h": 0, "r": 6, "assets": 0, "quit": false}, {"p": 0.4, "text": "逆恨みされ、ロッカーに嫌がらせをされた。", "cls": "red", "j": -8, "h": 0, "r": -4, "assets": 0, "quit": false}]}]}], "工場ライン作業員": [{"title": "正社員登用試験の案内が来た。受かれば安定だが、今の期間工の手当はなくなる。", "text": "", "opts": [{"t": "受験する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "合格した。両親が赤飯を炊いてくれた。", "cls": "big", "j": 8, "h": 0, "r": 4, "assets": 30, "quit": false}, {"p": 0.4, "text": "面接で落ちた。来年また受けると決めた。", "cls": "", "j": -6, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "期間工で稼いで辞める", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "2年で300万円貯めて、専門学校に入り直した。", "cls": "", "j": 5, "h": 0, "r": 0, "assets": 300, "quit": true}, {"p": 0.5, "text": "貯金はパチンコに半分消えた。", "cls": "red", "j": -8, "h": 0, "r": 0, "assets": -100, "quit": true}]}]}, {"title": "手袋の巻き込みでヒヤリとした。安全装置の手順を飛ばすのが現場の慣習になっている。", "text": "", "opts": [{"t": "班長に改善を訴える", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "手順が見直され、ラインに安全カバーがついた。", "cls": "", "j": 4, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "「お前のせいで遅れる」と嫌味を言われた。", "cls": "", "j": -4, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "黙って慣習に従う", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "何も起きなかった。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "指を挟んで3針縫った。労災の書類が面倒だった。", "cls": "red", "j": -10, "h": -10, "r": 0, "assets": 0, "quit": false}]}]}], "清掃員": [{"title": "清掃会社から、現場責任者として新人10人のまとめ役を頼まれた。", "text": "", "opts": [{"t": "引き受ける", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "時給が200円上がり、新人に慕われた。", "cls": "", "j": 5, "h": 0, "r": 4, "assets": 24, "quit": false}, {"p": 0.4, "text": "新人が次々辞め、穴埋めで週6勤務になった。", "cls": "red", "j": -7, "h": -6, "r": 0, "assets": 10, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "マイペースに続けられた。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "清掃中、会議室に財布が落ちていた。中に現金20万円が入っていた。", "text": "", "opts": [{"t": "警備室に届ける", "s": "", "w": 4, "outs": [{"p": 0.7, "text": "持ち主の社長から1割のお礼を受け取った。", "cls": "big", "j": 7, "h": 0, "r": 0, "assets": 2, "quit": false}, {"p": 0.3, "text": "お礼はなかったが、気分はよかった。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "その場に置いておく", "s": "", "w": 1, "outs": [{"p": 1.0, "text": "後で「清掃の人が盗った」と疑われた。防犯カメラで潔白が証明された。", "cls": "red", "j": -8, "h": 0, "r": -3, "assets": 0, "quit": false}]}]}], "郵便局員": [{"title": "局長に、保険の営業成績を上げるよう強く求められた。親戚にも声をかけろと言う。", "text": "", "opts": [{"t": "親戚に頼む", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "ノルマを達成し、ボーナスが増えた。お正月に親戚の目が冷たかった。", "cls": "", "j": -2, "h": 0, "r": -6, "assets": 20, "quit": false}, {"p": 0.5, "text": "叔父が快く契約してくれた。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 10, "quit": false}]}, {"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "評価は下がったが、心は軽かった。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": -5, "quit": false}, {"p": 0.4, "text": "異動で山奥の局に飛ばされた。空気はおいしかった。", "cls": "", "j": -3, "h": 3, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "配達中、自転車とぶつかりそうになってカブで転んだ。相手はそのまま走り去った。", "text": "", "opts": [{"t": "すぐ報告", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "事故報告書を5枚書いた。でも膝のケガは労災になった。", "cls": "", "j": -2, "h": -3, "r": 0, "assets": 0, "quit": false}]}, {"t": "黙って配達を続ける", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "膝が腫れて3日休んだ。", "cls": "red", "j": -5, "h": -6, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "何とかなった。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "刑務官": [{"title": "ある受刑者から、家族に手紙をこっそり渡してほしいと頼まれた。", "text": "", "opts": [{"t": "断る", "s": "", "w": 4, "outs": [{"p": 0.8, "text": "規則通り断った。受刑者は「わかってた」と笑った。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.2, "text": "逆恨みされ、しばらく嫌がらせが続いた。", "cls": "", "j": -5, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "上司に相談", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "正式な手続きで手紙が送られた。受刑者に頭を下げられた。", "cls": "", "j": 5, "h": 0, "r": 3, "assets": 0, "quit": false}]}]}, {"title": "刑務官を続けるか、昇任試験を受けるか迷った。", "text": "", "opts": [{"t": "昇任試験を受ける", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "合格して看守部長になった。", "cls": "big", "j": 6, "h": 0, "r": 0, "assets": 36, "quit": false}, {"p": 0.5, "text": "3年連続で落ちた。", "cls": "", "j": -5, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "転職する", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "警備会社に転職し、夜はよく眠れるようになった。", "cls": "", "j": 3, "h": 4, "r": 0, "assets": 0, "quit": true}, {"p": 0.5, "text": "給料が下がり、少し後悔した。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": -50, "quit": true}]}]}], "寿司職人": [{"title": "海外の寿司店から、年収1,200万円で板長として来ないかと誘われた。", "text": "場所はニューヨーク。", "opts": [{"t": "渡米する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "現地で大人気になり、3年で自分の店を出した。", "cls": "big", "j": 9, "h": 0, "r": 0, "assets": 1500, "quit": true}, {"p": 0.5, "text": "言葉と文化の壁で1年で帰国した。英語だけは上達した。", "cls": "red", "j": -8, "h": 0, "r": 0, "assets": 200, "quit": true}]}, {"t": "親方のもとに残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "10年後、のれん分けで自分の店を持った。", "cls": "big", "j": 8, "h": 0, "r": 5, "assets": -500, "quit": false}, {"p": 0.4, "text": "親方とは今も厳しいままだった。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "親方の目を盗んで、SNSで握りの動画を投稿してみないか、と後輩に言われた。", "text": "", "opts": [{"t": "投稿する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "動画が200万回再生され、店に行列ができた。親方も満更でもなさそうだった。", "cls": "big", "j": 8, "h": 0, "r": 0, "assets": 50, "quit": false}, {"p": 0.5, "text": "親方に「職人は黙って握れ」と叱られ、アカウントを消した。", "cls": "", "j": -5, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "やめておく", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "淡々と修業を続けた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "パン職人": [{"title": "自分のパン屋を開業するチャンスが来た。開業資金は1,000万円。", "text": "", "opts": [{"t": "開業する", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "地元の人気店になり、行列が毎朝できた。", "cls": "big", "j": 10, "h": 0, "r": 0, "assets": 300, "quit": true}, {"p": 0.6, "text": "睡眠3時間の日々が続き、3年で閉店した。", "cls": "red big", "j": -15, "h": -10, "r": 0, "assets": -700, "quit": true}]}, {"t": "雇われで続ける", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "給料は少ないが、夜はちゃんと眠れた。", "cls": "", "j": 2, "h": 2, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "コンテストに出るため、休みを全部使って試作したいと思った。", "text": "", "opts": [{"t": "出場する", "s": "", "w": 3, "outs": [{"p": 0.3, "text": "全国大会で入賞し、店の看板商品になった。", "cls": "big", "j": 9, "h": 0, "r": 0, "assets": 40, "quit": false}, {"p": 0.7, "text": "予選落ちだった。でも新しいパンが一つ生まれた。", "cls": "", "j": 0, "h": -3, "r": 0, "assets": 0, "quit": false}]}, {"t": "出ない", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "休日は家族とピクニックに行った。", "cls": "", "j": 3, "h": 0, "r": 4, "assets": 0, "quit": false}]}]}], "和菓子職人": [{"title": "跡継ぎがいない老舗の主人から、店を継がないかと言われた。", "text": "", "opts": [{"t": "継ぐ", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "伝統を守りながら新商品を出し、売上が1.3倍になった。", "cls": "big", "j": 9, "h": 0, "r": 4, "assets": 200, "quit": true}, {"p": 0.5, "text": "借金も一緒に継いでいた。", "cls": "red", "j": -10, "h": 0, "r": 0, "assets": -400, "quit": true}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "店はその後閉店した。少し胸が痛んだ。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "洋菓子とのコラボ商品を作らないかと、パティシエの友人に誘われた。", "text": "", "opts": [{"t": "やる", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "抹茶とマスカルポーネの大福がヒットした。", "cls": "big", "j": 7, "h": 0, "r": 0, "assets": 60, "quit": false}, {"p": 0.4, "text": "親方に「邪道だ」と叱られた。", "cls": "", "j": -3, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "伝統の味に集中した。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "庭師": [{"title": "海外の日本庭園から、職人として3年間来てほしいと依頼された。", "text": "", "opts": [{"t": "行く", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "現地で日本庭園の弟子を育て、新聞に載った。", "cls": "big", "j": 8, "h": 0, "r": 0, "assets": 200, "quit": false}, {"p": 0.4, "text": "気候が違いすぎて木が根付かず、苦労した。", "cls": "", "j": -3, "h": -2, "r": 0, "assets": 0, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "地元の庭を守った。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "脚立に乗った高所作業。命綱をつけるのが面倒な場所だった。", "text": "", "opts": [{"t": "命綱をつける", "s": "", "w": 4, "outs": [{"p": 1.0, "text": "時間はかかったが無事に終わった。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "つけない", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "何事もなかった。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "落ちて腕を骨折した。2か月仕事ができなかった。", "cls": "red", "j": -12, "h": -15, "r": 0, "assets": -60, "quit": false}]}]}], "林業作業員": [{"title": "自分で林業会社を立ち上げないかと、先輩に誘われた。", "text": "", "opts": [{"t": "立ち上げる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "木材価格が上がり、5年で社員10人の会社になった。", "cls": "big", "j": 8, "h": 0, "r": 0, "assets": 500, "quit": true}, {"p": 0.5, "text": "機械のローンが重く、3年で廃業した。", "cls": "red", "j": -10, "h": 0, "r": 0, "assets": -300, "quit": true}]}, {"t": "断る", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "雇われのまま、山で働き続けた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "台風の後、倒木が道をふさいでいる。危険だが、早く撤去してほしいと住民に頼まれた。", "text": "", "opts": [{"t": "すぐ撤去する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "道が開通し、住民から差し入れが山ほど届いた。", "cls": "", "j": 6, "h": 0, "r": 5, "assets": 0, "quit": false}, {"p": 0.3, "text": "作業中に足をケガした。", "cls": "red", "j": -6, "h": -8, "r": 0, "assets": 0, "quit": false}]}, {"t": "安全確認を待つ", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "翌日、安全に撤去した。住民からは少し文句を言われた。", "cls": "", "j": -1, "h": 0, "r": -2, "assets": 0, "quit": false}]}]}], "コンビニ店長": [{"title": "2店舗目を出さないかと本部に言われた。", "text": "", "opts": [{"t": "出す", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "2店舗とも黒字になり、年収が900万円になった。", "cls": "big", "j": 6, "h": 0, "r": 0, "assets": 300, "quit": false}, {"p": 0.6, "text": "人手不足で両方回らず、毎日18時間働いた。", "cls": "red", "j": -12, "h": -12, "r": 0, "assets": -100, "quit": false}]}, {"t": "断る", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "1店舗を丁寧に回した。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "契約更新の時期が来た。この10年、休みはほとんどなかった。", "text": "", "opts": [{"t": "更新する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "もう10年頑張ることにした。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 200, "quit": false}, {"p": 0.4, "text": "体を壊して入院した。", "cls": "red", "j": -10, "h": -15, "r": 0, "assets": 0, "quit": false}]}, {"t": "更新しない", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "店を閉めた。最後の日、常連さんが花束をくれた。", "cls": "big", "j": 7, "h": 0, "r": 4, "assets": 0, "quit": true}]}]}], "パチンコ店員": [{"title": "店長候補として、研修を受けないかと言われた。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "店長になり、年収が600万円になった。", "cls": "big", "j": 5, "h": 0, "r": 0, "assets": 150, "quit": false}, {"p": 0.4, "text": "業界の縮小で、店が閉店した。", "cls": "red", "j": -8, "h": 0, "r": 0, "assets": 0, "quit": true}]}, {"t": "辞めて別の道へ", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "耳鳴りがなくなった。", "cls": "", "j": 3, "h": 4, "r": 0, "assets": 0, "quit": true}]}]}, {"title": "常連さんが生活費まで使い込んでいるようだ。顔色が悪い。", "text": "", "opts": [{"t": "声をかける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "相談窓口のチラシを受け取ってくれた。半年後、元気な顔で挨拶に来た。", "cls": "big", "j": 8, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.5, "text": "「余計なお世話だ」と怒鳴られた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "何も言わない", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "その人はいつの間にか来なくなった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "葬儀スタッフ": [{"title": "家族葬専門の小さな葬儀社を開業しないかと、先輩に誘われた。", "text": "", "opts": [{"t": "開業する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "地域の評判になり、年100件を担当した。", "cls": "big", "j": 8, "h": 0, "r": 0, "assets": 400, "quit": true}, {"p": 0.5, "text": "大手の価格に負けて、2年で閉業した。", "cls": "red", "j": -10, "h": 0, "r": 0, "assets": -300, "quit": true}]}, {"t": "今の会社に残る", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "安定した給料で続けた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "遺族から、予算がないので最低限でいいと言われた。会社は追加プランを売れと言う。", "text": "", "opts": [{"t": "遺族の希望を優先", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "遺族に感謝され、後日お菓子が届いた。", "cls": "", "j": 6, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "上司に怒られた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "会社の方針に従う", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "売上は上がったが、後味が悪かった。", "cls": "", "j": -5, "h": 0, "r": 0, "assets": 5, "quit": false}]}]}], "新聞配達員": [{"title": "販売店の店主が引退する。店を継がないかと言われた。", "text": "", "opts": [{"t": "継ぐ", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "ポスティング事業も始めて、なんとか黒字を保った。", "cls": "", "j": 4, "h": 0, "r": 0, "assets": 100, "quit": true}, {"p": 0.6, "text": "部数が減り続け、5年で廃業した。", "cls": "red", "j": -10, "h": 0, "r": 0, "assets": -200, "quit": true}]}, {"t": "断る", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "別の仕事を探し始めた。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": true}]}]}, {"title": "配達中に雪で滑ってバイクごと転んだ。新聞が道路に散らばった。", "text": "", "opts": [{"t": "全部拾って配る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "30分遅れで配り終えた。クレームは2件だった。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.3, "text": "足を痛めていて、翌日歩けなかった。", "cls": "red", "j": -5, "h": -6, "r": 0, "assets": 0, "quit": false}]}, {"t": "店に連絡する", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "店主が軽トラで助けに来てくれた。", "cls": "", "j": 3, "h": 0, "r": 3, "assets": 0, "quit": false}]}]}], "引越し作業員": [{"title": "作業中、お客さんの高価な花瓶を割ってしまった。", "text": "", "opts": [{"t": "正直に謝る", "s": "", "w": 4, "outs": [{"p": 0.7, "text": "保険で弁償し、お客さんも許してくれた。", "cls": "", "j": -2, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.3, "text": "お客さんがものすごく怒り、会社に何度も電話が来た。", "cls": "red", "j": -8, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "隠す", "s": "", "w": 1, "outs": [{"p": 1.0, "text": "後でバレて、会社をクビになった。", "cls": "red big", "j": -15, "h": 0, "r": -5, "assets": 0, "quit": true}]}]}, {"title": "独立して軽トラ1台で引越し業を始めないかと考えた。", "text": "", "opts": [{"t": "始める", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "単身者向けで評判になり、月収50万円になった。", "cls": "big", "j": 7, "h": 0, "r": 0, "assets": 300, "quit": true}, {"p": 0.5, "text": "腰を痛めて、半年で休業した。", "cls": "red", "j": -10, "h": -10, "r": 0, "assets": -100, "quit": true}]}, {"t": "やめておく", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "会社員として続けた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "遊園地スタッフ": [{"title": "新しいアトラクションのリーダーに推薦された。", "text": "", "opts": [{"t": "引き受ける", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "オープン初日、行列が3時間待ちになった。", "cls": "big", "j": 7, "h": 0, "r": 0, "assets": 24, "quit": false}, {"p": 0.3, "text": "トラブルが続き、責任を問われた。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "今の持ち場で楽しく働いた。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "お客さんが列に割り込み、他のお客さんと口論になった。", "text": "", "opts": [{"t": "間に入る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "うまく収めて、両方に笑顔で帰ってもらえた。", "cls": "", "j": 5, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "怒りの矛先が自分に向き、30分怒鳴られた。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "警備を呼ぶ", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "警備員がすぐに来て対応してくれた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "ホテルマン": [{"title": "外資系ホテルから、年収1.5倍でヘッドハンティングされた。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "英語力が伸び、5年後に支配人になった。", "cls": "big", "j": 8, "h": 0, "r": 0, "assets": 400, "quit": true}, {"p": 0.4, "text": "成果主義が厳しく、2年で燃え尽きた。", "cls": "red", "j": -8, "h": -6, "r": 0, "assets": 0, "quit": true}]}, {"t": "残る", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "今のホテルで信頼を積み上げた。", "cls": "", "j": 2, "h": 0, "r": 3, "assets": 0, "quit": false}]}]}, {"title": "VIPのお客さんから、無理な要求をされた。深夜に高級寿司を部屋に届けてほしいと言う。", "text": "", "opts": [{"t": "なんとかする", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "知り合いの店に頼み込んで届けた。後日、チップで3万円もらった。", "cls": "big", "j": 7, "h": 0, "r": 0, "assets": 3, "quit": false}, {"p": 0.4, "text": "届けたが「遅い」と怒られた。", "cls": "", "j": -5, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "丁寧に断る", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "代わりにルームサービスを提案した。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "臨床検査技師": [{"title": "製薬会社の治験コーディネーターに転職しないかと誘われた。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "年収が100万円上がった。患者さんと話す時間が増えた。", "cls": "", "j": 5, "h": 0, "r": 0, "assets": 100, "quit": true}, {"p": 0.4, "text": "営業的な仕事が合わず、戻りたくなった。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": 0, "quit": true}]}, {"t": "残る", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "検査室での経験を積んだ。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "検体のラベルが取り違えられている可能性に気づいた。結果はもう医師に送ってある。", "text": "", "opts": [{"t": "すぐ報告する", "s": "", "w": 4, "outs": [{"p": 0.8, "text": "再検査で取り違えが判明し、誤診を防げた。", "cls": "big", "j": 7, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.2, "text": "取り違えではなかった。でも上司は「よく言った」と褒めてくれた。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "様子を見る", "s": "", "w": 1, "outs": [{"p": 1.0, "text": "後日、取り違えが発覚し、大問題になった。", "cls": "red big", "j": -15, "h": 0, "r": -5, "assets": 0, "quit": false}]}]}], "診療放射線技師": [{"title": "放射線治療専門の技師になるため、資格を取るか迷った。", "text": "", "opts": [{"t": "取る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "合格し、治療部門に異動した。", "cls": "big", "j": 7, "h": 0, "r": 0, "assets": 24, "quit": false}, {"p": 0.3, "text": "勉強が大変で、2回落ちた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "取らない", "s": "", "w": 2, "outs": [{"p": 1.0, "text": "診断部門で経験を積んだ。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "医師が不要と思えるCT検査を連発する。患者さんの被ばくが気になる。", "text": "", "opts": [{"t": "医師に意見する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "医師が検査を減らしてくれた。", "cls": "", "j": 6, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "「技師は黙って撮れ」と言われた。", "cls": "red", "j": -6, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "黙って撮る", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "もやもやが残った。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "作業療 assets": -200, "quit": true}]}, {"t": "今のままで", "s": "", "w": 3, "outs": [{"p": 1.0, "text": "雇われ講師を続けた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "臨床心理士": [{"title": "相談者から「先生にだけ話します、誰にも言わないで」と、自傷をほのめかす話をされた。", "text": "", "opts": [{"t": "守秘を破って関係者に伝える", "s": "命が優先", "w": 3, "outs": [{"p": 0.6, "text": "保護者と主治医に連絡した。相談者は怒ったが、半年後「あのとき止めてくれてよかった」と言った。", "cls": "big", "j": 6, "h": -2, "r": 4, "assets": 0, "quit": false}, {"p": 0.4, "text": "信頼を失い、相談者はそれきり来なくなった。正しかったはずなのに、しばらく眠れなかった。", "cls": "red", "j": -8, "h": -4, "r": -2, "assets": 0, "quit": false}]}, {"t": "約束を守って様子を見る", "s": "関係を優先", "w": 1, "outs": [{"p": 0.5, "text": "翌週も来てくれて、少しずつ話が進んだ。綱渡りだった。", "cls": "", "j": 2, "h": -3, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "相談者が救急搬送された。命は助かったが、自分を責め続けた。", "cls": "red big", "j": -18, "h": -8, "r": -4, "assets": 0, "quit": false}]}]}, {"title": "常勤ポストの公募が出た。年収450万円だが、北海道の精神科病院で、今の非常勤は全部辞めることになる。", "text": "", "opts": [{"t": "応募して移住する", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "採用された。冬は-15℃だったが、ボーナスが出る生活に初めて感動した。", "cls": "big", "j": 6, "h": 0, "r": -2, "assets": 80, "quit": false}, {"p": 0.3, "text": "倍率40倍で落ちた。履歴書を書くのに丸3日かかっていた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "非常勤のまま残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "気心の知れた職場で続けた。収入は相変わらずだが、相談者は待っていてくれた。", "cls": "", "j": 2, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.4, "text": "翌年、1か所の契約が打ち切られ、月収が8万円減った。", "cls": "red", "j": -6, "h": -1, "r": 0, "assets": -90, "quit": false}]}]}], "保健師": [{"title": "新生児訪問で、母親が明らかに疲れ切っていて「大丈夫です」としか言わない。", "text": "", "opts": [{"t": "毎週訪問を続ける", "s": "業務は増える", "w": 3, "outs": [{"p": 0.7, "text": "3回目の訪問で母親が泣き出し、産後うつの治療につながった。1年後、笑顔で健診に来た。", "cls": "big", "j": 8, "h": -2, "r": 4, "assets": 0, "quit": false}, {"p": 0.3, "text": "「監視されてるみたい」と苦情が入り、上司に注意された。", "cls": "red", "j": -5, "h": -1, "r": -2, "assets": 0, "quit": false}]}, {"t": "電話フォローだけにする", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "電話では明るかった。たぶん大丈夫だったと思う。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "半年後、別ルートで深刻な状態が分かった。もっと行けばよかったと何年も思った。", "cls": "red", "j": -12, "h": -3, "r": -2, "assets": 0, "quit": false}]}]}, {"title": "民間企業の産業保健師に転職しないかと誘われた。年収は+100万円、土日休み確定。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "大手メーカーの健康管理室に移った。災害対応の夜間呼び出しがなくなり、よく眠れるようになった。", "cls": "", "j": 6, "h": 4, "r": 0, "assets": 100, "quit": true}, {"p": 0.3, "text": "ストレスチェック集計とメンタル休職者の面談ばかりで、地域が恋しくなった。", "cls": "", "j": -3, "h": 0, "r": -1, "assets": 100, "quit": true}]}, {"t": "行政に残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "係長に昇進した。地域の顔なじみも増えた。", "cls": "", "j": 3, "h": 0, "r": 3, "assets": 30, "quit": false}, {"p": 0.4, "text": "大雨災害で避難所に2週間詰めた。腰を痛めた。", "cls": "red", "j": -4, "h": -6, "r": 2, "assets": 0, "quit": false}]}]}], "助産師": [{"title": "病院を辞めて、助産院を開業しないかという話が出た。開業資金は800万円。", "text": "", "opts": [{"t": "開業する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "口コミで年間60件のお産を扱う人気助産院になった。休みは消えたが、誇らしかった。", "cls": "big", "j": 8, "h": -6, "r": 5, "assets": 400, "quit": true}, {"p": 0.5, "text": "嘱託医が見つからず、2年で閉院した。借金が残った。", "cls": "red big", "j": -15, "h": -4, "r": -2, "assets": -600, "quit": true}]}, {"t": "病院に残る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "主任助産師になった。後輩の育成が楽しくなってきた。", "cls": "", "j": 3, "h": 0, "r": 3, "assets": 40, "quit": false}, {"p": 0.3, "text": "夜勤続きで体を壊し、日勤のみの外来に移った。", "cls": "red", "j": -5, "h": -8, "r": 0, "assets": -30, "quit": false}]}]}, {"title": "分娩中、ベテラン医師の判断に違和感を覚えた。言えば角が立つ。", "text": "", "opts": [{"t": "はっきり進言する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "医師が方針を変え、緊急帝王切開で母子とも無事だった。後で医師に「助かった」と言われた。", "cls": "big", "j": 8, "h": 0, "r": 4, "assets": 0, "quit": false}, {"p": 0.3, "text": "結果的に問題はなく、医師との関係がぎくしゃくした。", "cls": "", "j": -4, "h": 0, "r": -4, "assets": 0, "quit": false}]}, {"t": "黙って見守る", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "何事もなく生まれた。心配しすぎだったようだ。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "赤ちゃんがNICUに入った。あのとき言えばよかったと何日も考えた。", "cls": "red", "j": -12, "h": -3, "r": -2, "assets": 0, "quit": false}]}]}], "データサイエンティスト": [{"title": "役員が「売上が伸びた」と言える分析結果を求めてきた。データを素直に見ると、施策の効果はほぼゼロだ。", "text": "", "opts": [{"t": "正直に効果なしと報告", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "役員は不機嫌だったが、CFOに「信頼できる」と評価された。", "cls": "", "j": 4, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "次のプロジェクトから外された。", "cls": "red", "j": -8, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "都合のいい切り口で見せる", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "会議は円満に終わり、評価も上がった。少しだけ自分が嫌になった。", "cls": "", "j": 1, "h": 0, "r": 2, "assets": 20, "quit": false}, {"p": 0.4, "text": "翌年、同じ施策に5億円投資されて失敗し、元の分析が掘り返された。", "cls": "red big", "j": -15, "h": -3, "r": -4, "assets": 0, "quit": false}]}]}, {"title": "外資テック企業から年収1400万円のオファーが来た。今は700万円。", "text": "", "opts": [{"t": "移る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "年収は倍になったが、英語の会議と成果主義で毎日胃が痛い。", "cls": "", "j": 2, "h": -4, "r": -1, "assets": 700, "quit": true}, {"p": 0.4, "text": "1年半後、レイオフで部署ごと消えた。", "cls": "red big", "j": -10, "h": -3, "r": -1, "assets": 300, "quit": true}]}, {"t": "残る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "社内で唯一データが分かる人として、居心地はよかった。", "cls": "", "j": 4, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.3, "text": "同期が年収2000万円になったと聞いて、しばらくもやもやした。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "AIエンジニア": [{"title": "社内でAIエージェントを使った業務自動化を任されたが、締め切りまで1か月しかない。", "text": "", "opts": [{"t": "既製のAPIで素早く作る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "2週間で動くものができ、社長賞をもらった。", "cls": "big", "j": 7, "h": 0, "r": 3, "assets": 30, "quit": false}, {"p": 0.3, "text": "API料金が想定の10倍かかり、経理から呼び出された。", "cls": "red", "j": -6, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "自社モデルを作り込む", "s": "", "w": 1, "outs": [{"p": 0.4, "text": "締め切りは過ぎたが、性能は段違いで特許も出せた。", "cls": "big", "j": 6, "h": -4, "r": 1, "assets": 50, "quit": false}, {"p": 0.6, "text": "間に合わず、プロジェクトは外部ベンダーに回された。", "cls": "red", "j": -10, "h": -4, "r": -3, "assets": 0, "quit": false}]}]}, {"title": "友人から、AIスタートアップの共同創業者に誘われた。給料は半分、株は15%。", "text": "", "opts": [{"t": "参加する", "s": "", "w": 2, "outs": [{"p": 0.3, "text": "3年後、大手に買収された。株で人生が変わった。", "cls": "red big", "j": 10, "h": -4, "r": 3, "assets": 8000, "quit": true}, {"p": 0.7, "text": "資金調達に失敗し、2年で解散した。経験だけが残った。", "cls": "red", "j": -8, "h": -5, "r": 1, "assets": -300, "quit": true}]}, {"t": "会社に残る", "s": "", "w": 2, "outs": [{"p": 0.8, "text": "安定した給料で、家を買う頭金ができた。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 300, "quit": false}, {"p": 0.2, "text": "その会社が上場したニュースを見て、スマホを置いた。", "cls": "", "j": -6, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "半導体エンジニア": [{"title": "台湾の大手ファウンドリから、年収1.5倍で引き抜きの声がかかった。", "text": "", "opts": [{"t": "台湾に行く", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "仕事は激務だったが、夜市と同僚に助けられ、5年で一人前になった。", "cls": "big", "j": 6, "h": -4, "r": 2, "assets": 800, "quit": true}, {"p": 0.4, "text": "言葉と働き方が合わず、1年で帰国した。", "cls": "red", "j": -8, "h": -3, "r": -2, "assets": 100, "quit": true}]}, {"t": "日本に残る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "国内の新工場で中核メンバーになった。", "cls": "", "j": 4, "h": -1, "r": 2, "assets": 100, "quit": false}, {"p": 0.3, "text": "会社が事業売却され、待遇が大きく変わった。", "cls": "red", "j": -6, "h": 0, "r": -1, "assets": -50, "quit": false}]}]}, {"title": "量産直前に、ごくまれに起きる不良の兆候を見つけた。報告すれば出荷が2週間遅れる。", "text": "", "opts": [{"t": "報告して止める", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "原因が見つかり、大規模リコールを防いだ。", "cls": "big", "j": 8, "h": -2, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "結局問題はなく、営業部から1か月恨まれた。", "cls": "", "j": -4, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "様子を見る", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "何も起きなかった。でもしばらく夢に出た。", "cls": "", "j": -1, "h": -1, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "出荷後に不良が発覚し、顧客対応で半年潰れた。", "cls": "red big", "j": -15, "h": -6, "r": -4, "assets": 0, "quit": false}]}]}], "機械設計エンジニア": [{"title": "納期1週間前、自分の設計で試作機が振動トラブルを起こした。", "text": "", "opts": [{"t": "徹夜で設計を見直す", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "補強リブを足して解決した。顧客から感謝の電話が来た。", "cls": "big", "j": 6, "h": -5, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "直したら別の場所が壊れた。納期は2週間遅れた。", "cls": "red", "j": -8, "h": -6, "r": -2, "assets": 0, "quit": false}]}, {"t": "上司に正直に相談", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "ベテランの一言で原因が分かった。もっと早く聞けばよかった。", "cls": "", "j": 4, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "「設計者だろ」と突き放され、結局一人でやった。", "cls": "red", "j": -6, "h": -3, "r": -3, "assets": 0, "quit": false}]}]}, {"title": "ベンチャーのロボット会社から、設計リーダーで来ないかと誘われた。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "自分の設計した配膳ロボが全国のファミレスで走り出した。", "cls": "big", "j": 9, "h": -2, "r": 2, "assets": 200, "quit": true}, {"p": 0.5, "text": "資金難で給料が3か月遅れた。", "cls": "red", "j": -10, "h": -3, "r": -1, "assets": -100, "quit": true}]}, {"t": "今の会社に残る", "s": "", "w": 2, "outs": [{"p": 0.8, "text": "課長になり、設計審査をする側になった。", "cls": "", "j": 3, "h": 0, "r": 2, "assets": 80, "quit": false}, {"p": 0.2, "text": "会社が海外に設計拠点を移し、仕事が減った。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": -50, "quit": false}]}]}], "土木技術者": [{"title": "地震で被災した町の道路復旧に、応援で3か月派遣される話が来た。", "text": "", "opts": [{"t": "手を挙げる", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "1か月で仮復旧させた。避難所のおばあちゃんにおにぎりをもらった。", "cls": "big", "j": 9, "h": -5, "r": 4, "assets": 30, "quit": false}, {"p": 0.3, "text": "過労で倒れ、途中で帰された。", "cls": "red", "j": -8, "h": -10, "r": 0, "assets": 0, "quit": false}]}, {"t": "今の現場を優先", "s": "", "w": 1, "outs": [{"p": 0.8, "text": "自分の現場は予定通り完成した。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.2, "text": "同期の活躍をニュースで見て、少し後悔した。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "発注者から、工期短縮のために安全手順を一部省略してくれと言われた。", "text": "", "opts": [{"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "工期は延びたが、無事故で竣工した。", "cls": "", "j": 5, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.3, "text": "次の入札で外された。", "cls": "red", "j": -6, "h": 0, "r": -3, "assets": -50, "quit": false}]}, {"t": "応じる", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "何事もなく工期に間に合った。", "cls": "", "j": 1, "h": 0, "r": 2, "assets": 20, "quit": false}, {"p": 0.4, "text": "作業員がケガをして、労基署の調査が入った。", "cls": "red big", "j": -16, "h": -4, "r": -5, "assets": 0, "quit": false}]}]}], "品質管理": [{"title": "出荷前の検査データが基準をわずかに外れた。上司は「誤差だから合格にしろ」と言う。", "text": "", "opts": [{"t": "不合格で止める", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "再検査で本当に不良だった。上司は何も言わなかったが、工場長に褒められた。", "cls": "big", "j": 7, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "再検査で問題なしだった。上司との関係が冷えた。", "cls": "", "j": -4, "h": 0, "r": -4, "assets": 0, "quit": false}]}, {"t": "言われた通り合格に", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "何も起きなかった。でもその記録を見るたび胸が痛んだ。", "cls": "", "j": -3, "h": -1, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "数年後、データ改ざんとして報道され、自分も聴取された。", "cls": "red big", "j": -20, "h": -5, "r": -5, "assets": 0, "quit": false}]}]}, {"title": "顧客から大型クレーム。現地に謝罪に行くか、データで原因究明を優先するか。", "text": "", "opts": [{"t": "すぐ謝罪に行く", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "誠意が伝わり、取引は続いた。", "cls": "", "j": 4, "h": -1, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "原因を聞かれて答えられず、かえって怒らせた。", "cls": "red", "j": -6, "h": -1, "r": -3, "assets": 0, "quit": false}]}, {"t": "原因究明を先に", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "3日で原因を特定し、対策書を持参して信頼された。", "cls": "", "j": 5, "h": -2, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "「なぜすぐ来ない」と取引を半分減らされた。", "cls": "red", "j": -8, "h": 0, "r": -3, "assets": 0, "quit": false}]}]}], "人事": [{"title": "エース社員がパワハラで訴えられた。役員は「穏便に」と言っている。", "text": "", "opts": [{"t": "きちんと調査して処分", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "処分が下り、相談者から「救われました」と手紙が来た。", "cls": "big", "j": 8, "h": -2, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "役員の怒りを買い、地方の支社に異動になった。", "cls": "red", "j": -10, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "穏便に済ませる", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "表面上は収まった。", "cls": "", "j": -2, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.5, "text": "被害者が退職し、SNSで告発されて会社が炎上した。", "cls": "red big", "j": -15, "h": -3, "r": -5, "assets": 0, "quit": false}]}]}, {"title": "採用面接で、経歴は普通だが目が輝いている応募者がいた。他の面接官は不採用推し。", "text": "", "opts": [{"t": "強く推す", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "入社3年でトップ営業になった。", "cls": "big", "j": 7, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.4, "text": "半年で辞めた。会議で気まずかった。", "cls": "", "j": -5, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "多数に従う", "s": "", "w": 2, "outs": [{"p": 0.8, "text": "いつもどおりの採用になった。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.2, "text": "その人が競合でヒット商品を作ったと聞いた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "経理": [{"title": "社長の飲食費の精算に、明らかに私的なものが混じっている。", "text": "", "opts": [{"t": "指摘する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "社長は「そうだったな」と自腹で精算した。意外と話が分かる人だった。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "翌月から仕事を減らされ、居づらくなった。", "cls": "red", "j": -8, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "黙って処理する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "何事もなく過ぎた。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "税務調査で否認され、追徴課税の責任を押し付けられた。", "cls": "red big", "j": -14, "h": -2, "r": -3, "assets": 0, "quit": false}]}]}, {"title": "経理の経験を活かして、税理士試験に挑戦するか迷った。合格まで平均10年と言われている。", "text": "", "opts": [{"t": "挑戦する", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "7年かけて5科目合格した。独立して年収が倍になった。", "cls": "big", "j": 10, "h": -4, "r": 0, "assets": 600, "quit": true}, {"p": 0.6, "text": "3科目で心が折れた。でも知識は仕事で役立った。", "cls": "", "j": -3, "h": -3, "r": -1, "assets": 0, "quit": false}]}, {"t": "やめておく", "s": "", "w": 2, "outs": [{"p": 0.8, "text": "定時で帰り、趣味のキャンプに打ち込んだ。", "cls": "", "j": 4, "h": 2, "r": 2, "assets": 0, "quit": false}, {"p": 0.2, "text": "後輩が合格したと聞いて、少し悔しかった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "秘書": [{"title": "担当役員から、業務外の私用（子どもの塾の送迎手配）まで頼まれるようになった。", "text": "", "opts": [{"t": "やんわり断る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "役員は「悪かった」と言い、以後は線を引いてくれた。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "担当を外され、総務の受付に回された。", "cls": "red", "j": -7, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "引き受ける", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "家族ぐるみで信頼され、役員の推薦で昇格した。", "cls": "", "j": 3, "h": -1, "r": 3, "assets": 30, "quit": false}, {"p": 0.4, "text": "どんどん頼まれごとが増え、休日も連絡が来るようになった。", "cls": "red", "j": -8, "h": -5, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "社内で、担当役員の不正の噂を耳にした。証拠になりそうなメールを見てしまった。", "text": "", "opts": [{"t": "コンプライアンス窓口に通報", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "調査が入り、役員は解任された。自分は守られた。", "cls": "big", "j": 5, "h": -2, "r": 1, "assets": 0, "quit": false}, {"p": 0.5, "text": "通報者が自分だと噂され、居づらくなって辞めた。", "cls": "red big", "j": -12, "h": -4, "r": -4, "assets": 0, "quit": true}]}, {"t": "見なかったことに", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "何も起きなかった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "後に不正が発覚し、秘書として事情聴取を受けた。", "cls": "red", "j": -10, "h": -3, "r": -2, "assets": 0, "quit": false}]}]}], "証券アナリスト": [{"title": "担当企業の業績が悪化しそうだと分析した。だが「売り」を出すと取材アクセスを切られる恐れがある。", "text": "", "opts": [{"t": "売り推奨を出す", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "予想が的中し、投資家からの評価が急上昇した。", "cls": "big", "j": 8, "h": 0, "r": 1, "assets": 200, "quit": false}, {"p": 0.4, "text": "会社に出入り禁止にされ、情報が入らなくなった。", "cls": "red", "j": -8, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "中立でお茶を濁す", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "無難に終わった。", "cls": "", "j": -1, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.3, "text": "株価が暴落し、「なぜ言わなかった」と顧客に詰められた。", "cls": "red", "j": -8, "h": -2, "r": -2, "assets": 0, "quit": false}]}]}, {"title": "ヘッジファンド  "assets": 30, "quit": false}, {"p": 0.4, "text": "上司に詰められ、給料が下がった。", "cls": "red", "j": -6, "h": -1, "r": -2, "assets": -20, "quit": false}]}, {"t": "高額プランを勧める", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "ノルマを達成し、ボーナスが出た。", "cls": "", "j": 1, "h": 0, "r": -1, "assets": 40, "quit": false}, {"p": 0.4, "text": "後で気づいたお客さんに解約され、口コミで悪評が広まった。", "cls": "red", "j": -10, "h": -1, "r": -4, "assets": -10, "quit": false}]}]}, {"title": "同じ会社の先輩から、独立して代理店を作らないかと誘われた。", "text": "", "opts": [{"t": "独立する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "法人顧客をつかみ、年収が2000万円になった。", "cls": "big", "j": 9, "h": -3, "r": 2, "assets": 1500, "quit": true}, {"p": 0.5, "text": "顧客が増えず、2年で廃業した。", "cls": "red", "j": -10, "h": -4, "r": -2, "assets": -300, "quit": true}]}, {"t": "会社に残る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "営業所長になった。", "cls": "", "j": 4, "h": -1, "r": 2, "assets": 100, "quit": false}, {"p": 0.3, "text": "ノルマが上がり続け、メンタルが限界になった。", "cls": "red", "j": -8, "h": -8, "r": -1, "assets": 0, "quit": false}]}]}], "弁理士": [{"title": "大手メーカーの知財部か、特許事務所での独立か、キャリアの分かれ道に立った。", "text": "", "opts": [{"t": "独立する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "中小企業の顧客がつき、年収1500万円になった。", "cls": "big", "j": 8, "h": -3, "r": 2, "assets": 800, "quit": true}, {"p": 0.5, "text": "顧客が集まらず、3年で事務所勤めに戻った。", "cls": "red", "j": -8, "h": -3, "r": -1, "assets": -200, "quit": true}]}, {"t": "企業内に入る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "安定した給料と、定時帰りを手に入れた。", "cls": "", "j": 5, "h": 2, "r": 1, "assets": 100, "quit": true}, {"p": 0.3, "text": "社内の調整ばかりで、書く仕事が減った。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 100, "quit": true}]}]}, {"title": "個人発明家から「絶対売れる」と特許出願を頼まれた。正直、先行技術があって通りそうにない。", "text": "", "opts": [{"t": "正直に伝える", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "がっかりされたが、50万円を無駄にせずに済んだと感謝された。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.3, "text": "怒って別の事務所に行ってしまった。", "cls": "", "j": -3, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "出願を受ける", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "案の定拒絶された。依頼人から恨みの電話が来た。", "cls": "red", "j": -7, "h": 0, "r": -3, "assets": 30, "quit": false}, {"p": 0.4, "text": "範囲を絞ったら奇跡的に登録された。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 30, "quit": false}]}]}], "社会保険労務士": [{"title": "顧問先の社長から「残業代を払わずに済む方法を考えて」と言われた。", "text": "", "opts": [{"t": "きちんと断って是正を勧める", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "社長は渋々従い、結果的に離職率が下がって感謝された。", "cls": "big", "j": 7, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.4, "text": "顧問契約を切られた。年36万円の売上が消えた。", "cls": "red", "j": -6, "h": 0, "r": -2, "assets": -36, "quit": false}]}, {"t": "グレーな方法を提案", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "社長は喜んだ。", "cls": "", "j": -2, "h": 0, "r": 1, "assets": 20, "quit": false}, {"p": 0.5, "text": "従業員に訴えられ、自分の名前も出て評判が落ちた。", "cls": "red big", "j": -15, "h": -3, "r": -4, "assets": -100, "quit": false}]}]}, {"title": "事務所を拡大して職員を3人雇うか、一人で続けるか迷った。", "text": "", "opts": [{"t": "職員を雇う", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "顧問先が100社を超え、自分は営業と相談に集中できるようになった。", "cls": "big", "j": 7, "h": 0, "r": 2, "assets": 800, "quit": false}, {"p": 0.4, "text": "職員の一人が辞めて、結局全部自分でやった。人件費だけ残った。", "cls": "red", "j": -7, "h": -4, "r": -1, "assets": -200, "quit": false}]}, {"t": "一人で続ける", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "気楽で、子どもの運動会にも全部行けた。", "cls": "", "j": 5, "h": 2, "r": 2, "assets": 100, "quit": false}, {"p": 0.3, "text": "繁忙期に体を壊した。", "cls": "red", "j": -6, "h": -8, "r": 0, "assets": 0, "quit": false}]}]}], "不動産鑑定士": [{"title": "依頼人から「この金額で評価書を書いてくれ」と、相場より3割高い数字を示された。", "text": "", "opts": [{"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.8, "text": "依頼は来なくなったが、裁判所の仕事が増えた。誠実さは見られていた。", "cls": "", "j": 6, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.2, "text": "大口の顧客を失い、年収が200万円下がった。", "cls": "red", "j": -6, "h": 0, "r": -1, "assets": -200, "quit": false}]}, {"t": "書く", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "報酬は高かった。", "cls": "", "j": -3, "h": 0, "r": 1, "assets": 150, "quit": false}, {"p": 0. じる。", "text": "", "opts": [{"t": "不起訴を主張", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "上司は渋々了承した。後に真犯人が別にいたと分かった。", "cls": "big", "j": 9, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.5, "text": "出世コースから外され、地方に異動になった。", "cls": "red", "j": -8, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "指示通り起訴", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "有罪判決が出た。", "cls": "", "j": 0, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "法廷で証拠の弱さを突かれ、無罪判決。報道で叩かれた。", "cls": "red big", "j": -14, "h": -3, "r": -2, "assets": 0, "quit": false}]}]}, {"title": "ヤメ検として大手法律事務所から年収2500万円で誘われた。", "text": "", "opts": [{"t": "弁護士に転身", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "企業の不祥事対応で引っ張りだこになった。", "cls": "big", "j": 6, "h": -2, "r": 1, "assets": 2000, "quit": true}, {"p": 0.3, "text": "守る側に回る違和感が消えなかった。", "cls": "", "j": -5, "h": 0, "r": 0, "assets": 1500, "quit": true}]}, {"t": "検事を続ける", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "特捜部に配属され、大型事件を手がけた。", "cls": "big", "j": 7, "h": -4, "r": 0, "assets": 100, "quit": false}, {"p": 0.3, "text": "仕事に追われ、家族と過ごす時間がなかった。", "cls": "red", "j": -6, "h": -3, "r": -3, "assets": 0, "quit": false}]}]}], "外交官": [{"title": "赴任国で政情不安が起き、本省は撤退を検討している。大使館に残る人員を募っている。", "text": "", "opts": [{"t": "残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "最後の日本人退避まで見届けた。後に感謝状が届いた。", "cls": "big", "j": 9, "h": -6, "r": 3, "assets": 0, "quit": false}, {"p": 0.4, "text": "銃声の夜を過ごし、帰国後もしばらく眠れなかった。", "cls": "red big", "j": -12, "h": -10, "r": 1, "assets": 0, "quit": false}]}, {"t": "退避する", "s": "", "w": 2, "outs": [{"p": 0.8, "text": "家族と一緒に無事帰国した。", "cls": "", "j": 2, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.2, "text": "残った同僚の苦労を聞き、申し訳なさが残った。", "cls": "", "j": -4, "h": 0, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "国際機関（国連）への出向の話が来た。給料は上がるが、キャリアは本省から外れる。", "text": "", "opts": [{"t": "出向する", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "ジュネーブで働き、世界中の友人ができた。", "cls": "big", "j": 8, "h": 0, "r": 3, "assets": 500, "quit": : "大型の撮影案件の直前、メインのカメラが故障した。", "text": "", "opts": [{"t": "予備機で撮る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "性能は劣ったが、腕でカバーして納品できた。", "cls": "", "j": 5, "h": -1, "r": 2, "assets": 0, "quit": false}, {"p": 0.3, "text": "画質が落ちてクレームが来た。", "cls": "red", "j": -6, "h": 0, "r": -2, "assets": -30, "quit": false}]}, {"t": "レンタルで最新機材を借りる", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "慣れない操作に苦戦したが、素晴らしい写真が撮れた。", "cls": "big", "j": 6, "h": -1, "r": 2, "assets": -10, "quit": false}, {"p": 0.4, "text": "操作に戸惑い、肝心のシーンを逃した。", "cls": "red", "j": -10, "h": 0, "r": -3, "assets": -10, "quit": false}]}]}, {"title": "ウェディング専門のスタジオから、正社員の誘いが来た。給料は安定するが、自由な作品作りはできなくなる。", "text": "", "opts": [{"t": "就職する", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "毎月の給料に安心し、結婚もできた。", "cls": "", "j": 6, "h": 2, "r": 3, "assets": 200, "quit": false}, {"p": 0.3, "text": "同じような写真ばかりで、カメラが嫌になりかけた。", "cls": "", "j": -5, "h": 0, "r": 0, "assets": 200, "quit": false}]}, {"t": "フリーを続ける", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "写真集を出版し、個展が話題になった。", "cls": "big", "j": 9, "h": 0, "r": 2, "assets": 100, "quit": false}, {"p": 0.6, "text": "仕事が途切れ、バイトを掛け持ちした。", "cls": "red", "j": -6, "h": -3, "r": 0, "assets": -100, "quit": false}]}]}], "NPO職員": [{"title": "大手企業から多額の寄付の申し出があったが、その企業は環境問題で批判されている。", "text": "", "opts": [{"t": "受け取る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "事業が拡大し、支援できる人が倍になった。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "SNSで「グリーンウォッシュに加担」と叩かれ、他の寄付者が離れた。", "cls": "red", "j": -10, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "理念は守れたが、事業の一部を縮小した。", "cls": "", "j": -2, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.3, "text": "その話を聞いた個人寄付者が増え、意外にも資金が集まった。", "cls": "big", "j": 8, "h": 0, "r": 3, "assets": 0, "quit": false}]}]}, {"title": "給料が上がらず、生活が苦しい。民間企業への転職を考えた。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "年収は200万円上がった。週末にボランティアとして関わり続けた。", function divorce(L,why){L.married=false;L.divorced=true;log(L,`${why}離婚した。${L.kids.length?(L.sex==="F"?"子どもは自分が引き取った。":"子どもは元妻が引き取り、養育費を払うことになった。"):""}`,"red");add(L,"j",-12);add(L,"r",-8);L.assets=Math.round(L.assets*.6)}

function recordChoice(L,d,o){if(!d||!o)return;(L.choices||(L.choices=[])).push({a:L.age,title:d.title,opt:o.t,moral:!!d.moral,done:0})}
function echoes(L){if(!L.choices||!L.choices.length)return;const x=L.age;for(const c of L.choices){if(c.done||x-c.a<4||R()>.06)continue;const e=ECHO.find(e=>e[0].test(c.title)&&e[1].test(c.opt));if(!e){c.done=1;continue}const cand=e[2].filter(l=>!(/子ども|息子|娘/.test(l[0])&&!L.kids.length)&&!(/職場|同僚|上司|同期/.test(l[0])&&!(JOBS[L.job]&&JOBS[L.job].reg)));if(!cand.length)continue;const [t,k,v]=pick(cand);c.done=1;log(L,`${t}（${c.a}歳のときの選択）`,v>0?"big echo":"red echo");add(L,k,v);return}}
function autoResolve(L,d){let nd=d;while(nd){const o=choose(L,nd.opts);recordChoice(L,nd,o);if(!nd.moral)L.events.push({a:L.age,t:nd.title+(nd.text?" "+nd.text:"")+" → "+o.t+(o.s?"（"+o.s+"）":""),cls:"note"});else L.events.push({a:L.age,t:nd.title+" → "+o.t,cls:"note"});nd=o.f()}}

  {t:"貸す",s:`${amt}万円。返ってくるかはわからない`,w:1,f(){L.assets-=amt;if(R()<.35){log(L,`${b.n}に${amt}万円貸した。3年かけて全額返してくれた。`);L.assets+=amt;add(L,"r",6)}else{log(L,`${b.n}に${amt}万円貸した。返ってこなかった。`,"red");add(L,"r",-3)}}},

function decFamilyBiz(L){const biz=L.parentJob==="農家"?"実家の農業":L.parentJob==="自営業"?pick(["実家の町工場","実家の酒屋","実家の工務店","実家の旅館","実家の和菓子屋","実家の歯科医院","実家のラーメン屋"]):"実家の店";return{moral:1,title:`父の${L.dad}が倒れ、「${biz}を継ぐか」と聞かれた。`,text:`年商${biz.includes("旅館")||biz.includes("歯科")?"8000万":"3000万"}円、借入${biz.includes("旅館")?"1億":"2000万"}円。従業員${biz.includes("農業")?"0":"4"}人。`,opts:[

function drawCurve(){const c=$("#cv");if(!c)return;const L=S.L,g=c.getContext("2d"),W=c.width,H=c.height,cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue("--sub"),ai=cs.getPropertyValue("--ai"),shu=cs.getPropertyValue("--shu"),rule=cs.getPropertyValue("--rule");
  g.clearRect(0,0,W,H);const pl=36,pb=26,pt=10,pr=10,X=x=>pl+x/110*(W-pl-pr),Y=y=>pt+(1-y)*(H-pt-pb);
  g.strokeStyle=rule;g.lineWidth=1;g.fillStyle=ink;g.font="20px IBM Plex Mono, monospace";
  [0,.5,1].forEach(v=>{g.beginPath();g.moveTo(pl,Y(v));g.lineTo(W-pr,Y(v));g.stroke();g.fillText(v*100+"%",0,Y(v)+6)});
  [0,50,100].forEach(v=>g.fillText(v,X(v)-10,H-2));
  g.strokeStyle=ai;g.lineWidth=3;g.beginPath();let s=1;const pts=[];
  for(let x=0;x<=110;x++){pts.push([x,s]);x===0?g.moveTo(X(x),Y(s)):g.lineTo(X(x),Y(s));s*=1-Math.min(1,qOf(L.lt.a,x,L.lt.q0))}g.stroke();
  const p=pts[Math.min(L.age,110)];g.fillStyle=L.alive?ai:shu;g.beginPath();g.arc(X(p[0]),Y(p[1]),7,0,7);g.fill();
}

function epitaph(L){const t=lifeTitle(L);return EPITAPH[t]||pick(["それなりに笑い、それなりに泣いた。","選べなかったことと、選んだことでできた一生だった。","大きな記録は残らなかった。小さな記憶はたくさん残った。","うまくいったことも、いかなかったことも、全部この人のものだった。"])}
function keyMoments(L,n){const KW=/結婚した|が生まれた|生まれた。|合格|として就職|として働きはじめ|起業|昇進|役員|離婚|亡くな|看取|逮捕|懲役|優勝|受賞|ノーベル|宝くじで1等|全壊|自己破産|生活保護を受ける|移住|召集|ドラフト|デビュー|プロ契約|初めての恋人|付き合いはじめた|プロポーズ|浪人|中退|再婚|博士|教授|当選|感謝状|助け/;
  const ev=L.events.map((e,i)=>({e,i})).filter(({e})=>e.t&&e.a>0&&!/^\d{4}年、/.test(e.t)&&/big|red/.test(e.cls));
  ev.forEach(o=>{o.s=(/big/.test(o.e.cls)?2:0)+(/red/.test(o.e.cls)?1.5:0)+(KW.test(o.e.t)?3:0)+(/亡くなった。\d+歳/.test(o.e.t)?-10:0)+R()*.5});
  const top=ev.sort((a,b)=>b.s-a.s).slice(0,n).sort((a,b)=>a.i-b.i);return top.map(o=>o.e)}
