p{margin:0}

.cert dt{color:var(--sub);font-size:13px}
.cert dd{margin:0;font-weight:500}

.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stat.money b{font-size:15px}
.stat{display:grid;gap:3px;min-width:0}
.stat .bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ai);transition:width .4s}
.stat span{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
.log{display:grid;gap:0;max-height:420px;overflow:auto;padding-right:4px}
.ev{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.ev .a{font-family:var(--mono);color:var(--sub);font-size:13px;padding-top:2px}
.ev.big p{font-weight:700}
.ev.red p{color:var(--shu)}
.ev.note p{color:var(--ai);font-family:var(--display)}
.decision{border:2px solid var(--shu);background:var(--sheet);padding:18px;border-radius:4px;display:grid;gap:12px}
.decision h3{font-size:19px}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:10px 14px;color:var(--ink)}
.choice:hover{border-color:var(--ai)}
.choice small{display:block;color:var(--sub);font-size:12px}
textarea,input[type=text]{width:100%;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:8px 10px}
select{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:6px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.help{font-size:12px;color:var(--sub);border-top:1px solid var(--rule);padding-top:10px}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.map i{aspect-ratio:1;background:var(--rule);border-radius:1px;opacity:.5}
.map i.c{opacity:1}
.others{display:grid;gap:8px;margin-top:8px}
.other{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;padding:8px 10px;background:var(--paper);border-radius:3px}
.other b{font-weight:700}
.other .s{grid-column:1/-1;color:var(--sub)}
.other.dead{opacity:.6}
canvas{width:100%;height:150px;display:block}
.end{display:grid;gap:14px}
.end h2{font-size:28px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}

.facts b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}

const fukDistOf=city=>{if(!city)return null;if(/福岡市/.test(city))return /中央区|早良区|西区|城南区/.test(city)?"第6学区":/南区/.test(city)?"第5学区":"第4学区";if(/北九州市/.test(city))return /八幡|若松/.test(city)?"第3学区":"第2学区";for(const k in FUK_DIST)if(city.startsWith(k))return FUK_DIST[k][0];if(/糟屋郡|古賀市|福津市/.test(city))return "第4学区";if(/那珂川|大野城|太宰府|筑紫野|春日/.test(city))return "第5学区";if(/糸島/.test(city))return "第6学区";if(/筑後市|八女/.test(city))return "第9学区";if(/大川|みやま|柳川|大牟田/.test(city))return "第10学区";if(/田川/.test(city))return "第11学区";if(/飯塚|嘉麻|嘉穂/.test(city))return "第12学区";if(/直方|宮若|鞍手/.test(city))return "第13学区";if(/行橋|豊前|京都郡|築上/.test(city))return "第1学区";if(/朝倉|うきは/.test(city))return "第7学区";if(/久留米|小郡|三井/.test(city))return "第8学区";return null};

const R=Math.random, pick=a=>a[Math.floor(R()*a.length)];
function wpick(items,w){if(!w.length)w=items.map(i=>i[1]);let t=w.reduce((a,b)=>a+b,0),r=R()*t;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[items.length-1]}
function poisson(m){let L=Math.exp(-m),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const B=0.105;
function qOf(a,x,q0){if(x===0)return q0;const h=a*Math.exp(B*x)+0.00012;return 1-Math.exp(-h)}
function e0(a,q0){let s=1,e=0;for(let x=0;x<125;x++){const q=Math.min(1,qOf(a,x,q0));e+=s*(1-q/2);s*=1-q}return e}
const lifeCache={};
function lifeTable(p,sex){const k=p.n+sex;if(lifeCache[k])return lifeCache[k];
  const q0=p.inf/p.b*(sex==="M"?1.1:.9), target=sex==="M"?p.leM:p.leF; let lo=1e-7,hi=1e-3;
  for(let i=0;i<60;i++){const m=Math.sqrt(lo*hi);e0(m,q0)>target?lo=m:hi=m}
  return lifeCache[k]={a:Math.sqrt(lo*hi),q0}}

function causeDetail(L){const c=L.cause,x=L.age,sex=L.sex;if(c==="がん")return pick(["肺がん","胃がん","大腸がん","膵臓がん",sex==="F"?"乳がん":"前立腺がん","肝臓がん","食道がん","悪性リンパ腫",x<45?"白血病":"胆管がん"]);if(c==="心疾患")return pick(["急性心筋梗塞","心不全","致死性不整脈","大動脈解離"]);if(c==="脳血管疾患")return pick(["脳梗塞","脳出血","くも膜下出血"]);if(c==="肺炎")return x>=80?"誤嚥性肺炎":"肺炎";if(c==="病気")return pick(["腎不全","肝硬変","敗血症","糖尿病の合併症","ALS","間質性肺炎","膵炎","腸閉塞"]);if(c==="老衰")return "老衰";if(c==="交通事故")return pick(["交通事故（歩行中）","交通事故（運転中）","交通事故（自転車）","交通事故（同乗中）"]);if(c==="転倒事故")return x>=70?"転倒による頭部外傷":"転落事故";return c}

function rarity(L){
  const F=L.flags,net=L.assets-L.debt,tl=(F.titles||[]).join(" "),isPro=JOBS[L.job]&&JOBS[L.job].pro;
  const c=[
    [/ノーベル/.test(tl),1e-6,"ノーベル賞"],
    [isPro||evHas(L,/ドラフト|プロ契約/),.02,"プロ選手"],
    [/MLB|NBA|メジャー/.test(tl)||evHas(L,/メジャー移籍|NBAに/),.02,"海外トップリーグ"],
    [/アイドル|芸人|俳優|タレント/.test(L.job)||evHas(L,/紅白|CDデビュー/),.005,"芸能界"],
    [/YouTuber|インフルエンサー/.test(L.job),.008,"配信で食べた"],
    [L.job==="プロゲーマー",.005,"プロゲーマー"],
    [F.giin,.03,"議員当選"],
    [L.univ&&/東京大学|京都大学/.test(L.univ.name),.06,"東大・京大"],
    [L.fac==="医学部"&&L.univ,.008,"医学部"],
    [F.phd,.02,"博士号"],
    [F.stuBizWin,.006,"学生起業で売却"],
    [net>=100000,.003,"資産10億"],
    [net>=10000&&net<100000,.15,"資産1億"],
    [net<-3000,.12,"借金3000万"],
    [L.age>=100,.025,"100歳超え"],
    [L.age<1,.002,"生後まもなく"],
    [L.age>=1&&L.age<20,.007,"20歳前に死去"],
    [(F.roninN||0)>=3,.01,`${F.roninN}浪`],
    [L.job==="暴力団員"||evHas(L,/組員になった|盃を/),.015,"暴力団"],
    [L.job==="服役中"||evHas(L,/逮捕され.*懲役|実刑判決/),.05,"服役"],
    [evHas(L,/冤罪だと今も/),.01,"冤罪"],
    [L.kids.length>=4,.04,"子4人以上"],
    [L.cause==="自殺",.07,"自死"],
    [evHas(L,/宝くじで1等が当たった/),1e-4,"宝くじ高額当選"],
    [evHas(L,/家が全壊した|アパートが倒壊し/),.15,"災害で家を失う"],
    [evHas(L,/感謝状/),.04,"人命救助"],
    [L.edu==="中卒"||(!L.hs&&L.age>=16),.08,"中卒"],
    [evHas(L,/再婚/)&&L.divorced,.05,"再婚"],
    [F.abroad,.08,"海外赴任"],
    [evHas(L,/同性/),.03,"同性パートナー"],
  ].filter(x=>x[0]);
  let p=1;c.forEach(x=>p*=x[1]);p=Math.max(p,1e-8);
  const one=Math.round(1/p);const n=one>=1e8?"1億人に1人":one>=1e4?Math.round(one/1e4)+"万人に1人":one>=1000?Math.round(one/100)*100+"人に1人":one>=10?one+"人に1人":"よくある";
  const rank=p<=1e-5?"SSR":p<=1e-3?"SR":p<=3e-2?"R":p<.5?"UC":"N";
  const stars={"SSR":"★★★★★","SR":"★★★★☆","R":"★★★☆☆","UC":"★★☆☆☆","N":"★☆☆☆☆"}[rank];
  return{rank,stars,p,text:n,tags:c.map(x=>x[2])};
}

const BGM={ctx:null,on:false,timer:null,gain:null,mood:0,step:0,
  init(){if(this.ctx)return;const c=this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.gain=c.createGain();this.gain.gain.value=0;
    const delay=c.createDelay(2);delay.delayTime.value=.42;const fb=c.createGain();fb.gain.value=.32;const wet=c.createGain();wet.gain.value=.28;const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
    this.bus=c.createGain();this.bus.connect(lp);lp.connect(this.gain);this.bus.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(this.gain);this.gain.connect(c.destination)},
  start(){this.init();this.ctx.resume();this.on=true;this.gain.gain.cancelScheduledValues(this.ctx.currentTime);this.gain.gain.setTargetAtTime(.22,this.ctx.currentTime,1.2);clearTimeout(this.timer);this.loop();try{localStorage.setItem("68man_bgm","1")}catch(e){}},
  stop(){this.on=false;if(this.gain)this.gain.gain.setTargetAtTime(0,this.ctx.currentTime,.8);clearTimeout(this.timer);try{localStorage.setItem("68man_bgm","0")}catch(e){}},
  pluck(freq,t,dur,vol){const c=this.ctx,o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();o.type="triangle";o2.type="sine";o.frequency.value=freq;o2.frequency.value=freq*2.001;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(vol*.3,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);o2.connect(g);g.connect(this.bus);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05)},
  pad(freq,t,dur,vol){const c=this.ctx,g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);
    [0,.003,-.004].forEach(d=>{const o=c.createOscillator();o.type="sine";o.frequency.value=freq*(1+d);o.connect(g);o.start(t);o.stop(t+dur+.1)});g.connect(this.bus)},
  loop(){if(!this.on)return;const c=this.ctx,t=c.currentTime+.05;const minor=this.mood<0;const base=minor?220*Math.pow(2,-3/12):220;
    const prog=minor?[[0,3,7],[8,0,3],[3,7,10],[10,2,5]]:[[0,4,7],[7,11,2],[9,0,4],[5,9,0]];const ch=prog[this.step%4];this.step++;const bar=4.0;
    const f=st=>base*Math.pow(2,st/12);
    this.pad(f(ch[0])/2,t,bar+1,.07);this.pad(f(ch[1]),t,bar+1,.045);this.pad(f(ch[2]),t,bar+1,.04);
    const scale=minor?[0,2,3,5,7,8,10,12,14,15]:[0,2,4,5,7,9,11,12,14,16];let last=4;
    for(let i=0;i<8;i++){if(Math.random()<.3)continue;const step=Math.max(0,Math.min(scale.length-1,last+Math.round((Math.random()-.5)*4)));last=step;const deg=scale[step];this.pluck(f(deg)*2,t+i*bar/8+(Math.random()*.03),1.2,.16)}
    if(Math.random()<.5)this.pluck(f(ch[0]),t+bar/2,1.6,.1);
    this.timer=setTimeout(()=>this.loop(),bar*1000)}};

const BREATH={5:"5歳のとき、あなたはどこで、誰と暮らしていましたか。",15:"15歳のあなたが一番悩んでいたことは何でしたか。",30:"30歳の自分を、15歳のころに想像できましたか。",50:"この人とあなたの人生、いちばん違うのはどこですか。",70:"70歳まで生きるのは、当たり前のことだと思いますか。"};
function year(){
  const L=S.L;if(S.pause||S.dec||S.breath||!L.alive)return;
  const d=stepYearAll(L);
  if(d){const ask=!S.auto&&!d.auto&&(d.moral||S.paths);if(!ask)autoResolve(L,d);else{S.dec=d;showDec(d)}}
  render();const last=L.events.slice(-3);BGM.mood=last.some(e=>/red/.test(e.cls))?-1:(L.st.j>55?1:0);
  if(!L.alive){clearInterval(S.timer);BGM.mood=-1;setTimeout(()=>{BGM.stop();ending()},1400);return}
  if(BREATH[L.age]&&!S.auto&&!S.dec){S.breath=1;showBreath(L.age)}
  if(!S.dec)L.age++;
}
function showDec(d){const L=S.L;
  $("#dec").innerHTML=`<div class="decision"><span class="label">決断　${L.age}歳</span><h3>${esc(d.title)}</h3>${d.text?`<p class="muted">${esc(d.text)}</p>`:""}
    <div class="choices">${d.opts.map((o,i)=>`<button class="choice" data-i="${i}">${esc(o.t)}${o.s?`<small>${esc(o.s)}</small>`:""}</button>`).join("")}</div></div>`;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const nd=d.opts[+b.dataset.i].f();if(nd){S.dec=nd;showDec(nd);render();return}S.dec=null;$("#dec").innerHTML="";S.L.age++;render()});
  $("#dec").scrollIntoView({block:"nearest"});
}
function showBreath(a){
  $("#dec").innerHTML=`<div class="decision" style="border-color:var(--ai)"><span class="label">ひと息　${a}歳</span><h3>${BREATH[a]}</h3>
  <textarea id="bt" rows="2" placeholder="よければ一行（この端末にだけ残ります）"></textarea>
  <div><button class="btn" id="bn">続ける</button></div></div>`;
  $("#bn").onclick=()=>{const v=$("#bt").value.trim();if(v){S.L.notes.push({a,t:v});S.L.events.push({a,t:"「"+v+"」",cls:"note"})}S.breath=null;$("#dec").innerHTML="";render()};
}
function jobLine(L){const a=L.age;if(a<15)return"";if(L.hs&&a<18)return L.hs.name;if(L.univ&&a<L.univGrad)return`${L.univ.name} ${L.fac}`;if(L.prison)return"服役中";if(L.job)return`${L.job}${L.company?"・"+L.company:""}`;return""}
function render(){const L=S.L;if(!$("#age"))return;
  $("#age").innerHTML=`${L.age}<small>歳</small><small style="margin-left:8px;color:var(--sub)">${L.birthYear+L.age}年</small>`;$("#where").textContent=L.where===L.home?L.home+L.city:`${L.home}${L.city}生まれ・${L.where}暮らし`;$("#jobline").textContent=jobLine(L);
  $("#stats").innerHTML=[["h","健康"],["j","幸福"],["k","知識"],["r","人間関係"]].map(([k,n])=>`<div class="stat"><span>${n}<b class="num">${Math.round(L.st[k])}</b></span><div class="bar"><i style="width:${L.st[k]}%"></i></div></div>`).join("")
    +`<div class="stat money"><span>年収</span><b class="num">${L.age>=18?yen(L.income):"―"}</b></div><div class="stat money"><span>資産</span><b class="num" style="color:${(L.assets-L.debt)<0?"var(--shu)":"inherit"}">${L.age>=18?(L.assets-L.debt<0?"−":"")+yen(Math.abs(L.assets-L.debt)):"―"}</b></div>`;
  $("#log").innerHTML=L.events.filter(e=>e.t).slice().reverse().map(e=>`<div class="ev ${e.cls}"><span class="a">${e.a}歳</span><p>${esc(e.t)}</p></div>`).join("");
  $("#oth").innerHTML=S.others.map(o=>{const h=o.hist[Math.min(L.age,o.hist.length-1)],dead=L.age>=o.hist.length-1&&!o.L.alive;
    return`<div class="other ${dead?"dead":""}"><b>${o.L.name}</b><span class="muted">${o.L.home}</span><span class="s">${esc(h)}</span></div>`}).join("");
  document.querySelectorAll("#map i").forEach((c,i)=>{if(i<=L.age&&i<100){c.classList.add("c");c.style.background=i===L.age&&!L.alive?"var(--shu)":i<18?"var(--moss)":L.retired&&i>=65?"var(--sub)":"var(--ai)"}});
  drawCurve();
}
function drawCurve(){const c=$("#cv");if(!c)return;const L=S.L,g=c.getContext("2d"),W=c.width,H=c.height,cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue("--sub"),ai=cs.getPropertyValue("--ai"),shu=cs.getPropertyValue("--shu"),rule=cs.getPropertyValue("--rule");
  g.clearRect(0,0,W,H);const pl=36,pb=26,pt=10,pr=10,X=x=>pl+x/110*(W-pl-pr),Y=y=>pt+(1-y)*(H-pt-pb);
  g.strokeStyle=rule;g.lineWidth=1;g.fillStyle=ink;g.font="20px IBM Plex Mono, monospace";
  [0,.5,1].forEach(v=>{g.beginPath();g.moveTo(pl,Y(v));g.lineTo(W-pr,Y(v));g.stroke();g.fillText(v*100+"%",0,Y(v)+6)});
  [0,50,100].forEach(v=>g.fillText(v,X(v)-10,H-2));
  g.strokeStyle=ai;g.lineWidth=3;g.beginPath();let s=1;const pts=[];
  for(let x=0;x<=110;x++){pts.push([x,s]);x===0?g.moveTo(X(x),Y(s)):g.lineTo(X(x),Y(s));s*=1-Math.min(1,qOf(L.lt.a,x,L.lt.q0))}g.stroke();
  const p=pts[Math.min(L.age,110)];g.fillStyle=L.alive?ai:shu;g.beginPath();g.arc(X(p[0]),Y(p[1]),7,0,7);g.fill();
}

function drawCard(L){
  const W=1200,H=630,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  const title=lifeTitle(L),ra=rarity(L),net=L.assets-L.debt;
  g.fillStyle="#fbfcfd";g.fillRect(0,0,W,H);g.fillStyle="#eef1f4";g.fillRect(0,0,W,14);g.fillRect(0,H-14,W,14);
  g.strokeStyle="#cfd6e0";g.lineWidth=2;g.strokeRect(36,36,W-72,H-72);
  g.fillStyle="#5b6577";g.font="500 22px 'Zen Kaku Gothic New',sans-serif";g.fillText("1億2380万分の1　―　最期の記録",70,90);
  g.fillStyle="#1d2533";g.font="900 64px 'Zen Old Mincho',serif";g.fillText(title,70,180);
  g.font="700 40px 'Zen Old Mincho',serif";g.fillText(`${L.name}　${L.age}歳`,70,245);
  g.fillStyle="#5b6577";g.font="500 24px 'Zen Kaku Gothic New',sans-serif";
  const path=[L.home+(L.town||"")+"生まれ",L.hs?L.hs.name.replace(/\(.*$/,""):null,L.univ?L.univ.name+(L.fac?" "+L.fac:""):L.edu==="専門"?"専門学校":null,L.job||"無職"].filter(Boolean).join(" → ");
  const wrap=(s,max)=>{const out=[];let cur="";for(const ch of s){cur+=ch;if(g.measureText(cur).width>max){out.push(cur);cur=""}}if(cur)out.push(cur);return out};
  let y=300;wrap(path,W-140).forEach(l=>{g.fillText(l,70,y);y+=34});
  y+=10;g.fillStyle="#1d2533";g.font="500 26px 'Zen Kaku Gothic New',sans-serif";
  const facts=[`死因：${L.cause==="自殺"?"自死":(L.causeDetail||L.cause)}`,`生涯年収 ${yen(L.lifetime)}　遺した資産 ${(net<0?"−":"")+yen(Math.abs(net))}`,`${L.partner?L.partner+"と結婚":"生涯独身"}${L.kids.length?"・子"+L.kids.length+"人":""}`];
  facts.forEach(f=>{g.fillText(f,70,y);y+=38});
  g.fillStyle="#c8372d";g.font="700 28px 'Zen Kaku Gothic New',sans-serif";g.fillText(`${ra.stars}　${ra.text}の人生`,70,H-80);
  g.save();g.translate(W-150,130);g.rotate(-.12);g.strokeStyle="#c8372d";g.lineWidth=5;g.strokeRect(-60,-60,120,120);g.fillStyle="#c8372d";g.font="900 44px 'Zen Old Mincho',serif";g.textAlign="center";g.fillText("死亡",0,-6);g.fillText("届出",0,42);g.restore();
  g.fillStyle="#9aa4b5";g.font="500 18px 'IBM Plex Mono',monospace";g.textAlign="right";g.fillText("kikt6.github.io/1oku2380man",W-70,H-80);
  return cv;
}

function ending(){
  track("life-end","人生を終えた");
  const L=S.L,le=L.sex==="M"?L.p.leM:L.p.leF,diff=(L.age-le).toFixed(1),wk=wakatte(L);
  const mem=loadMem();mem.unshift({name:L.name,pref:L.home,age:L.age,cause:L.cause,job:L.job});saveMem(mem);
  const lastJob=[...L.events].reverse().find(e=>/就職|働きはじめた|転職|組員|昇進/.test(e.t));
  const others=S.others.map(o=>`<div><span>${o.L.name}（${o.L.home}・${o.L.univ?o.L.univ.name:o.L.hs?o.L.hs.name:""}）</span><span class="num muted">${o.L.age}歳・${o.L.cause}・資産${yen(o.L.assets)}</span></div>`).join("");

    <p>${L.home}${L.town||""}に生まれ、${L.where===L.home?"その土地で":L.where+"で"}暮らした。${L.cause==="自殺"?"自ら命を絶った。":(L.causeDetail||L.cause)+"で亡くなった。"}${(L.assets-L.debt)<-100?`借金${yen(Math.abs(L.assets-L.debt))}を残した。${L.kids.length||L.married?"家族は相続放棄をした。":"相続人はいなかった。"}`:""}</p>
    <div class="facts">

      <div><span class="label">学歴ポイント</span><b>${wk?wk+"pt":"―"}</b><span class="muted" style="font-size:11px">${wk?(L.univ?`偏差値${L.univ.dev}${L.track==="理"?"　理系（＋５）":""}${L.univ.type==="国公立"?"　国公立（＋５）":""}${L.fac==="医学部"?"　医学部（＋５）":""}`:`高校偏差値${L.hs.dev}（−５）`):""}</span></div>
      ${L.flags.titles&&L.flags.titles.length?`<div><span class="label">タイトル</span><b style="font-family:var(--body);font-size:13px">${esc(L.flags.titles.join("、"))}</b></div>`:""}
      <div><span class="label">最後の職業</span><b style="font-family:var(--body);font-size:15px">${esc(L.job||"―")}</b></div>

      <div><span class="label">遺した資産</span><b style="color:${(L.assets-L.debt)<0?"var(--shu)":"inherit"}">${(L.assets-L.debt<0?"−":"")+yen(Math.abs(L.assets-L.debt))}</b></div>
      <div><span class="label">家族</span><b style="font-family:var(--body);font-size:15px">${L.sibs.length?"きょうだい"+L.sibs.length+"人・":"一人っ子・"}${L.partner?esc(L.partner)+"と結婚":"生涯独身"}${L.divorced?"・離婚":""}${L.kids.length?"・子"+L.kids.map(k=>k.n).join("、"):""}</b></div>

    <div class="row"><label class="label" for="lw">この人にひとこと</label><input type="text" id="lw" placeholder="おつかれさま"></div>

  $("#again").onclick=()=>birth();$("#tohome").onclick=home;if($("#rebirth"))$("#rebirth").onclick=()=>birth(L);window.scrollTo({top:0});

}
