: 0, "quit": false}]}, {"t": "退学に賛成", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "その子は学校を去った。その後どうしているかは知らない。", "cls": "", "j": -4, "h": 0, "r": -1, "assets": 0, "quit": false}, {"p": 0.4, "text": "5年後、その子が「あのとき辞めてよかった」と働く姿を見せに来た。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 0, "quit": false}]}]}, {"title": "強豪私立から、野球部監督として引き抜きの話が来た。", "text": "", "opts": [{"t": "移る", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "3年目に甲子園に出た。アルプススタンドで泣いた。", "cls": "big", "j": 10, "h": -3, "r": 2, "assets": 200, "quit": true}, {"p": 0.6, "text": "結果が出せず、OB会に叩かれて2年で解任された。", "cls": "red", "j": -8, "h": -3, "r": -2, "assets": 0, "quit": true}]}, {"t": "今の学校に残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "公立で地道に教えた。大会では毎回2回戦負けだが、生徒たちは楽しそうだった。", "cls": "", "j": 3, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "10年後、教え子がプロ野球のドラフトで指名された。テレビの前で泣いた。", "cls": "big", "j": 8, "h": 0, "r": 2, "assets": 0, "quit": false}]}]}], "薬剤師": [{"title": "処方の量がおかしい気がする。医師は不機嫌で忙しそうだ。", "text": "", "opts": [{"t": "疑義照会する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "やはり10倍量の誤記だった。医師から後日、缶コーヒーが届いた。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.3, "text": "「合ってる」と怒鳴られた。合っていた。", "cls": "", "j": -3, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "そのまま出す", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "問題はなかった。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "患者が副作用で救急搬送された。眠れない日が続いた。", "cls": "red big", "j": -15, "h": -4, "r": -2, "assets": -50, "quit": false}]}]}, {"title": "ドラッグストア本部から、店長への昇格を打診された。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "年収が120万円上がった。ただ、トイレットペーパーの売上目標にも追われるようになった。", "cls": "", "j": 1, "h": -3, "r": 0, "assets": 120, "quit": false}, {"p": 0.5, "text": "シフトの穴を自分で埋め続け、月の休みが4日になった。", "cls": "red", "j": -6, "h": -6, "r": -1, "assets": 120, "quit": false}]}, {"t": "調剤に専念", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "患者の顔と薬歴を覚え、「あなたに聞くと安心」と言われるようになった。", "cls": "", "j": 4, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.4, "text": "給料は上がらず、同期の店長たちと差がついた。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": -50, "quit": false}]}]}], "研究者": [{"title": "企業の研究所から、任期なしで年収1.5倍のオファーが来た。", "text": "", "opts": [{"t": "企業へ移る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "研究テーマは選べないが、生活が安定し、子どもを持つ決心がついた。", "cls": "", "j": 5, "h": 1, "r": 2, "assets": 600, "quit": true}, {"p": 0.3, "text": "3年後に事業撤退で研究所ごと閉鎖された。", "cls": "red", "j": -6, "h": -1, "r": 0, "assets": 200, "quit": true}]}, {"t": "アカデミアに残る", "s": "", "w": 2, "outs": [{"p": 0.3, "text": "成果が大きな雑誌に載り、准教授のポストを得た。", "cls": "big", "j": 10, "h": -2, "r": 1, "assets": 100, "quit": false}, {"p": 0.7, "text": "任期が切れ、また次の任期付きポストへ移った。", "cls": "red", "j": -5, "h": -2, "r": 0, "assets": -100, "quit": false}]}]}, {"title": "共同研究者が、データを少し「整えた」形跡がある。", "text": "", "opts": [{"t": "指摘する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "論文は取り下げになったが、研究室の信頼は守られた。", "cls": "", "j": 2, "h": -2, "r": -2, "assets": 0, "quit": false}, {"p": 0.4, "text": "告発者として居づらくなり、研究室を出た。", "cls": "red", "j": -8, "h": -2, "r": -4, "assets": 0, "quit": false}]}, {"t": "黙っている", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "何事もなく論文は出た。ずっと心に引っかかっている。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "2年後に不正が発覚し、共著者として巻き込まれた。", "cls": "red big", "j": -15, "h": -3, "r": -4, "assets": 0, "quit": false}]}]}], "システムエンジニア": [{"title": "炎上案件のPMを任された。納期まであと2か月。", "text": "", "opts": [{"t": "引き受ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "毎晩終電で何とか納めた。社長賞で金一封5万円をもらった。", "cls": "big", "j": 4, "h": -8, "r": 2, "assets": 5, "quit": false}, {"p": 0.5, "text": "納期に間に合わず、顧客に詰められ続けた。", "cls": "red", "j": -8, "h": -8, "r": -2, "assets": 0, "quit": false}]}, {"t": "断って転職活動", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "Web系の自社開発企業に移った。私服で出社でき、年収も80万円上がった。", "cls": "", "j": 6, "h": 2, "r": 0, "assets": 80, "quit": true}, {"p": 0.3, "text": "転職先もSESだった。", "cls": "red", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": true}]}]}, {"title": "社内ツールを勝手に作ったら、業務時間が半分になった。上司は「誰の許可で？」と言う。", "text": "", "opts": [{"t": "正式に提案する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "全社展開され、部署の残業が月20時間減った。", "cls": "big", "j": 6, "h": 1, "r": 3, "assets": 0, "quit": false}, {"p": 0.4, "text": "「前例がない」と却下された。こっそり使い続けている。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "副業で売る", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "SaaSにしたら月30万円の売上になった。", "cls": "big", "j": 8, "h": -2, "r": 0, "assets": 360, "quit": false}, {"p": 0.6, "text": "ユーザーは12人で止まった。", "cls": "", "j": -1, "h": -1, "r": 0, "assets": 10, "quit": false}]}]}], "営業": [{"title": "大口顧客に、不利な条件を隠して売るよう上司に言われた。", "text": "", "opts": [{"t": "正直に説明", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "契約は取れなかったが、半年後にその客が別の大口を紹介してくれた。", "cls": "big", "j": 6, "h": 0, "r": 3, "assets": 50, "quit": false}, {"p": 0.5, "text": "ノルマ未達で賞与が30万円減った。", "cls": "red", "j": -4, "h": 0, "r": -1, "assets": -30, "quit": false}]}, {"t": "言われた通り売る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "売上トップになった。でも客の顔が見られなくなった。", "cls": "", "j": -2, "h": -1, "r": -1, "assets": 80, "quit": false}, {"p": 0.4, "text": "後でクレームになり、担当を外された。", "cls": "red", "j": -8, "h": -2, "r": -3, "assets": 0, "quit": false}]}]}, {"title": "ライバル会社からトップ営業として引き抜きがあった。顧客ごと来てほしいと言う。", "text": "", "opts": [{"t": "移る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "年収が300万円上がった。古巣の上司とは二度と口をきかなくなった。", "cls": "big", "j": 4, "h": 0, "r": -3, "assets": 300, "quit": true}, {"p": 0.5, "text": "顧客はついてこなかった。", "cls": "red", "j": -6, "h": 0, "r": -2, "assets": 0, "quit": true}]}, {"t": "残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "残ったことを知った部長が、次の人事で課長にしてくれた。", "cls": "", "j": 4, "h": 0, "r": 2, "assets": 60, "quit": false}, {"p": 0.4, "text": "引き止めの約束は守られず、課長の席は別の人に回った。", "cls": "red", "j": -5, "h": 0, "r": -2, "assets": 0, "quit": false}]}]}], "看護師": [{"title": "師長から、来月からICU配属を打診された。", "text": "", "opts": [{"t": "挑戦する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "必死で勉強し、2年後には後輩に教える側になった。", "cls": "big", "j": 6, "h": -3, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "重症患者の緊張に耐えられず、眠れなくなった。", "cls": "red", "j": -6, "h": -6, "r": 0, "assets": 0, "quit": false}]}, {"t": "今の病棟に残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "慣れた病棟で、患者さんの話をゆっくり聞ける日々を選んだ。", "cls": "", "j": 2, "h": 1, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "病棟の人手不足が悪化し、夜勤が月10回になった。", "cls": "red", "j": -4, "h": -5, "r": 0, "assets": 10, "quit": false}]}]}, {"title": "美容クリニックから、日勤のみ・年収600万円で誘われた。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "夜勤がなくなり、肌の調子が良くなった。ただ、ノルマがあった。", "cls": "", "j": 3, "h": 4, "r": 0, "assets": 150, "quit": true}, {"p": 0.4, "text": "「人を看る」実感がなくなり、2年で病院に戻った。", "cls": "", "j": -3, "h": 2, "r": 0, "assets": 100, "quit": true}]}, {"t": "病院に残る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "主任になった。夜勤は減らないが、チームが好きだ。", "cls": "", "j": 3, "h": -2, "r": 3, "assets": 30, "quit": false}, {"p": 0.5, "text": "燃え尽きかけたが、同期と行った温泉旅行で持ち直した。", "cls": "", "j": 1, "h": -2, "r": 2, "assets": -5, "quit": false}]}]}], "公務員": [{"title": "新しい子育て支援事業を企画した。前例がないと上が渋っている。", "text": "", "opts": [{"t": "押し通す", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "事業が始まり、地元紙に載った。利用者が年1000人を超えた。", "cls": "big", "j": 8, "h": -2, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "根回し不足で議会で叩かれ、出先機関に異動になった。", "cls": "red", "j": -6, "h": -1, "r": -2, "assets": 0, "quit": false}]}, {"t": "前例に従う", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "何も起きなかった。定時で帰れた。", "cls": "", "j": 0, "h": 1, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "翌年、隣の市が同じ事業を始めて全国ニュースになった。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "地元の有力者から「便宜を図ってくれ」と頼まれた。", "text": "", "opts": [{"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "角が立ったが、上司は「よく断った」と言ってくれた。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.3, "text": "嫌がらせの投書が何度も庁内に届いた。", "cls": "red", "j": -4, "h": -2, "r": -1, "assets": 0, "quit": false}]}, {"t": "少し融通する", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "お歳暮が毎年届くようになった。", "cls": "", "j": 0, "h": 0, "r": 1, "assets": 5, "quit": false}, {"p": 0.4, "text": "監査で発覚し、懲戒処分になった。", "cls": "red big", "j": -15, "h": -3, "r": -3, "assets": -100, "quit": true}]}]}], "一般事務": [{"title": "会社がRPAを導入し、業務の半分がなくなると言われた。", "text": "", "opts": [{"t": "ツールの担当になる", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "社内のDX担当として評価され、主任になった。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 40, "quit": false}, {"p": 0.4, "text": "慣れない仕事で毎日残業になった。", "cls": "", "j": -3, "h": -3, "r": 0, "assets": 10, "quit": false}]}, {"t": "今の仕事を続ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "人手がまだ必要で、そのまま残れた。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "1年後、部署が縮小されて関連会社に出向になった。", "cls": "red", "j": -5, "h": 0, "r": -1, "assets": -30, "quit": false}]}]}, {"title": "簿記2級の勉強を始めるか迷っている。", "text": "", "opts": [{"t": "勉強する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "半年で合格し、経理部に異動して手当が月1万円ついた。", "cls": "", "j": 5, "h": -1, "r": 0, "assets": 12, "quit": false}, {"p": 0.4, "text": "2回落ちて心が折れた。", "cls": "", "j": -3, "h": -1, "r": 0, "assets": -2, "quit": false}]}, {"t": "趣味に使う", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "平日の夜はヨガ教室に通い始めた。", "cls": "", "j": 4, "h": 3, "r": 2, "assets": -6, "quit": false}, {"p": 0.4, "text": "ヨガ教室で出会った人と、2年後に結婚した。", "cls": "big", "j": 8, "h": 3, "r": 4, "assets": -50, "quit": false}]}]}], "建設作業員": [{"title": "親方が引退し、一人親方として独立しないかと言われた。", "text": "", "opts": [{"t": "独立する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "元請けから仕事が途切れず、年収が200万円上がった。", "cls": "big", "j": 6, "h": -2, "r": 1, "assets": 200, "quit": false}, {"p": 0.5, "text": "支払いが3か月遅れる元請けに当たり、資金繰りに苦しんだ。", "cls": "red", "j": -6, "h": -3, "r": 0, "assets": -150, "quit": false}]}, {"t": "会社員のまま", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "安定した給料で、職長になった。", "cls": "", "j": 2, "h": 0, "r": 2, "assets": 30, "quit": false}, {"p": 0.4, "text": "会社が倒産し、退職金はほとんど出なかった。", "cls": "red", "j": -6, "h": 0, "r": -1, "assets": -50, "quit": false}]}]}, {"title": "工期が遅れていて、安全帯なしで作業しろと言われた。", "text": "", "opts": [{"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "揉めたが、所長が間に入ってくれた。", "cls": "", "j": 2, "h": 0, "r": -1, "assets": 0, "quit": false}, {"p": 0.3, "text": "「使えない」と言われて別の現場に回された。", "cls": "", "j": -3, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "やる", "s": "", "w": 1, "outs": [{"p": 0.7, "text": "何事もなく終わった。", "cls": "", "j": 0, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.3, "text": "足を滑らせて落ち、骨折で3か月休んだ。", "cls": "red big", "j": -10, "h": -15, "r": 0, "assets": -60, "quit": false}]}]}], "電気工事士": [{"title": "第一種電気工事士と電験三種の勉強を始めるか迷っている。", "text": "", "opts": [{"t": "勉強する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "3年かけて電験三種に合格した。ビル管理会社から引く手あまたになった。", "cls": "big", "j": 8, "h": -2, "r": 0, "assets": 150, "quit": false}, {"p": 0.5, "text": "仕事と両立できず、途中でやめた。", "cls": "", "j": -3, "h": -1, "r": 0, "assets": 0, "quit": false}]}, {"t": "現場一本", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "腕で勝負した。若手から「師匠」と呼ばれるようになった。", "cls": "", "j": 3, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "50歳を過ぎて膝を痛め、高所作業ができなくなった。", "cls": "red", "j": -5, "h": -6, "r": 0, "assets": -30, "quit": false}]}]}, {"title": "知り合いから、資格なしの友人にやらせた工事の手直しを格安で頼まれた。", "text": "", "opts": [{"t": "きちんと直す", "s": "正規料金で", "w": 2, "outs": [{"p": 0.6, "text": "文句を言われたが、安全な配線に直した。", "cls": "", "j": 2, "h": 0, "r": -1, "assets": 10, "quit": false}, {"p": 0.4, "text": "丁寧な仕事が評判になり、近所の工務店から仕事が回ってくるようになった。", "cls": "big", "j": 5, "h": 0, "r": 2, "assets": 80, "quit": false}]}, {"t": "格安で受ける", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "感謝され、知り合いから仕事が増えた。", "cls": "", "j": 3, "h": -1, "r": 2, "assets": 5, "quit": false}, {"p": 0.4, "text": "他の箇所から漏電し、責任を問われた。", "cls": "red", "j": -8, "h": 0, "r": -2, "assets": -50, "quit": false}]}]}], "トラック運転手": [{"title": "中古の4tトラックを買って、個人で独立するか考えている。", "text": "", "opts": [{"t": "独立する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "いい荷主がついて年収が700万円になった。", "cls": "big", "j": 6, "h": -3, "r": 0, "assets": 300, "quit": false}, {"p": 0.5, "text": "燃料高騰で赤字が続き、2年で会社員に戻った。", "cls": "red", "j": -8, "h": -2, "r": 0, "assets": -400, "quit": false}]}, {"t": "会社に残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "運行管理者の資格を取り、内勤に移った。", "cls": "", "j": 2, "h": 3, "r": 1, "assets": 20, "quit": false}, {"p": 0.4, "text": "会社の大型車が自動運転の実験に使われ、運転席に座るだけの日が来た。", "cls": "", "j": 1, "h": 1, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "配車係から、休憩を削れば今日中に終わると言われた。", "text": "", "opts": [{"t": "断って休む", "s": "", "w": 3, "outs": [{"p": 0.8, "text": "翌日に回したが、事故なく帰れた。", "cls": "", "j": 2, "h": 1, "r": 0, "assets": 0, "quit": false}, {"p": 0.2, "text": "配車係に嫌われ、割のいい便を回されなくなった。", "cls": "", "j": -3, "h": 0, "r": -2, "assets": -20, "quit": false}]}, {"t": "休まず走る", "s": "", "w": 1, "outs": [{"p": 0.7, "text": "なんとか間に合った。", "cls": "", "j": 0, "h": -3, "r": 0, "assets": 1, "quit": false}, {"p": 0.3, "text": "居眠りで追突事故を起こした。", "cls": "red big", "j": -15, "h": -10, "r": -2, "assets": -100, "quit": true}]}]}], "介護職員": [{"title": "介護福祉士を取ったら、主任に推薦すると言われた。", "text": "", "opts": [{"t": "受験する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "合格して主任になった。手当で月2万円上がった。", "cls": "", "j": 5, "h": -1, "r": 1, "assets": 24, "quit": false}, {"p": 0.3, "text": "不合格だった。来年また受ける。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "断る", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "現場で利用者さんと向き合うのが好きなので、そのままにした。", "cls": "", "j": 1, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "新しく来た主任と合わず、現場の雰囲気が悪くなった。", "cls": "", "j": -3, "h": -1, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "同僚が利用者に乱暴な言葉を使っているのを見た。", "text": "", "opts": [{"t": "上に報告する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "指導が入り、施設の空気が少しよくなった。", "cls": "", "j": 3, "h": 0, "r": -1, "assets": 0, "quit": false}, {"p": 0.4, "text": "告げ口したと言われ、職場で浮いた。", "cls": "red", "j": -6, "h": -2, "r": -3, "assets": 0, "quit": false}]}, {"t": "本人に直接言う", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "「疲れてて、ごめん」と言われた。2人で飲みに行った。", "cls": "", "j": 4, "h": 0, "r": 3, "assets": -1, "quit": false}, {"p": 0.5, "text": "逆ギレされ、関係が最悪になった。", "cls": "", "j": -4, "h": 0, "r": -2, "assets": 0, "quit": false}]}]}], "保育士": [{"title": "保護者から理不尽なクレームが続いている。園長は「相手を立てて」と言う。", "text": "", "opts": [{"t": "園長に任せる", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "園長が間に入り、なんとか収まった。", "cls": "", "j": 1, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "結局自分が謝らされ、悔しかった。", "cls": "red", "j": -5, "h": -2, "r": 0, "assets": 0, "quit": false}]}, {"t": "記録を取り、毅然と対応", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "保護者が冷静になり、最後は「先生ありがとう」と言った。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "役所に通報されて調査が入った。問題なしだったが疲れた。", "cls": "", "j": -5, "h": -3, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "企業内保育所から、給料を月3万円上げると誘われた。", "text": "", "opts": [{"t": "移る", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "少人数で、子ども一人ひとりと向き合えるようになった。", "cls": "", "j": 5, "h": 2, "r": 1, "assets": 36, "quit": true}, {"p": 0.3, "text": "園の運営会社が撤退し、1年で職を失った。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": 0, "quit": true}]}, {"t": "今の園に残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "主任になり、新人の育成を任された。", "cls": "", "j": 3, "h": -1, "r": 2, "assets": 12, "quit": false}, {"p": 0.4, "text": "園の運営が別法人に変わり、方針がまるで変わった。", "cls": "red", "j": -4, "h": -2, "r": -1, "assets": 0, "quit": false}]}]}], "自動車整備士": [{"title": "ディーラーから、営業職への異動を勧められた。給料は上がる。", "text": "", "opts": [{"t": "営業になる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "整備の知識が活きて、販売台数が店舗トップになった。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 100, "quit": false}, {"p": 0.5, "text": "ノルマに追われ、工具を握りたくなった。", "cls": "red", "j": -5, "h": -2, "r": 0, "assets": 40, "quit": false}]}, {"t": "整備に残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "検査員の資格を取り、工場の要になった。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 30, "quit": false}, {"p": 0.4, "text": "工場長になった。若手が「工場長みたいになりたい」と言ってくれた。", "cls": "big", "j": 6, "h": 0, "r": 3, "assets": 80, "quit": false}]}]}, {"title": "昔からのお客さんの車、修理代が車の価値を超えている。", "text": "", "opts": [{"t": "正直に買い替えを勧める", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "お客さんは納得し、次の車もうちで買ってくれた。", "cls": "", "j": 4, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.3, "text": "「思い出の車なのに」と怒って来なくなった。", "cls": "", "j": -3, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "直す", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "部品を探し回り、3週間かけて直した。お客さんは泣いて喜んだ。", "cls": "big", "j": 6, "h": -1, "r": 3, "assets": 10, "quit": false}, {"p": 0.4, "text": "部品代がかさみ、請求額でお客さんと揉めた。", "cls": "red", "j": -4, "h": 0, "r": -1, "assets": 0, "quit": false}]}]}], "販売店員": [{"title": "本部から、新店舗の立ち上げ店長を頼まれた。", "text": "", "opts": [{"t": "引き受ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "オープンから半年で黒字化した。エリアマネージャーに昇進した。", "cls": "big", "j": 6, "h": -3, "r": 2, "assets": 60, "quit": false}, {"p": 0.5, "text": "人が集まらず、半年間ほぼ休みなく働いた。", "cls": "red", "j": -6, "h": -8, "r": 0, "assets": 10, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "今の店で、スタッフと楽しく働き続けた。", "cls": "", "j": 2, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "新店に行った同期が先に昇進した。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "万引きを目撃した。中学生だった。", "text": "", "opts": [{"t": "声をかけて話す", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "泣きながら謝った。親に連絡して、警察には言わなかった。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "逃げられた。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "マニュアル通り通報", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "警察が来た。少し胸が痛んだが、それが仕事だった。", "cls": "", "j": -1, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "数年後、その子が親と一緒に謝りに来た。高校に受かったと言っていた。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 0, "quit": false}]}]}], "調理師": [{"title": "自分の店を出すため、物件を見つけた。", "text": "", "opts": [{"t": "開業する", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "地元の人気店になり、行列ができるようになった。", "cls": "big", "j": 10, "h": -4, "r": 3, "assets": 500, "quit": true}, {"p": 0.6, "text": "2年で閉店した。借金が800万円残った。", "cls": "red big", "j": -12, "h": -5, "r": -2, "assets": -800, "quit": true}]}, {"t": "雇われで続ける", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "料理長に昇進した。", "cls": "", "j": 3, "h": -1, "r": 2, "assets": 40, "quit": false}, {"p": 0.4, "text": "オーナーが店を畳むことになり、急に職を失った。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": -50, "quit": true}]}]}, {"title": "料理番組の取材依頼が来た。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "放送翌日から予約が3か月先まで埋まった。", "cls": "big", "j": 6, "h": -3, "r": 0, "assets": 100, "quit": false}, {"p": 0.4, "text": "放送後の客足は2週間で元に戻った。", "cls": "", "j": 0, "h": -1, "r": 0, "assets": 10, "quit": false}]}, {"t": "断る", "s": "常連を大事に", "w": 2, "outs": [{"p": 0.6, "text": "静かに、いつもの味を守った。", "cls": "", "j": 2, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "常連さんが「テレビに出なくてよかった」と笑った。", "cls": "", "j": 3, "h": 0, "r": 2, "assets": 0, "quit": false}]}]}], "機械組立工": [{"title": "期間工の満了が近い。社員登用の試験を受けるか、満了金をもらって辞めるか。", "text": "", "opts": [{"t": "登用試験を受ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "正社員になった。ボーナスが出た日、実家に電話した。", "cls": "big", "j": 8, "h": 0, "r": 2, "assets": 100, "quit": false}, {"p": 0.5, "text": "落ちた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "満了金で辞める", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "満了金と貯金で300万円を手に、半年かけて日本一周した。", "cls": "big", "j": 8, "h": 2, "r": 0, "assets": -50, "quit": true}, {"p": 0.4, "text": "次の仕事がなかなか決まらなかった。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": -100, "quit": true}]}]}, {"title": "班長に推薦された。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "現場をまとめる立場になった。手当が月2万円。", "cls": "", "j": 3, "h": -1, "r": 2, "assets": 24, "quit": false}, {"p": 0.4, "text": "上と下の板挟みで胃が痛い毎日になった。", "cls": "red", "j": -5, "h": -4, "r": 0, "assets": 24, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "作業に集中し、定時で帰れる日々を続けた。", "cls": "", "j": 1, "h": 1, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "後輩が先に班長になり、指示を受ける立場になった。", "cls": "", "j": -3, "h": 0, "r": -1, "assets": 0, "quit": false}]}]}], "警備員": [{"title": "施設警備の隊長への昇格を打診された。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "シフト管理と報告書に追われるようになった。給料は月3万円上がった。", "cls": "", "j": 2, "h": -1, "r": 1, "assets": 36, "quit": false}, {"p": 0.3, "text": "隊員が次々に辞め、自分が穴を埋め続けた。", "cls": "red", "j": -5, "h": -5, "r": 0, "assets": 36, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "現場で淡々と働き続けた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "代わりに隊長になった後輩が、シフトで気を遣ってくれた。", "cls": "", "j": 2, "h": 0, "r": 1, "assets": 0, "quit": false}]}]}, {"title": "イベント警備で、明らかに危険な混雑が起きている。主催者は入場を止めない。", "text": "", "opts": [{"t": "独断で入場を止める", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "事故は起きなかった。後日、主催者から感謝状が届いた。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "主催者に怒られ、契約を切られた。", "cls": "red", "j": -4, "h": 0, "r": -1, "assets": -10, "quit": false}]}, {"t": "指示に従う", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "なんとか事故なく終わった。", "cls": "", "j": 0, "h": -1, "r": 0, "assets": 0, "quit": false}, {"p": 0.3, "text": "将棋倒しが起き、けが人が出た。ずっと夢に出る。", "cls": "red big", "j": -15, "h": -5, "r": -2, "assets": 0, "quit": false}]}]}], "美容師": [{"title": "独立して自分のサロンを持つか迷っている。", "text": "", "opts": [{"t": "開業する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "常連さんがついてきてくれて、3年で2店舗目を出した。", "cls": "big", "j": 10, "h": -3, "r": 2, "assets": 800, "quit": true}, {"p": 0.5, "text": "内装に1200万円かけたが客が定着せず、苦しい経営が続いた。", "cls": "red", "j": -8, "h": -4, "r": -1, "assets": -1200, "quit": true}]}, {"t": "面貸しのフリーになる", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "売上の6割が手元に残るようになり、自由に働けた。", "cls": "", "j": 5, "h": 0, "r": 0, "assets": 150, "quit": false}, {"p": 0.3, "text": "集客を全部自分でやる大変さを知った。", "cls": "", "j": -2, "h": -2, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "お客さんが、明らかに似合わない髪型を強く希望している。", "text": "", "opts": [{"t": "正直に止める", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "別の提案を気に入ってくれ、ずっと通ってくれるようになった。", "cls": "", "j": 4, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.4, "text": "機嫌を損ねて、二度と来なかった。", "cls": "", "j": -3, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "言われた通り切る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "本人は大満足だった。", "cls": "", "j": 2, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.5, "text": "口コミに「下手」と書かれた。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "経営者": [{"title": "大手企業から、会社を買収したいという話が来た。", "text": "", "opts": [{"t": "売却する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "3億円で売却した。しばらく何をしていいかわからなかった。", "cls": "big", "j": 4, "h": 2, "r": -1, "assets": 30000, "quit": true}, {"p": 0.4, "text": "売却後、社員が大量に辞めたと聞いて胸が痛んだ。", "cls": "red", "j": -6, "h": 0, "r": -3, "assets": 20000, "quit": true}]}, {"t": "自分で続ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "5年後に上場した。", "cls": "big", "j": 10, "h": -4, "r": 2, "assets": 10000, "quit": false}, {"p": 0.5, "text": "競合に押されて業績が落ちた。", "cls": "red", "j": -6, "h": -3, "r": -1, "assets": -2000, "quit": false}]}]}, {"title": "資金ショート寸前。個人保証で追加融資を受けるか迫られた。", "text": "", "opts": [{"t": "保証する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "なんとか持ち直し、5年で借金を返した。", "cls": "", "j": 3, "h": -4, "r": 1, "assets": 0, "quit": false}, {"p": 0.5, "text": "結局会社は倒産し、自宅を手放した。", "cls": "red big", "j": -20, "h": -8, "r": -3, "assets": -5000, "quit": true}]}, {"t": "会社をたたむ", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "社員一人ひとりの再就職先を探して、会社を閉じた。", "cls": "red", "j": -10, "h": 0, "r": 2, "assets": -500, "quit": true}, {"p": 0.4, "text": "数年後、元社員たちが集まって「また一緒にやりましょう」と言ってくれた。", "cls": "big", "j": 5, "h": 0, "r": 4, "assets": -500, "quit": true}]}]}], "フリーター": [{"title": "バイト先から正社員登用の話が来た。", "text": "", "opts": [{"t": "正社員になる", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "ボーナスと社会保険がついた。親が安心した。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 100, "quit": true}, {"p": 0.3, "text": "責任が増えたのに、給料はあまり変わらなかった。", "cls": "", "j": -3, "h": -2, "r": 0, "assets": 30, "quit": true}]}, {"t": "自由でいる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "夢のために使う時間を守った。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "30代になり、選べる仕事が減っていった。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": -50, "quit": false}]}]}, {"title": "友達から「一緒にキッチンカーやらない？」と誘われた。", "text": "", "opts": [{"t": "乗る", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "イベント出店で人気になり、月収40万円になった。", "cls": "big", "j": 8, "h": -2, "r": 2, "assets": 300, "quit": true}, {"p": 0.6, "text": "半年で友達と揉めて解散した。", "cls": "red", "j": -6, "h": 0, "r": -3, "assets": -150, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "いつものバイト生活を続けた。", "cls": "", "j": 0, "h": 0, "r": -1, "assets": 0, "quit": false}, {"p": 0.4, "text": "友達のキッチンカーが繁盛しているのを、SNSで見た。", "cls": "", "j": -4, "h": 0, "r": -1, "assets": 0, "quit": false}]}]}], "キャバクラ嬢": [{"title": "太客から「店を辞めて一緒に暮らそう」と言われた。", "text": "", "opts": [{"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "関係はこじれたが、仕事は続けられた。", "cls": "", "j": 0, "h": 0, "r": -1, "assets": 0, "quit": false}, {"p": 0.3, "text": "しつこく付きまとわれ、店に相談して出禁にしてもらった。", "cls": "red", "j": -6, "h": -2, "r": -1, "assets": 0, "quit": false}]}, {"t": "受け入れる", "s": "", "w": 1, "outs": [{"p": 0.4, "text": "思ったより穏やかな暮らしになった。", "cls": "", "j": 4, "h": 2, "r": 2, "assets": 0, "quit": true}, {"p": 0.6, "text": "半年で別れて、行くあてもなく店に戻った。", "cls": "red", "j": -8, "h": -2, "r": -2, "assets": -100, "quit": false}]}]}, {"title": "貯金が1000万円を超えた。", "text": "", "opts": [{"t": "昼の仕事に転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "資格を取って事務職に就いた。給料は激減したが夜眠れるようになった。", "cls": "", "j": 4, "h": 5, "r": 1, "assets": 0, "quit": true}, {"p": 0.4, "text": "昼の職場になじめず、半年で夜に戻った。", "cls": "", "j": -4, "h": 0, "r": -1, "assets": -50, "quit": false}]}, {"t": "自分の店を出す", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "オーナーママになった。", "cls": "big", "j": 8, "h": -4, "r": 2, "assets": 1000, "quit": true}, {"p": 0.5, "text": "女の子が集まらず、1年で閉店した。", "cls": "red", "j": -10, "h": -3, "r": -1, "assets": -1000, "quit": true}]}]}], "ホスト": [{"title": "ナンバー1のお客さんが、売掛を払えなくなった。", "text": "", "opts": [{"t": "自腹で立て替える", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "お客さんは少しずつ返してくれた。", "cls": "", "j": 2, "h": 0, "r": 2, "assets": -50, "quit": false}, {"p": 0.6, "text": "連絡が取れなくなり、200万円が残った。", "cls": "red", "j": -10, "h": -2, "r": -1, "assets": -200, "quit": false}]}, {"t": "売掛をやめると決める", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "売上は下がったが、気持ちが楽になった。", "cls": "", "j": 3, "h": 1, "r": 1, "assets": -30, "quit": false}, {"p": 0.3, "text": "店長に「甘い」と言われ、居づらくなった。", "cls": "", "j": -3, "h": 0, "r": -2, "assets": 0, "quit": false}]}]}, {"title": "肝臓の数値が悪いと健康診断で言われた。", "text": "", "opts": [{"t": "ホストを引退する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "営業の経験を活かし、不動産会社で売れっ子になった。", "cls": "big", "j": 6, "h": 6, "r": 1, "assets": 100, "quit": true}, {"p": 0.4, "text": "昼の世界の給料の低さに驚いた。", "cls": "", "j": -2, "h": 6, "r": 0, "assets": -50, "quit": true}]}, {"t": "続ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "ノンアル営業を始めた。意外と指名が増えた。", "cls": "", "j": 3, "h": 2, "r": 1, "assets": 50, "quit": false}, {"p": 0.5, "text": "数値がさらに悪化して入院した。", "cls": "red big", "j": -10, "h": -12, "r": 0, "assets": -50, "quit": false}]}]}], "暴力団員": [{"title": "組を抜けたい。だが簡単にはいかない。", "text": "", "opts": [{"t": "足を洗う", "s": "警察に相談", "w": 2, "outs": [{"p": 0.5, "text": "支援団体の助けで離脱した。5年後、ようやく自分名義の口座が作れた。", "cls": "big", "j": 8, "h": 2, "r": 2, "assets": -50, "quit": true}, {"p": 0.5, "text": "離脱したが、仕事が見つからず生活に苦しんだ。", "cls": "red", "j": -6, "h": -2, "r": -1, "assets": -100, "quit": true}]}, {"t": "残る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "組の中で地位が上がった。だが居場所は狭まっていく。", "cls": "", "j": -2, "h": -2, "r": 0, "assets": 50, "quit": false}, {"p": 0.5, "text": "抗争に巻き込まれて重傷 2, "r": 2, "assets": -100, "quit": true}, {"p": 0.4, "text": "社内政治に疲れ、1年でコンサルに戻った。", "cls": "red", "j": -5, "h": 0, "r": -2, "assets": 0, "quit": false}]}, {"t": "コンサルに残る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "パートナーに昇進した。年収3000万円になった。", "cls": "big", "j": 6, "h": -4, "r": 0, "assets": 1500, "quit": false}, {"p": 0.5, "text": "昇進できず、ずっとマネージャー止まりだった。", "cls": "", "j": -3, "h": -2, "r": 0, "assets": 300, "quit": false}]}]}, {"title": "クライアントの経営陣が、どう見ても無理な戦略を推している。", "text": "", "opts": [{"t": "はっきり反対する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "社長が考えを改めた。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "契約を切られ、社内で詰められた。", "cls": "red", "j": -6, "h": -2, "r": -2, "assets": 0, "quit": false}]}, {"t": "意向に沿ってまとめる", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "報酬は入った。", "cls": "", "j": -1, "h": 0, "r": 0, "assets": 100, "quit": false}, {"p": 0.4, "text": "戦略が失敗し、自分の名前も業界で汚れた。", "cls": "red", "j": -8, "h": 0, "r": -2, "assets": 0, "quit": false}]}]}], "外資系金融": [{"title": "リストラの噂がある。社外からヘッドハンターの電話が来た。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "ヘッジファンドに移り、年収が倍になった。", "cls": "big", "j": 6, "h": -2, "r": 0, "assets": 3000, "quit": true}, {"p": 0.4, "text": "移った先のファンドが1年で解散した。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": -500, "quit": true}]}, {"t": "残る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "リストラを免れて、マネージングディレクターに昇進した。", "cls": "big", "j": 8, "h": -3, "r": 1, "assets": 5000, "quit": false}, {"p": 0.5, "text": "翌月、自分がリストラの対象になった。", "cls": "red big", "j": -10, "h": -2, "r": 0, "assets": 500, "quit": true}]}]}, {"title": "30代でFIREできるだけの資産ができた。", "text": "", "opts": [{"t": "辞める", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "沖縄に移住して、海の見える家で暮らし始めた。", "cls": "big", "j": 8, "h": 6, "r": 1, "assets": -500, "quit": true}, {"p": 0.4, "text": "1年で暇に耐えられなくなった。", "cls": "", "j": -4, "h": 2, "r": 0, "assets": -300, "quit": true}]}, {"t": "続ける", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "数字を追う日々を続けた。", "cls": "", "j": 0, "h": -3, "r": 0, "assets": 3000, "quit": false}, {"p": 0.4, "text": "40歳で心臓に不安が見つかり、医者に止められた。", "cls": "red", "j": -8, "h": -10, "r": 0, "assets": 1000, "quit": true}]}]}], "国家公務員": [{"title": "外資系コンサルから、年収2倍で転職の誘いが来た。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "政策の知識を活かして活躍した。", "cls": "big", "j": 6, "h": 2, "r": 0, "assets": 800, "quit": true}, {"p": 0.4, "text": "「公のために」という感覚を失って、虚しさを感じた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 600, "quit": true}]}, {"t": "残る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "課長に昇進し、大きな制度改正を担当した。", "cls": "big", "j": 8, "h": -4, "r": 2, "assets": 100, "quit": false}, {"p": 0.5, "text": "心身をすり減らし、休職した。", "cls": "red", "j": -8, "h": -10, "r": -1, "assets": -50, "quit": false}]}]}, {"title": "政治家から、筋の悪い要望をねじ込まれた。", "text": "", "opts": [{"t": "押し返す", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "上司が守ってくれた。", "cls": "", "j": 4, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "次の人事で、地方に飛ばされた。", "cls": "red", "j": -6, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "受け入れる", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "大きな問題にはならなかった。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "後に問題化し、国会で追及された。", "cls": "red big", "j": -12, "h": -4, "r": -2, "assets": 0, "quit": false}]}]}], "銀行員": [{"title": "取引先の中小企業が経営難。融資を続けるか判断を迫られた。", "text": "", "opts": [{"t": "融資を続ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "会社が立ち直り、社長が「あなたのおかげ」と言った。", "cls": "big", "j": 8, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.5, "text": "会社が倒産し、貸し倒れの責任を問われた。", "cls": "red", "j": -8, "h": -2, "r": -1, "assets": 0, "quit": false}]}, {"t": "貸し剥がす", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "会社は倒産した。融資部では評価された。", "cls": "red", "j": -6, "h": 0, "r": -2, "assets": 30, "quit": false}, {"p": 0.4, "text": "その社長が別の銀行から融資を受けて復活し、二度と口をきいてくれなかった。", "cls": "", "j": -4, "h": 0, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "50歳を前に、関連会社への出向を打診された。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "給料は下がったが、定時で帰れるようになった。", "cls": "", "j": 2, "h": 3, "r": 1, "assets": -100, "quit": false}, {"p": 0.3, "text": "出向先になじめなかった。", "cls": "", "j": -4, "h": 0, "r": -1, "assets": -100, "quit": false}]}, {"t": "断って転職", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "地元の中小企業の財務部長になった。", "cls": "big", "j": 6, "h": 1, "r": 2, "assets": 0, "quit": true}, {"p": 0.5, "text": "なかなか転職先が見つからなかった。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": -150, "quit": true}]}]}], "商社マン": [{"title": "アフリカの新規事業の立ち上げ責任者に指名された。", "text": "", "opts": [{"t": "行く", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "事業が軌道に乗り、帰国後に部長になった。", "cls": "big", "j": 8, "h": -4, "r": 1, "assets": 1000, "quit": false}, {"p": 0.5, "text": "政情不安で撤退になった。", "cls": "red", "j": -6, "h": -3, "r": 0, "assets": 200, "quit": false}]}, {"t": "断る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "本社勤務を続けた。出世は少し遅れた。", "cls": "", "j": 0, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "同期がアフリカで成功して、先に部長になった。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "投資先のスタートアップに、出資者として出向しないかと言われた。", "text": "", "opts": [{"t": "出向する", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "会社が上場して、大きなリターンを得た。", "cls": "big", "j": 10, "h": -2, "r": 1, "assets": 3000, "quit": false}, {"p": 0.6, "text": "資金繰りに苦しみ、ベンチャーの厳しさを学んだ。", "cls": "", "j": -2, "h": -3, "r": 1, "assets": 0, "quit": false}]}, {"t": "本社に残る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "安定したキャリアを続けた。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 300, "quit": false}, {"p": 0.4, "text": "本社の部署が再編され、窓際に近い部署に回された。", "cls": "red", "j": -5, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "広告代理店": [{"title": "大手飲料メーカーの競合プレゼン。上司から「勝てば昇進」と言われたが、締切は3日後だ。", "text": "", "opts": [{"t": "徹夜で全力を出す", "s": "3日間ほぼ寝ない", "w": 3, "outs": [{"p": 0.4, "text": "競合に勝った。翌年、チームリーダーに昇進した。", "cls": "big", "j": 8, "h": -6, "r": 2, "assets": 60, "quit": false}, {"p": 0.6, "text": "負けた。帰りの電車で寝過ごし、終点の高尾まで行った。", "cls": "", "j": -6, "h": -8, "r": 0, "assets": 0, "quit": false}]}, {"t": "過去案を流用して出す", "s": "", "w": 2, "outs": [{"p": 0.3, "text": "なぜかクライアントに刺さって勝った。誰にも言えない。", "cls": "", "j": 4, "h": 0, "r": 0, "assets": 30, "quit": false}, {"p": 0.7, "text": "「どこかで見た」と見抜かれ、上司の評価が下がった。", "cls": "red", "j": -5, "h": 0, "r": -3, "assets": 0, "quit": false}]}]}, {"title": "事業会社の宣伝部から「うちに来ないか」と声がかかった。年収は100万円下がるが、定時で帰れるらしい。", "text": "", "opts": [{"t": "転職する", "s": "発注側へ", "w": 2, "outs": [{"p": 0.6, "text": "18時に帰れる生活になった。初めて平日に夕飯を自炊した。", "cls": "", "j": 6, "h": 6, "r": 2, "assets": -100, "quit": true}, {"p": 0.4, "text": "発注側は社内調整地獄だった。半年で「代理店の方が楽だった」と思った。", "cls": "red", "j": -6, "h": 0, "r": -2, "assets": -100, "quit": true}]}, {"t": "残る", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "その年、大型案件を任されボーナスが上がった。", "cls": "", "j": 3, "h": -3, "r": 0, "assets": 80, "quit": false}, {"p": 0.5, "text": "同期が次々辞め、気づけば最古参になっていた。", "cls": "", "j": -3, "h": -2, "r": -2, "assets": 0, "quit": false}]}]}], "不動産営業": [{"title": "相場より800万円高い物件を、何も知らない若い夫婦が気に入っている。決まれば歩合は大きい。", "text": "", "opts": [{"t": "正直に相場を話す", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "夫婦は別の物件を買い、3年後に友人を5組紹介してくれた。", "cls": "big", "j": 6, "h": 0, "r": 5, "assets": 100, "quit": false}, {"p": 0.4, "text": "その月はノルマ未達で、支店長に詰められた。", "cls": "red", "j": -4, "h": -2, "r": 0, "assets": 0, "quit": false}]}, {"t": "そのまま押す", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "契約になり歩合が60万円入った。夜、少し眠れなかった。", "cls": "", "j": -2, "h": -2, "r": 0, "assets": 60, "quit": false}, {"p": 0.4, "text": "後で相場を知った夫婦に口コミで晒された。", "cls": "red", "j": -8, "h": 0, "r": -5, "assets": 20, "quit": false}]}]}, {"title": "取引先の司法書士に、独立して自分の不動産会社を作らないかと誘われた。開業資金は約500万円だ。", "text": "", "opts": [{"t": "独立する", "s": "宅建業の免許を取る", "w": 2, "outs": [{"p": 0.4, "text": "地元密着で軌道に乗り、5年後に社員を3人雇った。", "cls": "big", "j": 8, "h": -2, "r": 3, "assets": 800, "quit": true}, {"p": 0.6, "text": "最初の1年は契約が2件しかなく、貯金が尽きかけた。", "cls": "red big", "j": -12, "h": -5, "r": -2, "assets": -450, "quit": true}]}, {"t": "会社に残る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "店長に昇格し、部下の数字に追われる毎日になった。", "cls": "", "j": 0, "h": -3, "r": 0, "assets": 50, "quit": false}, {"p": 0.3, "text": "安定した給料でローンが通り、家を買えた。", "cls": "", "j": 5, "h": 0, "r": 1, "assets": -300, "quit": false}]}]}], "建築士": [{"title": "施主が予算を300万円オーバーする要望を次々出してくる。断れば関係が悪くなりそうだ。", "text": "", "opts": [{"t": "きっぱり線を引く", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "施主は渋々納得し、完成後に「あの時止めてくれて良かった」と言われた。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "施主が怒って契約を解除した。設計料は半分しか入らなかった。", "cls": "red", "j": -6, "h": 0, "r": -3, "assets": -80, "quit": false}]}, {"t": "工夫して全部入れる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "知恵を絞った納まりが住宅雑誌に載った。", "cls": "big", "j": 7, "h": -4, "r": 1, "assets": 30, "quit": false}, {"p": 0.5, "text": "現場で無理が出て、雨漏りのクレーム対応に追われた。", "cls": "red", "j": -8, "h": -4, "r": -2, "assets": -50, "quit": false}]}]}, {"title": "勤めている設計事務所の所長が引退するらしい。事務所を継がないかと言われた。", "text": "", "opts": [{"t": "継ぐ", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "所長の顧客を引き継ぎ、10年続く事務所の主になった。", "cls": "big", "j": 7, "h": -3, "r": 2, "assets": 300, "quit": false}, {"p": 0.5, "text": "借入金の存在を後から知り、返済に5年かかった。", "cls": "red", "j": -10, "h": -5, "r": 0, "assets": -400, "quit": false}]}, {"t": "独立して自分の名前でやる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "小さな住宅を地道に手がけ、口コミで仕事が回り始めた。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 100, "quit": true}, {"p": 0.5, "text": "仕事が来ず、他の事務所の下請けで食いつないだ。", "cls": "red", "j": -6, "h": -2, "r": 0, "assets": -150, "quit": true}]}]}], "税理士": [{"title": "顧問先の社長から、売上の一部を除外して申告してほしいと遠回しに頼まれた。顧問料は月5万円の上客だ。", "text": "", "opts": [{"t": "きっぱり断る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "社長は渋い顔をしたが、翌年も顧問を続けてくれた。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "顧問契約を切られた。年間60万円の減収になった。", "cls": "red", "j": -3, "h": 0, "r": -2, "assets": -60, "quit": false}]}, {"t": "見て見ぬふりをする", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "何事もなく1年が過ぎた。ずっと胸がざわついていた。", "cls": "", "j": -5, "h": -2, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "税務調査で発覚し、懲戒処分を受けかけた。", "cls": "red big", "j": -18, "h": -6, "r": -4, "assets": -200, "quit": false}]}]}, {"title": "大手税理士法人から、相続専門チームへの転職の誘いが来た。年収は200万円上がる。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "富裕層の案件で年収が1000万円を超えた。", "cls": "big", "j": 5, "h": -3, "r": 0, "assets": 400, "quit": true}, {"p": 0.4, "text": "成果主義が肌に合わず、2年で消耗した。", "cls": "red", "j": -8, "h": -6, "r": -1, "assets": 150, "quit": true}]}, {"t": "今の事務所に残る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "顧問先との付き合いが深まり、社長の娘の結婚式に呼ばれた。", "cls": "", "j": 5, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "給料は据え置きのまま、仕事だけ増えた。", "cls": "", "j": -3, "h": -2, "r": 0, "assets": 0, "quit": false}]}]}], "獣医師": [{"title": "治療費を払えない飼い主が、瀕死の野良猫を連れてきた。院長は「無料はダメ」と言っている。", "text": "", "opts": [{"t": "自腹で治療する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "猫は助かり、その飼い主は以来10年、毎年年賀状をくれた。", "cls": "big", "j": 8, "h": -1, "r": 3, "assets": -8, "quit": false}, {"p": 0.4, "text": "院長にバレて、ボーナスを減らされた。", "cls": "red", "j": -4, "h": 0, "r": -2, "assets": -20, "quit": false}]}, {"t": "ルール通り断る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "その夜はなかなか眠れなかった。", "cls": "", "j": -6, "h": -2, "r": 0, "assets": 0, "quit": false}, {"p": 0.3, "text": "保護団体を紹介し、猫は別の病院で助かったと後で聞いた。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 0, "quit": false}]}]}, {"title": "地方の大動物（牛・馬）診療所で人手が足りず、誘われている。年収は上がるが24時間呼び出しがある。", "text": "", "opts": [{"t": "地方へ行く", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "農家さんに野菜を山ほどもらう生活になり、太った。", "cls": "", "j": 6, "h": -2, "r": 3, "assets": 100, "quit": true}, {"p": 0.5, "text": "呼び出しで寝られない日が続き、2年で腰を痛めた。", "cls": "red", "j": -6, "h": -10, "r": 1, "assets": 80, "quit": true}]}, {"t": "都会の動物病院に残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "5年後、自分の動物病院を開業した。", "cls": "big", "j": 7, "h": -2, "r": 2, "assets": -500, "quit": false}, {"p": 0.4, "text": "同じ毎日が続き、少し退屈を感じ始めた。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "編集者": [{"title": "SNSで話題の素人の投稿を書籍化したいが、編集長は「売れない」と反対している。", "text": "", "opts": [{"t": "粘って通す", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "10万部のヒットになり、社内で一目置かれた。", "cls": "big", "j": 9, "h": -2, "r": 2, "assets": 50, "quit": false}, {"p": 0.6, "text": "初版が半分以上返品され、しばらく企画が通らなくなった。", "cls": "red", "j": -7, "h": -2, "r": -2, "assets": 0, "quit": false}]}, {"t": "諦める", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "半年後、他社から出たその本がベストセラーになった。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "編集長が推した企画が当たり、素直に勉強になった。", "cls": "", "j": 2, "h": 0, "r": 1, "assets": 0, "quit": false}]}]}, {"title": "出版社を辞めてフリー編集者にならないかと、知り合いのWebメディアに誘われた。", "text": "", "opts": [{"t": "フリーになる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "複数の媒体を掛け持ちし、会社員時代より稼げた。", "cls": "", "j": 6, "h": -2, "r": 1, "assets": 120, "quit": true}, {"p": 0.5, "text": "単価の安い記事ばかりで、毎月の家賃に追われた。", "cls": "red", "j": -8, "h": -4, "r": 0, "assets": -150, "quit": true}]}, {"t": "会社に残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "文芸から実用書の部署に異動になった。意外と楽しかった。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "部署が縮小され、仕事量が倍になった。", "cls": "red", "j": -5, "h": -4, "r": 0, "assets": 0, "quit": false}]}]}], "デザイナー": [{"title": "有名企業の仕事だが、ギャラは相場の3分の1。「実績になるから」と言われた。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "実績を見た別の企業から大型の依頼が来た。", "cls": "big", "j": 6, "h": -2, "r": 2, "assets": 80, "quit": false}, {"p": 0.6, "text": "修正だけが無限に続き、時給換算で300円になった。", "cls": "red", "j": -7, "h": -4, "r": 0, "assets": -5, "quit": false}]}, {"t": "断る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "適正価格で仕事を受ける方針を貫けた。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.3, "text": "後でその仕事を受けた同期が賞を取った。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "事務所を辞めてフリーランスとして独立するか迷っている。", "text": "", "opts": [{"t": "独立する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "指名の仕事が増え、年収が600万円を超えた。", "cls": "big", "j": 7, "h": -2, "r": 1, "assets": 200, "quit": true}, {"p": 0.5, "text": "仕事の波が激しく、3か月無収入の時期があった。", "cls": "red", "j": -9, "h": -3, "r": -1, "assets": -120, "quit": true}]}, {"t": "事務所に残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "アートディレクターに昇格した。", "cls": "", "j": 4, "h": -1, "r": 1, "assets": 50, "quit": false}, {"p": 0.4, "text": "AI生成の案件が増え、自分の仕事の意味を考え始めた。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "ゲーム開発者": [{"title": "自主制作のインディーゲームが軌道に乗りそうだ。会社を辞めて専念するか迷っている。", "text": "", "opts": [{"t": "辞めて専念する", "s": "", "w": 2, "outs": [{"p": 0.3, "text": "Steamで5万本売れ、次回作の資金ができた。", "cls": "big", "j": 10, "h": -3, "r": 2, "assets": 1200, "quit": true}, {"p": 0.7, "text": "売上は300本。貯金を200万円使い果たした。", "cls": "red big", "j": -12, "h": -5, "r": -1, "assets": -200, "quit": true}]}, {"t": "兼業で続ける", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "夜と週末に作り続け、3年後に小さくヒットした。", "cls": "", "j": 6, "h": -5, "r": 0, "assets": 200, "quit": false}, {"p": 0.5, "text": "疲れて開発が止まり、フォルダだけが残った。", "cls": "", "j": -4, "h": -2, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "リリース1週間前。品質は不十分だが、上層部は延期を認めない。", "text": "", "opts": [{"t": "延期を直訴する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "3か月延期され、評価の高いゲームとして出せた。", "cls": "big", "j": 7, "h": -2, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "上層部の機嫌を損ね、次のプロジェクトから外された。", "cls": "red", "j": -7, "h": 0, "r": -3, "assets": 0, "quit": false}]}, {"t": "そのまま出す", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "レビューは星2つ。土日にパッチを作った。", "cls": "red", "j": -6, "h": -6, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "バグごと愛され、意外と売れた。", "cls": "", "j": 4, "h": -2, "r": 0, "assets": 20, "quit": false}]}]}], "客室乗務員": [{"title": "機内で酔った乗客が、他の乗客に絡み始めた。", "text": "", "opts": [{"t": "毅然と注意する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "乗客は大人しくなり、周りの乗客から拍手が起きた。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "逆上され、到着後に警察に引き渡した。調書で3時間取られた。", "cls": "red", "j": -5, "h": -3, "r": 0, "assets": 0, "quit": false}]}, {"t": "笑顔でなだめる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "お酒を水に替えて乗り切った。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.5, "text": "エスカレートし、機長判断で引き返しかけた。", "cls": "red", "j": -7, "h": -2, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "地上職への異動の打診が来た。不規則な生活からは解放されるが、もう飛べない。", "text": "", "opts": [{"t": "地上に降りる", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "毎日同じ布団で寝られることに感動した。", "cls": "", "j": 5, "h": 6, "r": 2, "assets": 0, "quit": true}, {"p": 0.4, "text": "空港で飛行機を見るたびに胸が苦しくなった。", "cls": "", "j": -5, "h": 2, "r": 0, "assets": 0, "quit": true}]}, {"t": "飛び続ける", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "チーフパーサーに昇格した。", "cls": "big", "j": 6, "h": -3, "r": 1, "assets": 60, "quit": false}, {"p": 0.5, "text": "腰痛が悪化し、整体に月2万円払うようになった。", "cls": "red", "j": -3, "h": -6, "r": 0, "assets": -24, "quit": false}]}]}], "気象予報士": [{"title": "大雨の予報。「空振りでもいいから強く警戒を呼びかけるか」迷っている。", "text": "", "opts": [{"t": "強く呼びかける", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "実際に大雨になり、避難した人が多くて被害が抑えられた。", "cls": "big", "j": 8, "h": -2, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "大して降らず「オオカミ少年」と言われた。", "cls": "red", "j": -5, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "控えめに伝える", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "予報どおり小雨で済んだ。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "予想以上に降り、浸水被害が出た。眠れない夜が続いた。", "cls": "red big", "j": -14, "h": -4, "r": -2, "assets": 0, "quit": false}]}]}, {"title": "民間気象会社から、テレビを辞めて企業向けの予報をやらないかと誘われた。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "コンビニのおでん発注量を予測する仕事が意外と面白かった。", "cls": "", "j": 5, "h": 3, "r": 0, "assets": 80, "quit": true}, {"p": 0.4, "text": "顔が出なくなり、少し寂しさを感じた。", "cls": "", "j": -3, "h": 2, "r": 0, "assets": 50, "quit": true}]}, {"t": "テレビに残る", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "お天気キャスターとして全国放送の枠をもらった。", "cls": "big", "j": 8, "h": -2, "r": 2, "assets": 100, "quit": false}, {"p": 0.5, "text": "番組改編で担当枠がなくなった。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": -30, "quit": false}]}]}], "司書": [{"title": "市から予算削減の通知。新刊購入費を減らすか、イベント予算を減らすか決めなければならない。", "text": "", "opts": [{"t": "新刊を守る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "利用者アンケートで「新刊が充実」と好評だった。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "イベントがなくなり、子どもの来館が減った。", "cls": "", "j": -4, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "イベントを守る", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "おはなし会に毎回30人が集まり、地域紙に載った。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "予約待ちが半年になり、クレームが増えた。", "cls": "red", "j": -4, "h": -1, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "非常勤のまま10年。民間の書店チェーンから正社員の誘いが来た。", "text": "", "opts": [{"t": "書店に転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "給料が上がり、ボーナスも出るようになった。", "cls": "", "j": 5, "h": 0, "r": 0, "assets": 150, "quit": true}, {"p": 0.4, "text": "売上目標に追われ、本を売る仕事は別物だと知った。", "cls": "red", "j": -6, "h": -2, "r": 0, "assets": 80, "quit": true}]}, {"t": "図書館に残る", "s": "", "w": 3, "outs": [{"p": 0.4, "text": "正規職員の採用試験に受かった。", "cls": "big", "j": 9, "h": 0, "r": 1, "assets": 100, "quit": false}, {"p": 0.6, "text": "契約は更新されたが、手取りは18万円のままだった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "パイロット": [{"title": "天候が悪化している。燃料は余裕があるが、目的地への着陸はぎりぎりの条件だ。", "text": "", "opts": [{"t": "代替空港に向かう", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "乗客には文句を言われたが、安全に降りた。", "cls": "", "j": 3, "h": 0, "r": -1, "assets": 0, "quit": false}, {"p": 0.3, "text": "後で目的地の天候がもっと悪化していたと知り、判断が正しかったと確信した。", "cls": "big", "j": 7, "h": 0, "r": 1, "assets": 0, "quit": false}]}, {"t": "着陸を試みる", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "見事に着陸し、副操縦士に「勉強になりました」と言われた。", "cls": "", "j": 5, "h": -1, "r": 1, "assets": 0, "quit": false}, {"p": 0.4, "text": "ハードランディングで報告書を書くことになった。", "cls": "red", "j": -8, "h": -3, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "LCCから機長待遇で引き抜きの話が来た。大手に残れば機長昇格は数年先だ。", "text": "", "opts": [{"t": "LCCへ移る", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "すぐに機長になり、1日4レグ飛ぶ生活が始まった。", "cls": "", "j": 6, "h": -4, "r": 0, "assets": 100, "quit": true}, {"p": 0.4, "text": "勤務がきつく、2年で体を壊しかけた。", "cls": "red", "j": -6, "h": -10, "r": 0, "assets": 80, "quit": true}]}, {"t": "大手に残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "3年後に機長に昇格し、年収2000万円を超えた。", "cls": "big", "j": 8, "h": 0, "r": 1, "assets": 500, "quit": false}, {"p": 0.4, "text": "審査に1度落ち、再挑戦まで半年待った。", "cls": "red", "j": -8, "h": -2, "r": 0, "assets": 0, "quit": false}]}]}], "MR": [{"title": "担当の大病院の部長医師から、自社の薬を処方する代わりに個人的な見返りをほのめかされた。", "text": "", "opts": [{"t": "きっぱり断る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "その病院での処方は減ったが、上司は理解してくれた。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "担当を外され、地方の営業所に回された。", "cls": "red", "j": -6, "h": -2, "r": -1, "assets": 0, "quit": false}]}, {"t": "上司に相談する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "会社のコンプライアンス部門が動き、話は穏便に収まった。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.3, "text": "社内で噂が広まり、医師との関係がぎくしゃくした。", "cls": "red", "j": -5, "h": 0, "r": -2, "assets": 0, "quit": false}]}]}, {"title": "MRの早期退職募集が出た。退職金は通常の1.5倍だ。", "text": "", "opts": [{"t": "応募する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "割増退職金でベンチャーに移り、新しい挑戦を始めた。", "cls": "big", "j": 7, "h": 0, "r": 1, "assets": 800, "quit": true}, {"p": 0.5, "text": "転職活動は難航し、1年近く無職だった。", "cls": "red", "j": -10, "h": -3, "r": -1, "assets": 500, "quit": true}]}, {"t": "残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "オンライン面談中心の働き方になり、移動が減った。", "cls": "", "j": 4, "h": 3, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "人が減った分、担当エリアが倍になった。", "cls": "red", "j": -5, "h": -4, "r": 0, "assets": 0, "quit": false}]}]}], "栄養士": [{"title": "食材価格の高騰で、給食費の据え置きが難しくなった。", "text": "", "opts": [{"t": "量や品数を工夫して据え置く", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "旬の食材を使った献立が保護者に好評だった。", "cls": "", "j": 5, "h": -1, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "子どもから「最近おかずが少ない」と言われてしまった。", "cls": "red", "j": -5, "h": 0, "r": -1, "assets": 0, "quit": false}]}, {"t": "値上げを提案する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "説明会を経て、月300円の値上げが認められた。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "保護者説明会で詰められ、胃が痛くなった。", "cls": "red", "j": -6, "h": -3, "r": -2, "assets": 0, "quit": false}]}]}, {"title": "スポーツチームの専属栄養士の募集を見つけた。収入は不安定だ。", "text": "", "opts": [{"t": "応募する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "採用され、選手の体重管理を任された。チームが優勝した。", "cls": "big", "j": 9, "h": 0, "r": 2, "assets": 30, "quit": true}, {"p": 0.5, "text": "1年契約で切られ、また仕事を探した。", "cls": "red", "j": -7, "h": 0, "r": 0, "assets": -40, "quit": true}]}, {"t": "今の職場に残る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "栄養管理室の主任になった。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 40, "quit": false}, {"p": 0.3, "text": "同じ献立のローテーションに飽きてきた。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "通訳・翻訳": [{"title": "政治家の発言に失礼な表現が含まれていた。直訳すると外交問題になりかねない。", "text": "", "opts": [{"t": "そのまま直訳する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "相手が笑って受け流し、事なきを得た。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "翌日のニュースで「通訳の問題」と報じられた。", "cls": "red", "j": -10, "h": -3, "r": -2, "assets": 0, "quit": false}]}, {"t": "角を取って訳す", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "会談は和やかに進み、後で関係者から感謝された。", "cls": "big", "j": 6, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "「正確に訳していない」と批判された。", "cls": "red", "j": -7, "h": -2, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "AI翻訳の普及で依頼が減ってきた。専門分野に特化するか迷っている。", "text": "", "opts": [{"t": "医療・法律に特化する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "専門通訳として単価が上がった。", "cls": "big", "j": 7, "h": -1, "r": 1, "assets": 150, "quit": false}, {"p": 0.4, "text": "勉強に2年かかり、その間の収入が落ちた。", "cls": "red", "j": -5, "h": -3, "r": 0, "assets": -100, "quit": false}]}, {"t": "翻訳をやめて転職する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "外資系企業で語学を活かした職に就いた。", "cls": "", "j": 4, "h": 1, "r": 1, "assets": 100, "quit": true}, {"p": 0.5, "text": "語学以外の強みがなく、苦労した。", "cls": "red", "j": -6, "h": -2, "r": 0, "assets": -50, "quit": true}]}]}], "社会福祉士": [{"title": "担当の利用者が、明らかに家族から金銭を搾取されている。本人は「家族を悪く言わないで」と言う。", "text": "", "opts": [{"t": "介入する", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "成年後見人をつけ、本人の財産が守られた。", "cls": "big", "j": 7, "h": -2, "r": 1, "assets": 0, "quit": false}, {"p": 0.5, "text": "本人が心を閉ざし、関わりを拒否された。", "cls": "red", "j": -8, "h": -2, "r": -2, "assets": 0, "quit": false}]}, {"t": "見守りを続ける", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "時間をかけて信頼を築き、本人から相談してくれた。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "状況が悪化し、早く動けばよかったと悔やんだ。", "cls": "red", "j": -10, "h": -3, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "激務と低賃金に疲れてきた。一般企業への転職を考えている。", "text": "", "opts": [{"t": "転職する", "s": "", "w": 2, "outs": [{"p": 0.6, "text": "給料が月8万円上がった。でも時々相談者の顔を思い出した。", "cls": "", "j": 3, "h": 3, "r": 0, "assets": 100, "quit": true}, {"p": 0.4, "text": "営業職が合わず、結局福祉の世界に戻った。", "cls": "red", "j": -4, "h": 0, "r": 0, "assets": -20, "quit": true}]}, {"t": "続ける", "s": "", "w": 3, "outs": [{"p": 0.5, "text": "地域包括支援センターの所長になった。", "cls": "big", "j": 6, "h": -2, "r": 2, "assets": 50, "quit": false}, {"p": 0.5, "text": "燃え尽きそうになり、1か月休職した。", "cls": "red", "j": -10, "h": -8, "r": 0, "assets": -20, "quit": false}]}]}], "理学療法士": [{"title": "リハビリを頑張っていた患者さんが、退院後に転倒して再入院してきた。", "text": "", "opts": [{"t": "自分を責めて訪問を増やす", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "在宅での転倒防止プログラムを作り、病院で採用された。", "cls": "big", "j": 6, "h": -3, "r": 2, "assets": 0, "quit": false}, {"p": 0.5, "text": "自分の時間がなくなり、燃え尽けかけた。", "cls": "red", "j": -8, "h": -6, "r": 0, "assets": 0, "quit": false}]}, {"t": "チームで振り返る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "多職種で対策を共有し、再発が減った。", "cls": "", "j": 4, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.3, "text": "結局、根本的な解決には至らなかった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "整体院を開業しないかと、先輩に誘われた。", "text": "", "opts": [{"t": "開業する", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "口コミで予約が埋まり、病院勤務時代の倍稼いだ。", "cls": "big", "j": 8, "h": -2, "r": 1, "assets": 400, "quit": true}, {"p": 0.6, "text": "集客に苦戦し、1年で店を閉めた。", "cls": "red big", "j": -12, "h": -4, "r": -1, "assets": -400, "quit": true}]}, {"t": "病院に残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "リハビリ科の主任になった。", "cls": "", "j": 4, "h": 0, "r": 1, "assets": 30, "quit": false}, {"p": 0.4, "text": "後輩の指導に追われ、患者さんと向き合う時間が減った。", "cls": "", "j": -3, "h": -2, "r": 0, "assets": 0, "quit": false}]}]}], "消防士": [{"title": "火災現場。逃げ遅れた人がいるとの情報があるが、建物は崩れかけている。", "text": "", "opts": [{"t": "突入する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "子ども1人を救出した。表彰を受けた。", "cls": "big", "j": 10, "h": -6, "r": 3, "assets": 0, "quit": false}, {"p": 0.5, "text": "天井が落ち、全治2か月のケガを負った。", "cls": "red big", "j": -10, "h": -20, "r": 1, "assets": -30, "quit": false}]}, {"t": "隊長の判断を待つ", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "中には誰もいなかったと後で分かった。", "cls": "", "j": 3, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "救助は間に合わなかった。長い間その現場を夢に見た。", "cls": "red", "j": -15, "h": -4, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "救急救命士の資格を取るよう、上司に勧められた。", "text": "", "opts": [{"t": "取る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "救急隊長になり、多くの命をつないだ。", "cls": "big", "j": 7, "h": -3, "r": 2, "assets": 40, "quit": false}, {"p": 0.4, "text": "救急出動の多さに疲弊した。", "cls": "red", "j": -5, "h": -6, "r": 0, "assets": 30, "quit": false}]}, {"t": "消火・救助一本でいく", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "特別救助隊（レスキュー）に選抜された。", "cls": "big", "j": 8, "h": -4, "r": 2, "assets": 30, "quit": false}, {"p": 0.5, "text": "年齢とともに体力が落ち、現場の第一線から外れた。", "cls": "", "j": -4, "h": -2, "r": 0, "assets": 0, "quit": false}]}]}], "警察官": [{"title": "職務質問をした若者が、家庭の事情で家に帰れないと言っている。規則上は保護者に連絡すべきだ。", "text": "", "opts": [{"t": "児童相談所に繋ぐ", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "虐待の事実が判明し、その子は保護された。後日手紙が届いた。", "cls": "big", "j": 9, "h": 0, "r": 2, "assets": 0, "quit": false}, {"p": 0.4, "text": "本人が拒否して逃げ出し、行方が分からなくなった。", "cls": "red", "j": -8, "h": -2, "r": -1, "assets": 0, "quit": false}]}, {"t": "規則通り保護者に連絡する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "親が迎えに来て、何事もなく帰っていった。", "cls": "", "j": 1, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.5, "text": "数か月後、その子が再び補導されてきた。", "cls": "red", "j": -6, "h": -1, "r": 0, "assets": 0, "quit": false}]}]}, {"title": "刑事課への異動の打診が来た。花形だが激務だ。", "text": "", "opts": [{"t": "刑事になる", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "大きな事件の捜査本部に入り、犯人逮捕に貢献した。", "cls": "big", "j": 9, "h": -6, "r": 1, "assets": 30, "quit": false}, {"p": 0.5, "text": "捜査本部で1か月家に帰れず、家族との関係が冷えた。", "cls": "red", "j": -8, "h": -8, "r": -4, "assets": 0, "quit": false}]}, {"t": "地域課に残る", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "地元に顔見知りが増え、町の人に頼られた。", "cls": "", "j": 5, "h": 0, "r": 3, "assets": 0, "quit": false}, {"p": 0.3, "text": "同期が出世していき、少し焦った。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 0, "quit": false}]}]}], "自衛官": [{"title": "任期制の満了が近い。継続するか、民間に出るか決めなければならない。", "text": "", "opts": [{"t": "継続する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "陸曹に昇任し、部下を持つようになった。", "cls": "", "j": 5, "h": -2, "r": 2, "assets": 80, "quit": false}, {"p": 0.4, "text": "体力の衰えを感じ、訓練がきつくなった。", "cls": "", "j": -4, "h": -5, "r": 0, "assets": 50, "quit": false}]}, {"t": "民間に出る", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "満了金を元手に、運送会社に就職した。", "cls": "", "j": 4, "h": 2, "r": 1, "assets": 150, "quit": true}, {"p": 0.5, "text": "体力以外のアピールポイントがなく、就活に苦戦した。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": 80, "quit": true}]}]}, {"title": "災害派遣中、上官の命令より目の前の救助を優先したい場面になった。", "text": "", "opts": [{"t": "命令に従う", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "部隊の安全が守られた。後で判断の正しさを知った。", "cls": "", "j": 3, "h": 0, "r": 1, "assets": 0, "quit": false}, {"p": 0.3, "text": "その人を助けられなかったことが、ずっと胸に残った。", "cls": "red", "j": -10, "h": -2, "r": 0, "assets": 0, "quit": false}]}, {"t": "目の前の人を助ける", "s": "", "w": 1, "outs": [{"p": 0.5, "text": "1人を救い出したが、上官に厳しく叱責された。", "cls": "", "j": 4, "h": -2, "r": -1, "assets": 0, "quit": false}, {"p": 0.5, "text": "二次災害に巻き込まれ、ケガをした。", "cls": "red big", "j": -10, "h": -15, "r": 0, "assets": -20, "quit": false}]}]}], "鉄道員": [{"title": "運転中、遅延が3分出ている。次の駅でなんとか取り戻したい。", "text": "", "opts": [{"t": "安全運転で遅延を受け入れる", "s": "", "w": 3, "outs": [{"p": 0.8, "text": "何事もなく終点に着いた。", "cls": "", "j": 2, "h": 0, "r": 0, "assets": 0, "quit": false}, {"p": 0.2, "text": "指令所から問い合わせが来た。", "cls": "", "j": -2, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "少し速度を上げる", "s": "", "w": 1, "outs": [{"p": 0.6, "text": "定時に戻せた。", "cls": "", "j": 2, "h": -1, "r": 0, "assets": 0, "quit": false}, {"p": 0.4, "text": "オーバーランをして、日勤教育を受けた。", "cls": "red", "j": -10, "h": -3, "r": -1, "assets": 0, "quit": false}]}]}, {"title": "鉄道会社の新幹線運転士への登用試験の話が来た。", "text": "", "opts": [{"t": "受ける", "s": "", "w": 3, "outs": [{"p": 0.4, "text": "合格し、時速300kmの世界に入った。", "cls": "big", "j": 9, "h": -2, "r": 1, "assets": 100, "quit": false}, {"p": 0.6, "text": "不合格だった。来年また挑戦することにした。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 0, "quit": false}]}, {"t": "今の路線を極める", "s": "", "w": 2, "outs": [{"p": 0.7, "text": "指導運転士になり、後輩を育てた。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 30, "quit": false}, {"p": 0.3, "text": "ワンマン化で仕事の負担が増えた。", "cls": "", "j": -3, "h": -2, "r": 0, "assets": 0, "quit": false}]}]}], "漁師": [{"title": "天候が怪しいが、今日は大漁の予感がする。", "text": "", "opts": [{"t": "出漁する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "大漁で、1日で50万円の売上になった。", "cls": "big", "j": 8, "h": -2, "r": 1, "assets": 50, "quit": false}, {"p": 0.5, "text": "時化に遭い、命からがら港に戻った。", "cls": "red big", "j": -10, "h": -10, "r": 0, "assets": -30, "quit": false}]}, {"t": , "r": 1, "assets": -50, "quit": true}]}, {"t": "引退して就職する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "球団職員として採用され、裏方で野球に関わった。", "cls": "", "j": 4, "h": 2, "r": 2, "assets": 50, "quit": true}, {"p": 0.4, "text": "野球以外の仕事に慣れず苦労した。", "cls": "red", "j": -6, "h": 0, "r": 0, "assets": 0, "quit": true}]}]}, {"title": "FA権を取得した。今の球団に残るか、移籍するか。", "text": "", "opts": [{"t": "移籍する", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "4年総額8億円の契約を結んだ。", "cls": "big", "j": 8, "h": 0, "r": 0, "assets": 8000, "quit": false}, {"p": 0.5, "text": "新天地で不振に陥り、ブーイングを浴びた。", "cls": "red", "j": -10, "h": -3, "r": -2, "assets": 3000, "quit": false}]}, {"t": "残留する", "s": "", "w": 3, "outs": [{"p": 0.7, "text": "ファンから「残ってくれてありがとう」と横断幕が掲げられた。", "cls": "big", "j": 8, "h": 0, "r": 3, "assets": 3000, "quit": false}, {"p": 0.3, "text": "出場機会が減っていった。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": 1500, "quit": false}]}]}], "Jリーガー": [{"title": "海外2部リーグのクラブからオファーが来た。年俸は今より下がる。", "text": "", "opts": [{"t": "海外に挑戦する", "s": "", "w": 2, "outs": [{"p": 0.4, "text": "活躍が認められ、1部のクラブに移籍した。", "cls": "big", "j": 10, "h": -2, "r": 1, "assets": 500, "quit": false}, {"p": 0.6, "text": "言葉の壁に苦しみ、1年で帰国した。", "cls": "red", "j": -6, "h": -2, "r": -1, "assets": -50, "quit": false}]}, {"t": "国内に残る", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "チームの主力として定着した。", "cls": "", "j": 5, "h": 0, "r": 2, "assets": 200, "quit": false}, {"p": 0.4, "text": "あの時行っていたら、と思う夜があった。", "cls": "", "j": -3, "h": 0, "r": 0, "assets": 100, "quit": false}]}]}, {"title": "30歳。出場機会が減ってきた。下部リーグのクラブからは主力として誘われている。", "text": "", "opts": [{"t": "移籍する", "s": "", "w": 3, "outs": [{"p": 0.6, "text": "キャプテンとしてチームを昇格に導いた。", "cls": "big", "j": 8, "h": -2, "r": 3, "assets": 50, "quit": false}, {"p": 0.4, "text": "給料が下がり、生活が苦しくなった。", "cls": "", "j": -4, "h": 0, "r": 0, "assets": -80, "quit": false}]}, {"t": "引退してセカンドキャリアへ", "s": "", "w": 2, "outs": [{"p": 0.5, "text": "指導者ライセンスを取り、ユースのコーチになった。", "cls": "", "j": 5, "h": 2, "r": 2, "assets": 0, "quit": true}, {
