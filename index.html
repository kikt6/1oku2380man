<style>
/* Layout: 母子手帳のような一冊の手帳。縦一列、紙面の上に朱の印が押されていく */
:root{
  --paper:#eef1f4; --sheet:#fbfcfd; --ink:#1d2533; --sub:#5b6577; --rule:#cfd6e0;
  --ai:#24407a; --ai-soft:#dfe6f3; --shu:#c8372d; --shu-soft:#f6dedb; --moss:#4c7a52;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --sheet:#1a2029; --ink:#e7ebf1; --sub:#9aa4b5; --rule:#2e3746;
  --ai:#8eaaf0; --ai-soft:#24304a; --shu:#ef6a5d; --shu-soft:#3d2423; --moss:#86c08c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --sheet:#1a2029; --ink:#e7ebf1; --sub:#9aa4b5; --rule:#2e3746;
  --ai:#8eaaf0; --ai-soft:#24304a; --shu:#ef6a5d; --shu-soft:#3d2423; --moss:#86c08c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:22px 20px}
.label{font-size:11px;letter-spacing:.14em;color:var(--sub)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
p{margin:0}
ruby rt{font-size:.42em;color:var(--sub);font-family:var(--body);font-weight:400}
.muted{color:var(--sub)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ai);color:var(--sheet);border:0;border-radius:3px;padding:12px 22px;font-weight:700;letter-spacing:.06em}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ai);border:1px solid var(--ai)}
.btn:focus-visible,.chip:focus-visible,.choice:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px solid var(--rule);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai);font-weight:700}

/* hero */
.hero{display:grid;gap:14px;padding-block:20px 4px}
.hero h1{font-size:clamp(44px,12vw,76px);font-weight:900;letter-spacing:.02em;line-height:1.05}
.hero h1 small{font-size:.42em;font-weight:500;color:var(--sub);margin-left:.2em}
.hero .lead{font-family:var(--display);font-size:17px;max-width:34em}
.counter{display:flex;flex-wrap:wrap;gap:24px}
.counter div{display:grid}
.counter b{font-family:var(--mono);font-size:26px;font-weight:500}
.setup{display:grid;gap:16px}
.row{display:grid;gap:6px}
.warn{font-size:13px;color:var(--sub);border-left:2px solid var(--shu);padding-left:10px}

/* birth certificate */
.cert{position:relative;border:2px solid var(--ai);padding:22px 20px;background:var(--sheet)}
.cert::before{content:"";position:absolute;inset:4px;border:1px solid var(--ai);opacity:.4;pointer-events:none}
.cert h2{font-size:22px;color:var(--ai);letter-spacing:.4em}
.cert dl{display:grid;grid-template-columns:7em 1fr;gap:8px 12px;margin:16px 0 0}
.cert dt{color:var(--sub);font-size:13px}
.cert dd{margin:0;font-weight:500}
.hanko{position:absolute;right:18px;top:16px;width:64px;height:64px;border:3px solid var(--shu);border-radius:50%;color:var(--shu);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:15px;line-height:1.1;text-align:center;transform:rotate(-12deg);opacity:.9}
@media (prefers-reduced-motion:no-preference){.hanko.stamp{animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}}
@keyframes stamp{from{transform:scale(2.2) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:.9}}

/* play */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:12px 16px;display:grid;gap:10px}
.topline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.age{font-family:var(--display);font-size:34px;font-weight:900;line-height:1}
.age small{font-size:15px;margin-left:2px}
.who{font-weight:700}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stat.money b{font-size:15px}
.stat{display:grid;gap:3px;min-width:0}
.stat .bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ai);transition:width .4s}
.stat span{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
.log{display:grid;gap:0;max-height:420px;overflow:auto;padding-right:4px}
.ev{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.ev .a{font-family:var(--mono);color:var(--sub);font-size:13px;padding-top:2px}
.ev.big p{font-weight:700}
.ev.red p{color:var(--shu)}
.ev.note p{color:var(--ai);font-family:var(--display)}
.decision{border:2px solid var(--shu);background:var(--sheet);padding:18px;border-radius:4px;display:grid;gap:12px}
.decision h3{font-size:19px}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:10px 14px;color:var(--ink)}
.choice:hover{border-color:var(--ai)}
.choice small{display:block;color:var(--sub);font-size:12px}
textarea,input[type=text]{width:100%;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:8px 10px}
select{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:6px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.help{font-size:12px;color:var(--sub);border-top:1px solid var(--rule);padding-top:10px}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.map i{aspect-ratio:1;background:var(--rule);border-radius:1px;opacity:.5}
.map i.c{opacity:1}
.others{display:grid;gap:8px;margin-top:8px}
.other{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;padding:8px 10px;background:var(--paper);border-radius:3px}
.other b{font-weight:700}
.other .s{grid-column:1/-1;color:var(--sub)}
.other.dead{opacity:.6}
canvas{width:100%;height:150px;display:block}
.end{display:grid;gap:14px}
.end h2{font-size:28px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.facts div{border-top:2px solid var(--ai);padding-top:6px}
.facts b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.mem{display:grid;gap:6px}
.mem div{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px dashed var(--rule);padding:6px 0}
.src{font-size:12px;color:var(--sub);display:grid;gap:4px}
.msgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:3px 10px;margin-top:8px;font-size:12px}
.msgrid span{color:var(--sub);text-decoration:line-through;opacity:.55}.msgrid span.on{color:var(--ink);text-decoration:none;opacity:1;font-weight:500}
.src a{color:var(--ai)}
details summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;font-size:12px;width:100%}
td,th{padding:3px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
.tbl{overflow-x:auto;max-height:340px;margin-top:8px}

/* ===== design pass v2 ===== */
body{background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(36,64,122,.05) 31px 32px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(142,170,240,.06) 31px 32px)}}
.sheet{box-shadow:0 1px 0 rgba(29,37,51,.04),0 10px 30px -18px rgba(29,37,51,.25);border-radius:6px}
.hero{position:relative;padding:22px 20px 18px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--shu)}
.hero::after{content:"出生届";position:absolute;right:14px;top:14px;bottom:auto;width:60px;height:60px;border:3px solid var(--shu);border-radius:50%;color:var(--shu);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:14px;transform:rotate(-12deg);opacity:.55;pointer-events:none}
.hero h1{font-size:clamp(40px,11vw,72px)}
.hero .lead{font-size:16px;line-height:1.9}
.counter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;padding-right:0}
.counter div{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;align-content:start}
.counter b{font-size:34px;line-height:1.1;color:var(--ai)}
.counter .label{margin-top:4px;line-height:1.5}
#plays{text-align:center;margin-top:10px!important;font-family:var(--display);font-size:14px!important}
#plays b{color:var(--shu);font-size:18px}
.setup{gap:18px}
.setup .label{font-weight:700;letter-spacing:.1em;color:var(--ink)}
.setup .row .label+div,.setup .row .label+select,.setup .row .label+input{margin-top:2px}
.btn{border-radius:4px;padding:14px 26px;font-size:16px;letter-spacing:.14em;box-shadow:0 6px 16px -8px rgba(36,64,122,.6)}
#go{width:100%;padding:16px}
.chip{padding:6px 14px;background:var(--sheet)}
.top{box-shadow:0 8px 20px -14px rgba(29,37,51,.4);border-radius:6px}
.age{font-size:38px;color:var(--ai)}
.stat .bar{height:6px}
.log{position:relative}
.ev{position:relative;padding:9px 0 9px 4px;border-bottom:1px solid color-mix(in srgb,var(--rule) 60%,transparent)}
.ev .a{position:relative}
.ev .a::after{content:"";position:absolute;right:-7px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--rule)}
.ev.big .a::after{background:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.ev.red .a::after{background:var(--shu);box-shadow:0 0 0 3px var(--shu-soft)}
.ev.big{background:linear-gradient(90deg,var(--ai-soft),transparent 70%);border-radius:4px;padding-left:8px;margin-left:-4px}
.ev.red.big{background:linear-gradient(90deg,var(--shu-soft),transparent 70%)}
.decision{border-width:2px;box-shadow:0 12px 30px -16px rgba(200,55,45,.5);border-radius:6px}
.decision h3{font-size:20px;line-height:1.5}
.choice{padding:12px 14px;border-radius:4px;background:var(--sheet)}
.choice:hover{background:var(--ai-soft)}
.end h2{font-size:30px;line-height:1.25}
.end h2 .num{color:var(--sub);font-weight:500}
.lifetitle{font-family:var(--display);font-size:26px;font-weight:900;margin:6px 0 2px;padding:10px 14px;background:var(--ai-soft);border-left:4px solid var(--ai);border-radius:0 6px 6px 0;line-height:1.4}
.rare{display:inline-flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.rare .rk{display:inline-block;background:var(--shu);color:#fff;font-family:var(--mono);font-weight:700;padding:1px 8px;border-radius:999px;font-size:12px;letter-spacing:.1em}
.rare .st{color:#c9a227;letter-spacing:.05em}
.rare .tg{color:var(--sub)}
.facts{gap:14px 16px}
.facts div{border-top:1px solid var(--rule);padding-top:8px}
.facts b{font-size:21px}
#cardwrap canvas{box-shadow:0 10px 30px -14px rgba(29,37,51,.4)}
.mem div{padding:8px 0}
.src{padding:16px 20px}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;color:var(--ink);display:grid;gap:2px}
.mode b{font-family:var(--display);font-size:16px}.mode small{color:var(--sub);font-size:12px;line-height:1.4}
.mode.on{border-color:var(--ai);background:var(--ai-soft);box-shadow:0 0 0 2px var(--ai) inset}
@media (prefers-reduced-motion:no-preference){.ev.new{animation:evin .5s ease-out}.ev.new.big{animation:evbig .7s ease-out}}
@keyframes evin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes evbig{0%{opacity:0;transform:translateY(-6px) scale(1.02);background:var(--ai-soft)}100%{opacity:1;transform:none}}
.lifebar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:2px}.lifebar i{display:block;height:100%;background:linear-gradient(90deg,var(--moss),var(--ai));transition:width .4s}

.chal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chalc{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;color:var(--ink);display:grid;gap:2px;position:relative}
.chalc b{font-family:var(--display);font-size:15px}.chalc small{color:var(--sub);font-size:11px;line-height:1.4}.chalc .d{color:#c9a227;font-size:11px}
.chalc.on{border-color:var(--shu);background:var(--shu-soft);box-shadow:0 0 0 2px var(--shu) inset}
.chalc.done::after{content:"達成済";position:absolute;right:8px;top:8px;font-size:10px;color:var(--shu);border:1px solid var(--shu);border-radius:999px;padding:0 6px}
.chalbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}.chalbar i{flex:1;height:5px;background:var(--rule);border-radius:3px;overflow:hidden;display:block}.chalbar i b{display:block;height:100%;background:var(--shu);transition:width .5s}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.ach{border:1px dashed var(--rule);border-radius:6px;padding:8px;min-height:54px;display:grid;align-content:start;gap:2px;opacity:.55;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(91,101,119,.06) 6px 7px)}
.ach b{font-size:12px;font-family:var(--display)}.ach small{font-size:10px;color:var(--sub);line-height:1.3}
.ach.on{opacity:1;border:1px solid var(--ai);background:var(--ai-soft)}
.ach.on b{color:var(--ai)}
.clear{border:2px solid var(--shu);background:var(--shu-soft);border-radius:6px;padding:14px 16px;display:grid;gap:4px;position:relative;overflow:hidden}
.clear b{font-family:var(--display);font-size:22px;color:var(--shu)}
@media (prefers-reduced-motion:no-preference){.clear{animation:stamp .6s cubic-bezier(.3,1.6,.5,1)}}
.newach{display:inline-block;background:var(--ai);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}

.result{gap:12px}
.epitaph{font-family:var(--display);font-size:15px;line-height:1.8;color:var(--ink);margin:0;padding-left:12px;border-left:2px solid var(--rule)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grades div{border:1px solid var(--rule);border-radius:6px;padding:6px 4px;text-align:center;display:grid;gap:0;background:var(--paper)}
.grades span{font-size:11px;color:var(--sub)}.grades b{font-family:var(--display);font-size:26px;line-height:1.1}.grades small{font-size:10px;color:var(--sub)}
.grades .gS b{color:#c9a227}.grades .gA b{color:var(--ai)}.grades .gD b{color:var(--shu)}
.km{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px;counter-reset:km}
.km li{display:grid;grid-template-columns:3.2em 1fr;gap:8px;font-size:14px;line-height:1.55;padding:6px 8px;border-radius:4px;background:var(--paper)}
.km li .num{color:var(--sub);font-size:12px;padding-top:2px}.km li.red{color:var(--shu)}.km li.big{font-weight:700}
.chalres{border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.again{display:grid;gap:8px;margin-top:4px}.btn.big{width:100%;padding:16px;font-size:17px}
.again2{display:flex;gap:8px;flex-wrap:wrap}.again2 .btn{flex:1;padding:10px 12px;font-size:13px;letter-spacing:.04em}
.sharebtns{display:flex;gap:8px;flex-wrap:wrap}.sharebtns .btn{flex:1;padding:10px 12px;font-size:13px;letter-spacing:.04em;text-align:center;text-decoration:none}
.facts b.t{font-family:var(--body);font-size:15px}
details summary{padding:4px 0}

.steps{list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;counter-reset:st}
.steps li{counter-increment:st;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.5;color:var(--sub)}
.steps li b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)}.steps li b::before{content:counter(st)"　";color:var(--shu)}
@media (max-width:420px){.steps{grid-template-columns:1fr}.steps li{display:flex;gap:8px;align-items:baseline}.steps li b{display:inline;white-space:nowrap}}
details.more summary{font-size:13px;color:var(--ai);font-weight:700}
.hero>.label{padding-right:72px}
.ev.echo p{font-family:var(--display)}.ev.echo{border-left:3px solid var(--moss);padding-left:8px}

.memorial h3{font-size:22px;margin-bottom:6px}.memorial>p.muted{font-size:14px;line-height:1.8}
canvas.scene{width:100%;aspect-ratio:96/40;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#cbe9f5}
canvas.scene.big{border-radius:6px}
.memrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 6px;margin:0 -2px}
.memrow .memcard{flex:0 0 72%;max-width:300px;scroll-snap-align:start}
.memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}
.memcard{text-align:left;padding:0;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden;color:var(--ink);display:grid}
.memcard .mc{display:grid;gap:2px;padding:10px 12px 12px}.memcard b{font-family:var(--display);font-size:18px}.memcard small{color:var(--sub);font-size:12px}.memcard .mt{font-weight:700;font-size:13px;line-height:1.5}
.candles{display:flex;gap:4px;align-items:flex-end;min-height:18px;margin-top:4px;flex-wrap:wrap}
.candles i{display:inline-block;width:4px;height:12px;background:#e9dcc0;border-radius:1px;position:relative;margin-top:6px}
.candles i::before{content:"";position:absolute;left:-1px;top:-6px;width:6px;height:6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#f6c454;box-shadow:0 0 6px #f6c45499}
.membtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.membtns .btn{flex:1;min-width:140px;font-size:14px;letter-spacing:.04em;padding:12px}
.candlebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.memdetail{gap:8px;display:grid}

.sslive{font-size:15px;line-height:2}.sslive b{font-weight:700}
.sstbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.sstbl th{font-size:12px;color:var(--sub);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule)}.sstbl th:first-child{text-align:left}
.sstbl td{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:right;vertical-align:top;white-space:normal}.sstbl td:first-child{text-align:left}
.sstbl td b{display:block;font-size:16px;font-weight:500}.sstbl td small{color:var(--sub);font-size:11px}
.ssgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:end center;padding:0}
@media (min-width:600px){.modal{place-items:center;padding:16px}}
.mbox{background:var(--sheet);width:100%;max-width:520px;border-radius:12px 12px 0 0;max-height:85vh;overflow:auto;padding:16px 18px 24px}
@media (min-width:600px){.mbox{border-radius:12px}}

.mclose{background:none;border:0;font-size:24px;color:var(--sub);line-height:1;padding:4px 8px}

.birthnote{background:var(--ai-soft);border-radius:6px;padding:12px 14px;font-size:14px;line-height:1.9;margin-top:10px}

.cmp table{width:100%;border-collapse:collapse;font-size:14px}.cmp th{font-size:12px;color:var(--sub);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule)}.cmp th:first-child{text-align:left}

.birthbar .btn{flex:1}.birthbar #start{flex:1.6}

.top{padding:10px 14px;gap:8px}
.topline{gap:4px 10px}.age{font-size:40px}
.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--sheet);flex-wrap:nowrap}
.seg button{background:transparent;border:0;border-right:1px solid var(--rule);padding:8px 9px;font-size:13px;color:var(--ink);min-width:36px}
.ctrl{flex-wrap:nowrap}.ctrl .chip{white-space:nowrap}.moremenu{display:flex;gap:6px;flex-wrap:wrap}.moremenu[hidden]{display:none}
.seg button:last-child{border-right:0}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

.scenecard{padding:0;overflow:hidden}.scenecard canvas.scene{border-radius:0}
.scenecap{padding:10px 14px;font-size:14px;line-height:1.6}
.statsc{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end;padding:12px 14px}
.statsc .stat span{font-size:12px}
.moneybtn{border:1px solid var(--rule);border-radius:999px;background:var(--paper);padding:8px 12px;font-size:13px;color:var(--ink)}
.moneyrow{display:none;grid-column:1/-1;gap:16px;font-size:13px}.statsc.money .moneyrow{display:flex}

.tip{position:relative;background:var(--ink);color:var(--sheet);border-radius:8px;padding:12px 36px 12px 14px;font-size:14px;line-height:1.7}
.tip button{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--sheet);font-size:20px}
.dsum{list-style:none;display:flex;align-items:baseline;gap:10px;cursor:pointer}.dsum::-webkit-details-marker{display:none}.dsum h3{font-size:19px}.dsum::after{content:"▾";margin-left:auto;border:1px solid var(--rule);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:11px;color:var(--sub)}
details[open]>.dsum::after{content:"▴"}
.kv{display:grid;gap:8px;margin-top:10px}.kv div{display:grid;grid-template-columns:6em 1fr;align-items:baseline;gap:2px 8px;font-size:14px}.kv span{color:var(--sub)}.kv b{font-weight:500;text-align:right}.kv small{grid-column:2;text-align:right;color:var(--sub);font-size:12px}
.totop{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:10px 16px;font-size:14px;color:var(--ink);box-shadow:0 8px 20px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}.totop.on{opacity:1;pointer-events:auto}

const SCI_RE=/工|理|情報|農|薬|医|建築|獣医|看護|保健|生物|生命|水産|園芸|海洋|数理|データ|環境科学|環境学|食|栄養|創成|資源|デザイン工|システム|技能|航空|バイオ|恐竜|繊維|歯|リハビリ|健康科学|スポーツ科学|体育/;
function facsOf(name){if(UFAC[name])return UFAC[name].split(",");const n=name;
  if(/教育大学|学芸大学/.test(n))return["教育学部"];if(/外国語大学|外大/.test(n))return["外国語学部","国際関係学部"];if(/経済大学/.test(n))return["経済学部","経営学部"];if(/商科大学|商業大学/.test(n))return["商学部","経営学部"];
  if(/医科大学|医科歯科/.test(n))return["医学部","看護学部"];if(/薬科大学/.test(n))return["薬学部"];if(/看護大学/.test(n))return["看護学部"];if(/医療|保健|リハビリ|福祉大学/.test(n))return["保健医療学部","看護学部","社会福祉学部"];
  if(/工業大学|工科大学|理科大学|工芸大学/.test(n))return["工学部","情報学部","建築学部"];if(/科学大学|理工/.test(n))return["工学部","理学部","情報学部"];if(/情報大学/.test(n))return["情報学部","経営情報学部"];
  if(/芸術|美術|音楽|造形|デザイン/.test(n))return["芸術学部","デザイン学部"];if(/体育|スポーツ/.test(n))return["スポーツ科学部"];if(/農業|農学|畜産/.test(n))return["農学部"];if(/女子大学|女学院/.test(n))return["文学部","家政学部","人間科学部","国際文化学部"];
  if(/国際大学/.test(n))return["国際学部","経営学部","国際関係学部"];if(/県立大学|市立大学|公立大学/.test(n))return["経済学部","国際学部","看護学部","人間科学部"];
  return["経済学部","経営学部","法学部","文学部","国際学部","社会学部","人間科学部","心理学部"]}
function facsFor(name,track){const all=facsOf(name);const sci=all.filter(f=>SCI_RE.test(f)&&!/人文・文化|社会・国際|人間学群/.test(f)),hum=all.filter(f=>!SCI_RE.test(f)||/教育|総合政策|環境情報|国際教養|人間科学|家政|生活科学|スポーツ科学|体育|健康科学|デザイン学部|地域/.test(f));return track==="理"?sci:hum}
function refac(L){if(!L.univ)return;const all=facsOf(L.univ.name);if(/類/.test(L.fac)||all.includes(L.fac))return;let av=facsFor(L.univ.name,L.track);if(!av.length)av=all;const keep=av.filter(f=>f.slice(0,1)===String(L.fac||"").slice(0,1));L.fac=pick(keep.length?keep:av)}

const R=Math.random, pick=a=>a[Math.floor(R()*a.length)];
function wpick(items,w){if(!w.length)w=items.map(i=>i[1]);let t=w.reduce((a,b)=>a+b,0),r=R()*t;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[items.length-1]}
function poisson(m){let L=Math.exp(-m),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const B=0.105;
function qOf(a,x,q0){if(x===0)return q0;const h=a*Math.exp(B*x)+0.00012;return 1-Math.exp(-h)}
function e0(a,q0){let s=1,e=0;for(let x=0;x<125;x++){const q=Math.min(1,qOf(a,x,q0));e+=s*(1-q/2);s*=1-q}return e}
const lifeCache={};
function lifeTable(p,sex){const k=p.n+sex;if(lifeCache[k])return lifeCache[k];
  const q0=p.inf/p.b*(sex==="M"?1.1:.9), target=sex==="M"?p.leM:p.leF; let lo=1e-7,hi=1e-3;
  for(let i=0;i<60;i++){const m=Math.sqrt(lo*hi);e0(m,q0)>target?lo=m:hi=m}
  return lifeCache[k]={a:Math.sqrt(lo*hi),q0}}

で全員起きた。", "保護者のお迎えが19時半を過ぎ、園児と2人で絵本を5冊読んだ。", "運動会の練習で、喉が枯れて声が出なくなった。", "「せんせい、けっこんして」と言われた。4歳だった。", "連絡帳を20人分書いて、家でもまだ書いていた。", "手足口病が園内で流行り、自分もかかった。", "卒園式で、0歳から見ていた子が歌っている姿に号泣した。", "壁面飾りのために、家で夜中まで画用紙を切った。", "給料が手取り17万円で、子どもの数に比べて少なすぎると思った。", "散歩中、子どもが道端のダンゴムシを全部集めた。"], "自動車整備士": ["冬のタイヤ交換シーズン、1日で60台履き替えた。", "車検の見積もりを出したら、「ディーラーより高い」と言われた。ディーラーだった。", "エンジンオイルの匂いが手から取れず、彼女に言われた。", "「変な音がする」と持ち込まれた車から、助手席の下のペットボトルが出てきた。", "リフトの下で一日中上を向いていて、首が固まった。", "20年乗った車を手放すお客さんが、最後に「ありがとう」と車に言った。", "EVの研修で、整備のやり方がまるで違うことに戸惑った。", "真夏の工場は40度を超えた。", "小学生の見学で、子どもたちがタイヤ交換を見て拍手した。", "二級整備士の試験に一発で受かった。"], "販売店員": ["「いらっしゃいませ」を1日に500回言った。", "セールの初日、開店前から50人並んでいた。", "服を畳んだ瞬間に、お客さんがそれを広げた。", "レジ締めで500円合わず、閉店後1時間探した。", "常連のおばあちゃんが、毎回「あなたがいるから来るのよ」と言ってくれた。", "立ち仕事で、足の裏が毎日悲鳴を上げた。", "「店長を出せ」と言われた。自分が店長だった。", "福袋の準備で、年末は家に帰れなかった。", "同じ商品の色違いを、お客さんと30分悩んだ。結局買わなかった。", "売上目標達成で、店のみんなで焼肉に行った。"], "調理師": ["ランチのピークで、伝票が20枚並んだ。", "玉ねぎを1日で30kg刻んだ。", "見習いの頃、親方にフライパンで頭を叩かれた。", "お客さんが空っぽの皿を返してくれるのが、一番うれしかった。", "真夏の厨房は温度が45度になった。", "包丁で指を切り、絆創膏の上からゴム手袋をして仕事を続けた。", "まかないに作った親子丼が、店の新メニューになった。", "年末はおせちの仕込みで、3日間で6時間しか寝なかった。", "グルメサイトで星1をつけられた。理由は「店が狭い」だった。", "常連さんが「この味が食べたくて来た」と言った。"], "機械組立工": ["ライン作業で、同じボルトを1日に1200本締めた。", "2交代の夜勤明け、工場の外の朝日がまぶしかった。", "品質検査で不良が見つかり、ライン全体が止まった。全員の視線が痛かった。", "組み立てた車が、街を走っているのを見かけた。", "期間工の寮で、隣の部屋のいびきが聞こえた。", "改善提案が採用され、1000円の商品券をもらった。", "ラインのスピードが上がり、トイレに行くタイミングがなくなった。", "10年同じ工程をやって、目をつぶっても組めるようになった。", "社員登用試験に3回目で受かった。", "休憩時間のタバコ部屋で、工場のすべての噂が回っていた。"], "警備員": ["工事現場の交通誘導で、一日中赤い棒を振った。", "夏祭りの警備で、1万人の人波を誘導した。", "夜間の施設警備で、誰もいないビルを3時間おきに巡回した。", "真冬の現場で、カイロを8個貼った。", "通行人にいきなり怒鳴られたが、謝るしかなかった。", "小学生が通学路で毎朝「おはようございます」と挨拶してくれた。", "仮眠室のベッドが固すぎて、寝た気がしなかった。", "深夜の巡回中、警報が鳴った。原因はネズミだった。", "日給9000円で、雨の日も立ち続けた。", "迷子の子どもを親のもとに届けたら、母親が泣いていた。"], "美容師": ["アシスタント時代、閉店後に毎晩ウィッグでカットの練習をした。", "「おまかせで」と言われて切ったら、「思ってたのと違う」と言われた。", "1日にお客さんを12人担当して、昼ご飯は立ったまま3分で食べた。", "シャンプーで手荒れがひどくなり、指が割れた。", "常連さんが結婚式の髪型を任せてくれた。式の写真を送ってくれた。", "「お休みの日は何してるんですか」を1日に8回聞いた。", "手取り14万円で、カット練習用のウィッグは自腹だった。", "スタイリストデビューの日、最初のお客さんは母だった。", "インスタのフォロワーが1万人を超え、指名が倍になった。", "80歳のお客さんに「最後のパーマはあなたに」と言われた。"], "経営者": ["月末、給料日の前日に口座残高を5回確認した。", "銀行の融資担当者に、事業計画書を3回書き直させられた。", "社員の結婚式でスピーチをした。泣いてしまった。", "休日も、頭の中は資金繰りのことばかりだった。", "大口の取引先が倒産し、売掛金800万円が消えた。", "「社長、辞めさせてください」と言われて、引き止める言葉が出なかった。", "初めて黒字になった決算書を、額に入れて飾った。", "異業種交流会で名刺を50枚配った。仕事になったのは0件だった。", "コロナで売上が7割減り、持続化給付金で何とか乗り切った。", "創業10周年のパーティーで、最初の社員と2人で乾杯した。"], "フリーター": ["コンビニとカラオケのバイトを掛け持ちして、週6日働いた。", "店長に「社員にならない？」と言われたが、曖昧に笑ってごまかした。", "深夜のファミレスで、常連の酔っ払いの話を2時間聞いた。", "同級生の昇進の話を聞いて、帰り道に少し落ち込んだ。", "引っ越しバイトで冷蔵庫を5階まで階段で運んだ。", "国民年金の未納通知が届いた。", "バイト先の後輩が、10歳年下だった。", "シフトに入れず、今月の収入が9万円だった。", "バイト仲間と始発まで飲んだ夜が、一番楽しかった。", "「夢があるんです」と言い続けて、気づけば5年経っていた。"], "キャバクラ嬢": ["出勤前にヘアセットで毎日3000円かかった。", "指名が取れず、待機席でスマホばかり見ていた。", "お客さんの誕生日に送る営業LINEを、1日に40通打った。", "シャンパンが入って、店のみんなでコールした。", "飲みすぎて、閉店後に店のトイレで寝てしまった。", "太客が突然来なくなり、今月の売上が半分になった。", "昼間は大学に通っていて、レポートを控室で書いた。", "バースデーイベントで、売上が1晩で300万円になった。", "親には「飲食店で働いてる」と言っていた。", "ヒールで1日立ち続け、足の爪が割れた。"], "ホスト": ["初回のお客さんに「名刺だけ置いていって」と言われた。", "源氏名を決めるのに、先輩たちと2時間会議した。", "シャンパンタワーで、グラスを積むのを手伝った。", "ラストソングを歌わせてもらった。音程は外れていた。", "飲みすぎて、月に3回は記憶がなかった。", "寮は6畳に3人だった。", "売上ゼロの月、先輩にラーメンをおごってもらった。", "お客さんのインスタのストーリーに、毎日いいねを押した。", "ナンバー入りして、店の看板に写真が載った。", "母親から「ちゃんと食べてる？」と電話が来た。"], "暴力団員": ["組の事務所で、毎朝床の雑巾がけから始まった。", "兄貴分の運転手として、1日中車で待った。", "暴力団排除条例のせいで、銀行口座が作れなかった。", "携帯電話の契約もできず、家族の名義を借りた。", "警察のマル暴に顔を覚えられて、街で「おう、元気か」と言われた。", "組長の誕生日会に、正座で3時間座った。", "若い頃に入れた刺青で、温泉にもプールにも行けなかった。", "同じ組の者が逮捕され、差し入れに通った。", "シノギがなく、収入はほぼゼロの月があった。", "母親の葬式に、組の関係で顔を出せなかった。"], "アイドル": ["握手会で、6時間で2000人と握手した。", "地下ライブの客席が、5人だった。", "毎朝5時起きでダンスのレッスンに通った。", "SNSのエゴサーチで、知らない人から悪口を書かれていた。", "ファンの手紙に「毎日の生きがいです」と書いてあり、泣いた。", "ステージで振付を間違えたが、笑顔で乗り切った。", "チェキ1枚1000円の売上が、給料の大半だった。", "センターに選ばれた日、メンバーと抱き合って泣いた。", "恋愛禁止の規約に、契約書でサインした。", "移動はメンバー6人でハイエースに乗り、全国を回った。"], "芸人": ["劇場のライブで、客席が8人で、うち3人は芸人仲間だった。", "バイト先の居酒屋で、店長にネタを見せたらスベった。", "賞レースの1回戦で、2分のネタに1か月かけた。", "相方と喧嘩して、ネタ合わせのファミレスで3時間黙っていた。", "ギャラは1ステージ500円。交通費のほうが高かった。", "テレビの深夜番組で、5秒だけ映った。実家から電話が来た。", "先輩に焼肉をおごってもらい、「売れたら後輩におごれ」と言われた。", "ウケた日の帰り道は、自転車を漕ぎながら1人で笑った。", "芸歴10年目で、ようやくバイトを辞められた。", "親戚の集まりで「テレビ出てないじゃん」と言われた。"], "俳優": ["オーディションに年間50回落ちた。", "エキストラで、通行人Aとして12時間待った。出番は8秒だった。", "舞台のチケットノルマ20枚を、自分で買い取った。", "台本を覚えるのに、風呂でも布団でもぶつぶつ言っていた。", "初めて名前のある役をもらい、エンドロールで自分の名前を探した。", "撮影が朝4時集合で、ロケバスで寝た。", "演出家に「今のは嘘くさい」と30回やり直しさせられた。", "バイト先の客に「ドラマに出てたよね？」と言われた。", "千秋楽のカーテンコールで、客席が総立ちになった。", "30歳を過ぎ、親から「そろそろ」と言われた。"], "タレント": ["情報番組のひな壇で、2時間の収録中に喋れたのは1回だった。", "グルメロケで、1日に7軒のラーメンを食べた。", "SNSの一言が炎上して、謝罪文を3回書き直した。", "地方のショッピングモールのイベントで、観客は30人だった。", "マネージャーが3年で4人替わった。", "食レポで「おいしい」以外の言葉を必死に探した。", "街で声をかけられて、写真を撮ってほしいと言われた。素直にうれしかった。", "レギュラー番組が終わる日、スタッフから花束をもらった。", "バラエティでバンジージャンプを飛ばされた。", "実家の近所の商店街に、自分のサイン色紙が飾られていた。"], "記者": ["夜回りで、警察幹部の自宅前で2時間待った。収穫は「おやすみ」の一言だった。", "締め切り5分前に原稿を送り、デスクに真っ赤に直された。", "スクープを他社に1日差で抜かれた。", "災害現場の取材で、被災者に話を聞くのがつらかった。", "自分の書いた記事で、行政が制度を見直した。", "県警の記者クラブで、各社の記者と麻雀をした。", "休日に呼び出され、事件現場に2時間で駆けつけた。", "取材相手に「あなたになら話す」と言われた。", "ネットで記事が炎上し、コメント欄が1000件を超えた。", "地方支局で、町の運動会を記事にした。"], "テレビ局員": ["ADの頃、ロケ弁を30個運び、自分の分はなかった。", "視聴率が出る朝9時、局内が静まり返った。", "生放送で、テロップの誤字を出してしまった。", "人気番組のエンドロールに、初めて自分の名前が載った。", "編集室に3日泊まり込んだ。", "タレントのマネージャーに、楽屋の弁当の好みを細かく伝えられた。", "深夜番組の企画会議で、ボツが20本続いた。", "年末特番の収録が終わったのは、元日の朝4時だった。", "自分が企画した番組が、ネットでトレンド1位になった。", "視聴率が1%下がって、番組が打ち切りになった。"], "コンサルタント": ["入社1年目、毎日エクセルとパワポで深夜2時まで働いた。", "パートナーに「で、示唆は？」と5回聞かれた。", "クライアント先のフリーアドレスで、毎朝座る場所を探した。", "マッキンゼー出身の上司が、口癖のように「ファクトベースで」と言った。", "1枚のスライドのフォントサイズを揃えるのに30分使った。", "クライアントの社長に、提案が「机上の空論だ」と一蹴された。", "出張で月に10回飛行機に乗り、マイルが貯まりすぎた。", "提案が採用され、工場のコストが年3億円下がった。", "アップ・オア・アウトで同期の半分が去った。", "現場の社員に「コンサルは何もわかってない」と言われ、反論できなかった。"], "外資系金融": ["朝6時にオフィスに着き、海外市場の値動きをチェックした。", "ディールのクロージングで、3日間で合計5時間しか寝なかった。", "初めてのボーナスが基本給の2倍だった。", "Bloombergの端末を見ながら昼ご飯を食べた。", "上司のアメリカ人に、ミーティングで「So what?」と言われた。", "同期の3割が2年でいなくなった。", "タクシーで深夜に帰る日が月20日あった。", "六本木のタワマンに住んだが、家にいるのは寝るときだけだった。", "リーマン・ショックのとき、ある朝デスクが箱ごと片付けられた同僚がいた。", "大型M&Aが成立し、日経新聞の1面に載った。"], "国家公務員": ["国会答弁の作成で、霞が関に朝4時までいた。", "質問通告が前日の夜10時に来た。", "2年ごとの異動で、また一から法律を覚え直した。", "省庁の食堂のカレーを、10年で何百回も食べた。", "自分が関わった法律が国会で成立し、本会議場の傍聴席から見た。", "大臣のレクに、資料を80部刷って持っていった。", "同期が次々に民間に転職していった。", "地方の出先機関に出向し、地元の人と飲み会で仲良くなった。", "「官僚は楽でいいね」と言われ、無言で笑った。", "審議会の議事録を、1文字ずつ確認した。"], "銀行員": ["入社時に、ATMの紙幣補充を習った。", "1円が合わず、支店全員で夜8時まで探した。", "融資を断った町工場の社長に、窓口で泣かれた。", "投資信託の販売ノルマが毎月あった。", "3年ごとの転勤で、引っ越しのたびに段ボール40箱を詰めた。", "支店長の朝礼が毎朝15分あった。", "お客さんの事業計画を一緒に練り、融資が通った。", "店舗統合で、勤めていた支店がなくなった。", "同期の出世レースで、40歳前に先が見えた。", "お客さんのおばあちゃんが、毎月預金にお菓子を添えて来た。"], "商社マン": ["入社3年目で、中東に赴任した。", "取引先との会食で、毎晩2次会まで付き合った。", "為替が1円動いて、利益が2000万円変わった。", "南米の鉱山に出張し、ヘリで現地に入った。", "時差のある国と電話会議で、深夜1時に起きた。", "海外駐在の手当で、貯金が一気に増えた。", "現地スタッフの結婚式に招かれ、3日間踊り続けた。", "大型案件が契約成立し、部署で祝杯をあげた。", "家族を日本に残して単身赴任した。", "「商社って何してるの？」と聞かれて、うまく説明できなかった。"], "広告代理店": ["競合プレゼンのために3日間で企画書を80枚作った。結果は落選で、勝ったのは前任の代理店だった。", "クライアントの「なんか違う」の一言で、絵コンテを7回描き直した。最終的に採用されたのは1案目だった。", "深夜2時のタクシーで、運転手さんに「いつもこの時間ですね」と顔を覚えられた。", "担当したCMが渋谷の街頭ビジョンで流れた。交差点で30秒間ずっと見上げていた。", "SNSキャンペーンが炎上し、土日を謝罪文の調整に費やした。", "新卒の頃にお世話になったクライアントの部長が退職した。最後に「君の企画が一番好きだった」と言われた。", "媒体社との接待で3次会まで付き合い、翌朝のプレゼンを声がかすれたまま乗り切った。", "広告賞の銅賞を取った。チームで焼肉に行き、会計は12万円になった。", "入稿データの電話番号が1桁違っていて、新聞全国版に載る直前に止めた。", "予算500万円の案件で、クライアントの社長の「孫が好きなキャラ」を起用することになった。"], "不動産営業": ["月末に3件契約を決め、営業成績ボードの1位に名前が載った。", "真夏に内見を1日8件回り、ワイシャツを2回着替えた。", "飛び込み営業で100軒インターホンを押し、話を聞いてくれたのは1軒だった。", "初めて家を買ったご夫婦から、引き渡しの日に手紙をもらった。今も手帳に挟んでいる。", "「駅徒歩5分」の物件を案内したら、お客さんに実測で9分かかったと指摘された。", "ノルマ未達で、会議室で1時間詰められた。", "契約当日に買主のローン審査が落ち、3か月の努力が消えた。", "歩合で月給が80万円を超え、親に焼肉をおごった。", "事故物件を案内したお客さんが、「安いから」と即決した。", "水曜定休なのに、お客さんからの電話で結局一日中対応した。"], "建築士": ["一級建築士の製図試験に3回目で合格した。発表を見て、事務所のトイレで叫んだ。", "施主の奥さんが「キッチンは絶対アイランドで」と言い、ご主人と打ち合わせ中に喧嘩が始まった。", "確認申請の差し戻しが4回続き、着工が1か月遅れた。", "設計した住宅の上棟式で、餅まきに近所の子どもが30人集まった。", "模型を徹夜で作り、朝のプレゼンでスチレンボードの切れ端が髪に付いたままだった。", "現場で大工さんに「図面通りだと納まらない」と言われ、その場で描き直した。", "10年前に設計した家の施主から、子どもが巣立ったのでリフォームしたいと連絡が来た。", "役所の窓口で、斜線制限について2時間担当者と議論した。", "コンペで落選した案を、5年後に別の敷地で実現できた。", "施主から「思っていたより狭い」と言われ、何度も説明したのにと胃が痛くなった。"], "税理士": ["確定申告の時期、3月15日まで休みは2日しかなかった。", "顧問先の社長がレシートを段ボール2箱に詰めて持ってきた。", "税理士試験の5科目目の合格通知を見て、10年かかったと数えた。", "税務調査に立ち会い、交際費の中身を一つずつ説明した。追徴は30万円で済んだ。", "「経費で落ちますか」と社長に聞かれたのは、愛犬のトリミング代だった。", "顧問先の町工場が廃業することになった。最後の決算書を作りながら、30年分の帳簿を眺めた。", "会計ソフトの連携ミスで仕訳が2000件ダブっていた。", "相続税の申告で、兄弟3人の言い分を3時間聞いた。", "顧問先の居酒屋が黒字化し、社長に好きなだけ飲ませてもらった。", "インボイス制度の説明会を月に8回やった。"], "獣医師": ["夜間救急で、チョコを食べた柴犬の催吐処置を3件続けてやった。", "14年連れ添った猫の安楽死に立ち会った。飼い主さんより先に泣きそうになった。", "牛の難産で、夜中の2時に牛舎まで呼ばれ、肩まで腕を入れて子牛を引き出した。", "診察台で暴れる猫に、腕を5か所引っかかれた。", "「先生、ネットではこう書いてました」と、飼い主に印刷した紙を10枚渡された。", "手術した子犬が退院の日、しっぽを全力で振って帰っていった。", "獣医師国家試験に合格し、6年分の教科書を段ボールで実家に送った。", "治療費の見積もり30万円を伝えると、飼い主さんが黙り込んだ。", "ハムスターの体重を0.1g単位で測り、薬の量を計算した。", "休日に散歩中の犬に吠えられ、職業病で歯並びを見てしまった。"], "編集者": ["担当作家の原稿が締切を2週間過ぎ、自宅前で待機した。", "担当した本が重版になり、作家さんと電話越しに乾杯した。", "誤植が刷り上がった5000部に見つかり、正誤表を作った。", "新人賞の応募原稿を一晩で40本読み、朝日がまぶしかった。", "作家さんの「一行だけ直したい」が、結局全体の書き直しになった。", "書店で担当本が平積みされているのを見つけ、こっそり一番上に並べ直した。", "校了日の印刷所で、深夜に缶コーヒーを3本飲んだ。", "担当した作家さんが文学賞の候補になり、待ち会のホテルで落選の電話を受けた。", "企画会議で通した本が初版3000部で、返品率が60%だった。", "10年担当した作家さんが亡くなった。遺稿の整理を家族に頼まれた。"], "デザイナー": ["「ロゴをもうちょっと大きく」と言われて5%拡大したら、「そうそう、これ」と褒められた。", "納品データのフォントがアウトライン化されておらず、印刷所から電話が来た。", "手がけたパッケージがコンビニの棚に並び、写真を20枚撮った。", "クライアントの甥っ子がCanvaで作った案と比較された。", "Photoshopが保存前に落ち、3時間分の作業が消えた。", "コンペで採用された駅のポスターが、1か月間駅に貼られていた。", "「いい感じで」とだけ書かれた依頼書を受け取った。", "修正15回目のメールの件名が「Re:Re:Re:Re:Re:最終版_修正_本当の最終」になっていた。", "デザイン学校の後輩に、ポートフォリオを見てほしいと頼まれ、2時間語った。", "Adobeのサブスク代が年間8万円を超えていることに気づいた。"], "ゲーム開発者": ["マスターアップ直前に致命的なバグが見つかり、会社に3日泊まった。", "発売日にSNSで「神ゲー」と書かれた投稿を見つけ、スクショを保存した。", "ガチャの確率表記ミスで、お詫び石を全ユーザーに配った。", "自分が書いたバグが、海外のスピードランナーに「技」として使われていた。", "担当していたタイトルが開発中止になり、2年分の作業が消えた。", "ゲームショウのブースで、子どもが自分の作ったステージを笑いながら遊んでいた。", "仕様書の「ふんわりジャンプ」の解釈で、プランナーと1時間揉めた。", "運営タイトルのサービス終了告知を出した夜、ユーザーの感謝の投稿が1000件を超えた。", "デバッグで同じステージを500回プレイした。", "エンドロールに自分の名前が流れるのを、実家のテレビで家族と見た。"], "客室乗務員": ["羽田から那覇まで1日3往復した。降りたら耳がキーンとしていた。", "機内で急病人が出て「お医者様はいらっしゃいますか」とアナウンスした。3人手が挙がった。", "パリのステイ先でパン屋を巡り、5軒目でお腹いっぱいになった。", "揺れる機内でコーヒーを注ぐのにも慣れ、自宅でも無意識に腰を落として注いでいた。", "初めてのフライトで泣いていた子どもに折り紙を渡したら、降りるときに手紙をくれた。", "時差ボケで、日本に帰ってきたのに朝4時に目が覚めた。", "乗客にビジネスクラスへのアップグレードを強く要求され、30分なだめた。", "台風で欠航が相次ぎ、空港のカウンターで300人に謝った。", "国家試験はないが、訓練の緊急脱出テストで3回目にやっと合格した。", "最終フライトの日、機長がアナウンスで自分の名前を呼んでくれた。"], "気象予報士": ["「午後は晴れ」と予報した日に、局地的な雷雨で街がずぶ濡れになった。", "気象予報士試験に4回目で合格した。合格率は5%だった。", "台風接近で3日間局に泊まり込み、仮眠室のソファで寝た。", "桜の開花予想が1日ずれて、ネットで少しだけ叩かれた。", "「傘を持って行ってよかった」というメッセージが視聴者から届いた。", "早朝番組のため、毎朝3時に起きる生活を2年続けた。", "天気図の前線の書き方を、中継先で子どもに説明した。", "線状降水帯の情報を出した夜、被害が少なく済んで心からほっとした。", "雪の予報が外れて、スーパーの在庫を抱えた担当者に恨まれた。", "休日でも雲を見ると種類を言い当ててしまい、家族に呆れられた。"], "司書": ["「タイトルは忘れたけど表紙が青い本」を探してほしいと頼まれ、30分で見つけた。", "返却ボックスに、ページにパスタのソースが付いた料理本が入っていた。", "毎週来ていたおじいさんが来なくなり、しばらくして訃報を聞いた。", "子ども向けのおはなし会で、絵本を読んだら20人が前のめりで聞いてくれた。", "会計年度任用職員で、5年目の契約更新の面接を受けた。", "蔵書点検で3日間休館し、10万冊のバーコードを読み取った。", "レファレンスで「戦前の地元の地図」を探し、郷土資料室で一日がかりで見つけた。", "新刊のベストセラーに予約が300件入った。", "選書した本が1年で80回貸し出され、小さくガッツポーズした。", "「静かにしてください」と高校生に注意したら、翌年その子が司書を目指していると言ってきた。"], "パイロット": ["初めて機長として着陸したとき、乗客から拍手が起きた。", "横風の強い羽田でゴーアラウンドを決断し、2回目で降りた。", "半年に一度の身体検査の前は、毎回お酒を控えて体重を落とした。", "シミュレーター審査で、エンジン故障の訓練を一晩中やった。", "富士山の真上を夕方に飛び、コックピットからの景色に言葉が出なかった。", "子どもが「パイロットになりたい」と言いながらコックピットを見学しに来た。", "アルコール検査で0.00を確認してから乗務した。", "時差のせいで、自分の誕生日をアンカレッジ上空で迎えた。", "副操縦士になるまで訓練に5年かかった。", "雷雲を避けるため航路を変え、到着が40分遅れたことを謝るアナウンスをした。"], "MR": ["医師に5分話を聞いてもらうため、医局の前で2時間待った。", "営業車で1日200km走り、地方の病院を7軒回った。", "新薬の説明会で、医師30人の前で発表した。手汗でレーザーポインターが滑った。", "接待規制が厳しくなり、説明会の弁当は1人3000円以内になった。", "担当エリアの売上目標を達成し、社内表彰でハワイ旅行に行った。", "MR認定試験に合格した。薬理の暗記で頭が爆発しそうだった。", "自社の薬で症状が改善したという患者さんの話を、医師から聞いた。", "転勤の辞令で、3年で4県目に引っ越した。", "医師に名前を覚えてもらえるまで、半年かかった。", "副作用報告の対応で、深夜まで報告書をまとめた。"], "栄養士": ["給食センターで、1日4000食分のカレーの献立を立てた。", "小学校の給食で人気投票をしたら、揚げパンが3年連続1位だった。", "病院の糖尿病患者さんに食事指導をしたら、「先生、昨日ケーキ食べちゃった」と打ち明けられた。", "アレルギー表示のチェックで、卵の混入を直前に見つけた。", "管理栄養士国家試験に合格した。同期8人で焼肉食べ放題に行った。", "病院食の味が薄いとクレームが来たが、塩分は1日6g未満のままにした。", "献立の原価計算で、1食250円に収めるために頭を抱えた。", "老人ホームで、嚥下食のプリンを「おいしい」と言ってくれたおばあちゃんがいた。", "献立表に誤字があり、「酢豚」が「素豚」になっていた。", "自分の食生活はカップ麺だということを、同僚に指摘された。"], "通訳・翻訳": ["国際会議の同時通訳で、15分交代のブースに8時間いた。", "納期3日で、200ページの技術マニュアルを翻訳した。", "商談の通訳で、社長のダジャレを訳せずに困り果てた。", "字幕翻訳で、1秒4文字の制限に台詞を収めるのに一晩かかった。", "翻訳した小説が出版され、訳者あとがきに名前が載った。", "機械翻訳のポストエディット案件で、単価が以前の半分になった。", "医療通訳で、患者さんに余命を伝える医師の言葉を訳した。", "英検1級に合格した。履歴書の資格欄が少し誇らしくなった。", "首脳会談の通訳を担当した日、手が震えて水が飲めなかった。", "クライアントから「AIの方が早い」と言われ、契約を切られた。"], "社会福祉士": ["生活保護の申請に同行し、窓口で1時間粘った。", "担当していた高齢者の一人暮らしの家に、3日連絡がなく駆けつけた。", "社会福祉士の国家試験に合格した。合格率は30%だった。", "虐待の通報で、夜10時に児童相談所と家庭訪問した。", "支援していた若者が就職し、初任給でお菓子を持ってきてくれた。", "ケース会議が1日に5件あり、記録を書くのが深夜になった。", "施設入所を嫌がるおじいさんを、半年かけて説得した。", "給料の手取りが20万円を切っていると気づき、少し悲しくなった。", "相談者から理不尽に怒鳴られ、帰り道でコンビニのアイスを食べた。", "「あなたがいたから生きてこられた」と言われ、仕事を続ける理由ができた。"], "理学療法士": ["脳梗塞の患者さんが、3か月のリハビリで初めて自分の足で10m歩いた。", "1日18単位のノルマに追われ、カルテを書く時間がなかった。", "患者さんのおじいちゃんに、毎回孫の写真を見せられた。", "国家試験に合格し、白衣に名札をつけた日に背筋が伸びた。", "スポーツ整形外科で、高校球児の肩のリハビリを担当した。甲子園に出たと連絡が来た。", "移乗介助で腰を痛め、自分がリハビリを受ける側になった。", "訪問リハビリで、1日に車で6軒回った。", "「痛いのは嫌だ」と拒否する患者さんに、30分雑談してからリハビリに誘った。", "退院の日、患者さんが自分の足で歩いて帰っていく背中を見送った。", "給料が10年でほとんど上がらないことに気づいた。"], "消防士": ["24時間勤務明けに、子どもの運動会に駆けつけた。", "消防学校の訓練で、ロープ登はんを毎日50回やった。", "火災現場から高齢女性を救出した。後日、家族が菓子折りを持ってきた。", "救急出動が1当務で12件あり、仮眠はゼロだった。", "夏の消防署見学で、子どもたちが消防車に乗って大はしゃぎしていた。", "署の食事当番で、20人分のカレーを作った。", "助けられなかった命があり、帰り道に車の中で長い間座っていた。", "山火事の消火で、3日間ほとんど寝ずに放水を続けた。", "非番の日に偶然交通事故に遭遇し、心肺蘇生をした。", "はしご車の操作資格を取り、地上30mから街を見下ろした。"], "警察官": ["交番で道案内を1日30件した。", "警察学校の寮で、ベッドメイキングを毎朝チェックされた。", "落とし物の財布を届けた小学生に、お礼の言葉を書いた紙を渡した。", "夜勤中、酔っ払いに絡まれて3時間保護した。", "空き巣の犯人を張り込み5日目で逮捕した。", "迷子のおばあちゃんを家まで送り届けたら、お茶を出されて断るのに苦労した。", "交通事故の現場処理で、真冬の深夜に2時間立ち続けた。", "非番の日も呼び出され、ゆっくり休めた日が月に3日しかなかった。", "巡査部長の昇任試験に合格した。", "子どもに「お巡りさん、かっこいい」と言われ、敬礼を返した。"], "自衛官": ["教育隊で、ベッドのシーツの角を毎朝定規で測られた。", "30kgの装備を背負い、夜通し40km歩いた。", "豪雨災害の派遣で、2週間泥をかき出した。避難所のおばあちゃんに手を握られた。", "金曜日のカレーが楽しみで1週間を乗り切った。", "駐屯地の夏祭りで、地元の子どもに戦車に乗せてあげた。", "演習で3日間山にこもり、帰ってきて初めて風呂の温かさに泣きそうになった。", "辞令で北海道から沖縄へ転勤になった。", "射撃検定で1級を取った。", "艦艇勤務で4か月航海し、スマホの電波が届いた瞬間に通知が200件来た。", "任期満了の日、同期と駐屯地の門で写真を撮った。"], "鉄道員": ["終電後の線路で、保線作業を朝4時まで続けた。", "運転士の試験に合格し、初めて客を乗せて運転した。指差喚呼の声が裏返った。", "人身事故の対応で、ダイヤが2時間乱れた。", "ホームで迷子の子どもを見つけ、お母さんのところに連れて行った。", "駅員室で、酔っ払った乗客に絡まれた。", "大雪で運休になり、駅に泊まる乗客に毛布を配った。", "定時運行で、停止位置を1cmもずらさずに止めた。", "鉄道オタクの子どもに、車両の型式を聞かれて答えたら尊敬された。", "年末年始も勤務で、元日の朝は駅のホームで迎えた。", "最後の乗務の日、運転台に花束が置かれていた。"], "漁師": ["午前2時に出港し、初セリで鯛が1匹2万円の値をつけた。", "台風の後、網が全部流されて80万円の損害が出た。", "一晩で船酔いして、海に謝りながら吐いた。", "燃料代が上がり、漁に出るほど赤字になった月があった。", "父親から船を継ぎ、初めて自分の名前で漁協に登録した。", "獲れたてのサバを港で刺身にして食べた。", "水揚げが過去最低で、漁協の仲間と港で黙ってタバコを吸った。", "ふるさと納税の返礼品に自分の魚が選ばれ、全国から注文が来た。", "嵐の夜、遭難した仲間の船を探しに出た。全員無事だった。", "孫が「じいちゃんの船に乗りたい」と言ってくれた。"], "歯科衛生士": ["1日に患者さん15人の歯石を取った。", "「痛かったら左手を挙げてください」と言ったら、両手を挙げた患者さんがいた。", "歯科衛生士の国家試験に合格した。", "小学生の歯磨き指導で、染め出し液で真っ赤になった歯を見て子どもたちが悲鳴をあげた。", "3年通ってくれた患者さんから、歯周ポケットが浅くなったとお礼を言われた。", "院長の機嫌で、診療室の空気が1日中重かった。", "歯医者嫌いの子どもが、最後に「また来る」と言ってくれた。", "訪問歯科で、施設のおじいちゃんの入れ歯を磨いた。", "マスクの跡が顔にくっきり残り、退勤後もしばらく取れなかった。", "他の歯科医院から、時給200円高い条件で引き抜きの声がかかった。"], "司法書士": ["司法書士試験に5回目で合格した。合格率は4%だった。", "不動産の決済に立ち会い、1日で3件の登記を申請した。", "相続登記で、戸籍を明治時代まで遡って取り寄せた。", "成年後見人として、担当の高齢者の通帳を毎月チェックした。", "会社設立の登記を依頼され、社長の熱い夢を2時間聞いた。", "登記の書類に1文字ミスがあり、法務局に補正に行った。", "債務整理で、多重債務の依頼者と一緒に返済計画を立てた。", "相続人が25人いる土地の登記で、全員の印鑑をもらうのに1年かかった。", "簡易裁判所の代理人として、初めて法廷に立った。", "事務所の看板を出した日、自分の名前を見上げてしばらく立っていた。"], "アナウンサー": ["入社2年目で初めてニュースを読み、原稿をめくる手が震えた。", "生放送で噛んでしまい、SNSでトレンド入りした。", "早朝番組のため、3時半起きを3年続けた。", "台風中継でカッパを着て、海辺で風に飛ばされそうになった。", "アナウンサー試験は倍率1000倍だった。", "地方局で、商店街のグルメリポートを1日5軒こなした。", "大きな事件のニュースを読み、カメラが切り替わった後で深呼吸した。", "視聴者から「声に癒されます」という手紙が届いた。", "週刊誌に私生活を書かれ、しばらく外出を控えた。", "最後の担当番組の日、スタッフ全員から寄せ書きをもらった。"], "声優": ["オーディションを年間80本受け、受かったのは3本だった。", "アニメで「通行人C」の役をもらい、台詞は「えっ」の一言だった。", "養成所の月謝を払うため、コンビニの夜勤を2年続けた。", "初めて名前のある役をもらい、エンドロールを録画して何度も見返した。", "収録で叫ぶ演技を30テイク重ね、翌日声が出なかった。", "イベントで1000人の観客の前に立ち、膝が震えた。", "ナレーションの仕事で、商品名を100回言い直した。", "喉のケアのため、冬は毎晩マスクをして寝た。", "ファンレターに「このキャラに救われました」と書いてあった。", "事務所の預かりから正所属に上がれず、契約が切れた。"], "漫画家": ["新人賞で佳作を取り、賞金30万円をもらった。", "連載の締切前、アシスタント4人と3日間徹夜した。", "担当編集にネームを10回ボツにされた。", "単行本1巻の発売日、書店を5軒回って自分の本を探した。", "アンケート順位が最下位になり、10週で打ち切りになった。", "腱鞘炎で右手が使えず、左手でベタを塗った。", "ファンレターに描かれた自分のキャラの絵が、自分より上手かった。", "アシスタント時代、先生の背景を5年間描き続けた。", "作品がアニメ化され、オープニング映像を見て泣いた。", "運動不足で、連載3年で体重が12kg増えた。"], "料理人": ["修業先の店で、3年間皿洗いと仕込みだけをした。", "まかないを作ったら、親方に「やっと食える味になった」と言われた。", "ランチのピークで、1時間に80食さばいた。", "包丁で指を切り、絆創膏の上からゴム手袋をして営業を続けた。", "グルメサイトの評価が3.5を超え、予約が2か月先まで埋まった。", "仕入れの魚が高騰し、原価率が40%を超えた。", "常連さんが、結婚の報告をしにカウンターに来てくれた。", "真夏の厨房は45℃になり、1日に2リットル水を飲んだ。", "ミシュランの調査員らしき客が来たと店中がざわついた。結局違った。", "自分の店を開いた日、最初のお客さんは両親だった。"], "インフルエンサー": ["投稿が1日で100万回再生され、フォロワーが3万人増えた。", "PR案件の撮影で、同じ角度の写真を200枚撮った。", "何気ない一言が切り取られて炎上し、DMが1000件届いた。", "カフェで撮影している間に、料理が冷めきっていた。", "企業から化粧品のPR案件が来て、1投稿で30万円もらった。", "アルゴリズムが変わり、エンゲージメントが半分になった。", "ファンミーティングに200人が来てくれた。", "ステマ規制で、投稿に「PR」と書き忘れて指摘された。", "1年で旅行に12回行ったが、楽しかった記憶より撮影の記憶が多い。", "フォロワーから「あなたの投稿で頑張れた」とメッセージをもらった。"], "YouTuber": ["10分の動画の編集に、丸2日かかった。", "チャンネル登録者が1000人を超え、収益化の審査に通った。", "初めての月収益が、2463円だった。", "企画で大食いをして、その夜吐いた。", "動画が急上昇ランキングに入り、一晩で登録者が5万人増えた。", "コメント欄に「つまらない」と書かれ、その日は編集の手が止まった。", "広告の単価が下がり、収益が前月の半分になった。", "コラボ相手とスケジュールが合わず、企画が3回流れた。", "登録者10万人で銀の盾が届き、実家に送った。", "親が近所に自分のチャンネルを宣伝していて、恥ずかしかった。"], "プロゲーマー": ["1日12時間練習し、ランクマッチで国内1位になった。", "大会で優勝し、賞金100万円をチームで分けた。", "配信で1万人が見てくれたが、その日に限って負け続けた。", "ゲームのアップデートでキャラが弱体化し、1から練習し直した。", "腱鞘炎になり、1か月コントローラーを握れなかった。", "海外大会のために、初めてパスポートを取った。", "スポンサー企業からゲーミングチェアを提供された。", "親に「いつまでゲームやってるの」と言われ続けた末に、大会の決勝を見てもらった。", "敗退した夜、チームメイトとファミレスで朝まで反省会をした。", "20代後半で、反射神経の衰えを感じ始めた。"], "プロ野球選手": ["ドラフト5位で指名され、契約金は3000万円だった。", "2軍の寮で、朝6時から素振りを500回した。", "1軍初打席でヒットを打ち、記念のボールを実家に送った。", "キャンプで1日中ノックを受け、宿舎の階段を上れなくなった。", "サヨナラヒットを打ち、ヒーローインタビューで声が裏返った。", "肘を痛めてトミー・ジョン手術を受け、1年半投げられなかった。", "契約更改で年俸が500万円ダウンした。", "少年野球教室で、子どもたちにサインを100枚書いた。", "戦力外通告を受け、トライアウトに挑戦した。", "引退試合で、球場の3万人から拍手をもらった。"], "Jリーガー": ["プロ契約の初年度、年俸は420万円だった。", "J3のアウェイ遠征で、バスで8時間移動した。", "初ゴールを決め、ゴール裏のサポーターに飛び込んだ。", "前十字靭帯を断裂し、9か月リハビリをした。", "夏場の試合で、ハーフタイムに体重が3kg減っていた。", "PK戦で外し、ロッカールームで泣いた。", "地元の小学校を訪問し、子どもたちとミニゲームをした。", "昇格争いの最終節で勝ち、J1昇格が決まった。", "契約満了で、オフにクラブを探して3チームの練習に参加した。", "海外クラブのスカウトが試合を見に来ていると聞き、いつもより走った。"], "Bリーガー": ["アリーナの演出で、暗転の中を名前を呼ばれて入場した。", "1シーズン60試合を戦い、膝に水が溜まった。", "ブザービーターの3ポイントを決め、会場が揺れた。", "身長190cmでもチームでは小さい方だった。", "外国籍選手とのコミュニケーションのために、英会話アプリを毎日続けた。", "地方アウェイの移動が連日続き、ホテルの天井ばかり見ていた。", "ファンクラブイベントでハイタッチを300人とした。", "B2からB1への昇格を決めた夜、選手全員で泣いた。", "足首を捻挫し、テーピングを2重に巻いて試合に出た。", "子どもに「将来Bリーガーになる」と言われ、シューズにサインした。"], "大工": ["見習い時代、カンナがけを1年間ひたすら練習した。", "夏の屋根の上は50℃近くになり、ペットボトル4本を空けた。", "上棟の日、施主さんからご祝儀と弁当をもらった。", "ノミで指を切り、5針縫った。", "一人前と認められ、親方から自分用の道具箱をもらった。", "施主さんの子どもが、毎日現場を見に来て「大工さんかっこいい」と言った。", "プレカットの普及で、刻みの仕事が減った。", "20年前に建てた家の修繕を頼まれ、自分の仕事に再会した。", "雨の日は現場が止まり、日給が出なかった。", "宮大工に憧れて、寺の修復現場を見学に行った。"], "配管工": ["真冬の朝、凍結した水道管の修理で1日に8件回った。", "床下に潜って、蜘蛛の巣まみれになった。", "マンションの水漏れで、下の階の住人に謝りに行った。", "給水装置工事主任技術者の資格に合格した。", "トイレの詰まりの原因が、子どものおもちゃの車だった。", "新築ビルの配管を1年かけて施工した。", "夜中の2時に緊急の呼び出しがあり、水浸しの台所に駆けつけた。", "古い鉛管を交換し、住人に水がおいしくなったと言われた。", "現場で腰を痛め、1週間休んだ。", "「水道屋さん、ありがとう」と、お客さんの子どもに手紙をもらった。"], "溶接工": ["アーク溶接の光で目をやられ、一晩中目が痛かった。", "JISの溶接技能者評価試験に合格した。", "夏の工場で、防護服の中が汗でびしょびしょになった。", "造船所で、巨大なタンカーの溶接に参加した。", "ビードがきれいに揃い、班長に「いい仕事だ」と言われた。", "火花が作業着の隙間から入り、腕にやけどの跡ができた。", "X線検査で溶接不良が見つかり、やり直しになった。", "高所での溶接作業で、足がすくんだ。", "溶接ロボットが導入され、自分の仕事がなくなるか心配した。", "技能五輪の全国大会に出場した。"], "塗装工": ["足場の上で、3階建ての外壁を1週間かけて塗った。", "シンナーの匂いで頭が痛くなり、休憩を多めにとった。", "塗り終わった直後に雨が降り、塗り直しになった。", "施主さんに「新築みたい」と言われ、写真を撮らせてもらった。", "一級塗装技能士の試験に合格した。", "白い作業着が、1日でカラフルになった。", "色見本と実際の色が違うとクレームが来た。面積効果の説明に30分かかった。", "橋梁の塗装で、高さ40mで作業した。", "真冬は塗料が乾かず、工期が延びた。", "親方から「刷毛目が揃ってきた」と言われ、初めて褒められた。"], "解体工": ["重機で木造2階建てを3日で解体した。", "解体中の家の押し入れから、昭和の古いアルバムが出てきた。施主に届けたら泣かれた。", "アスベストの調査で、マスクを二重にして作業した。", "粉塵対策で、散水をしながら1日中作業した。", "近所の住人から騒音の苦情が来て、謝りに行った。", "解体した家の跡地が更地になり、空がやけに広く見えた。", "天井裏からハクビシンの巣が出てきた。", "重機の免許を取り、初めてユンボを操縦した。", "産業廃棄物の分別が厳しくなり、作業時間が倍になった。", "子どもの頃に通った駄菓子屋を解体することになった。"], "タクシー運転手": ["深夜2時、酔った乗客に3回同じ話を聞かされた。", "乗客が忘れていったスマホを、交番まで届けた。", "1日の売上が2万円を切り、給料日前に焦った。", "二種免許を取り、初めてお客さんを乗せた。", "陣痛が始まった妊婦さんを病院まで乗せた。後日、赤ちゃんの写真付きの手紙が届いた。", "配車アプリの導入で、流しで客を拾う時間が減った。", "長距離のお客さんを乗せ、1回で5万円の売上になった。", "お客さんに「この道、遠回りじゃないですか」と言われ、カーナビを見せて説明した。", "隔日勤務の明けに、昼間のファミレスでビールを飲んだ。", "道を覚えるために、休日に地図を眺めた。"], "バス運転手": ["朝5時半の始発に乗務した。乗客は1人だけだった。", "大雪の日、坂道でチェーンを巻いた。", "運転中に急ブレーキをかけ、乗客が転倒して報告書を書いた。", "小学生が毎朝「おはようございます」と言って乗ってきた。", "大型二種免許を取った。", "運転手不足で、休日出勤が月に5回あった。", "乗客に運賃のことで30分怒鳴られた。", "観光バスで、修学旅行の生徒40人を京都まで運んだ。", "最終便で乗り過ごしたおばあさんを、営業所の同僚の車で家まで送ってもらった。", "路線の廃止が決まり、最後の運行日に地元の人たちが手を振ってくれた。"], "宅配ドライバー": ["1日に180個を配った。再配達が42個あった。", "不在票を入れた3分後に「今いるんですけど」と電話が来た。", "年末のお歳暮シーズン、昼ごはんを食べる時間が1週間なかった。", "エレベーターのない5階建て団地に、米10kgを4回運んだ。", "毎週来るおばあちゃんに、みかんを2個もらった。", "置き配の荷物が盗まれたと言われ、会社に始末書を書いた。", "犬に吠えられ続けて3年、ついにしっぽを振られた。", "トイレを借りられるコンビニの地図が頭に完成した。", "「いつもありがとう」と玄関に手紙が貼ってあった。トラックで読んで少し泣いた。", "ブラックフライデーの翌週、荷台が天井まで埋まった。"], "倉庫作業員": ["1日に2万3千歩歩いた。万歩計アプリに褒められた。", "ハンディ端末のピッという音が夢に出てきた。", "夏の倉庫は38度あった。塩タブレットを1日8個食べた。", "フォークリフトの免許を取って、時給が100円上がった。", "棚番号を覚えすぎて、スーパーでも商品の位置を棚番号で考えた。", "派遣で来た大学生が3日で来なくなった。", "セール前日、出荷が通常の4倍の1万2千件になった。", "休憩室の自販機のコーンスープだけが冬の楽しみだった。", "ピッキングミスゼロを半年続けて、表彰状と500円のQUOカードをもらった。", "重いダンボールを持ち上げた瞬間、腰がグキッと鳴った。"], "工場ライン作業員": ["8時間、ネジを1本ずつ締め続けた。1日で2,400本だった。", "夜勤明けの朝日がやけにまぶしかった。", "ラインが止まり、班長が走ってきた。原因は自分ではなかった。安心した。", "耳栓をしていても、帰りの電車でまだ機械の音が聞こえた。", "期間工の満了金で中古の軽自動車を買った。", "改善提案が採用されて、報奨金3,000円をもらった。", "食堂のカレーが280円で、週4回食べた。", "ブラジル出身の同僚にサッカーに誘われた。", "自分が組み立てた車が街を走っているのを見て、少し誇らしかった。", "3交代のシフトで、曜日の感覚がなくなった。"], "清掃員": ["オフィスビルのトイレを1日42か所掃除した。", "朝5時のビルは静かで、窓から見る朝焼けが好きだった。", "エレベーターで社員に「いつもきれいにしてくれてありがとう」と言われた。", "誰かがゴミ箱に捨てた未開封のケーキを見て、世の中を考えた。", "ポリッシャーの扱いが上手くなり、床がピカピカに光った。", "駅のトイレで、信じられない汚れ方をした個室に出会った。", "清掃中の看板を無視して入ってくる人が1日に10人いた。", "冬の窓拭きで指先の感覚がなくなった。", "子どもに「お掃除の人かっこいい」と言われた。", "ビルクリーニング技能士の資格を取った。"], "郵便局員": ["年賀状の仕分けで、1日に1万2千枚さばいた。", "雪の日、カブで坂道を上れず押して歩いた。", "年賀はがきの自爆営業で、自分で800枚買った。", "かもめーるの販売ノルマに追われた。", "宛名が「となりのトトロ様」のはがきが届いた。", "区分機が止まって、全員で手作業で仕分けた。", "窓口で1時間、切手の種類について質問された。", "配達区域の犬の名前を全部覚えた。", "毎年手紙を受け取っていたおばあちゃんが施設に入った。最後の配達で手を振ってくれた。", "ゆうパックの冷凍品が溶けかけて走った。"], "刑務官": ["受刑者の点呼を1日6回とった。", "夜勤で、4時間おきに巡回した。廊下の足音がやけに響いた。", "出所した元受刑者から「真面目にやっています」と手紙が届いた。", "官舎の隣が上司の家で、休日も気が抜けなかった。", "刑務所作業で作られた家具の展示即売会を手伝った。", "受刑者に「先生」と呼ばれることに、最初は戸惑った。", "同じ顔が3年後にまた入所してきた。", "非常ベルが鳴り、全員で走った。誤報だった。", "護身術の訓練で投げられ、背中が真っ青になった。", "高齢受刑者のおむつ交換も仕事になった。"], "寿司職人": ["見習い3年目、ようやくシャリを握らせてもらえた。", "朝5時に豊洲へ行き、マグロの目利きを親方の横で見た。", "「飯炊き3年、握り8年」と言われ、気が遠くなった。", "常連さんに「今日のコハダはいいね」と言われ、一日中うれしかった。", "回転寿司チェーンの職人募集が月給35万円で、少し心が揺れた。", "手が冷たくないと握れないので、冬でも水で手を冷やした。", "外国人観光客が写真を40枚撮ってから食べ始めた。", "包丁を研ぎすぎて、親方に「減らすな」と怒られた。", "独立した兄弟子の店に食べに行き、勝てないと思った。", "予約客が無断キャンセルし、仕込んだネタ8人分が余った。"], "パン職人": ["毎朝3時に起きて、生地をこねた。", "クロワッサンの層が27層きれいに出た。", "湿度で発酵がうまくいかず、全部捨てた日があった。", "焼きたてのメロンパンが10分で完売した。", "閉店間際の値引きを待つお客さんの顔ぶれを全員覚えた。", "オーブンで腕をやけどして、跡が3つ残った。", "小学生に「パン屋さんになりたい」という作文をもらった。", "食パンブームで、近所に高級食パン店が4軒できて、2年で全部閉まった。", "売れ残りのパンを子ども食堂に届けた。", "小麦の値上げで、あんパンを20円値上げした。"], "和菓子職人": ["練り切りで菊の花を作り、1日に300個仕上げた。", "あんこを炊く鍋の前に4時間立った。", "お彼岸前はおはぎを2,000個作った。", "親方に「季節を手で表せ」と言われた。", "茶道の先生から、茶会用の注文が入った。", "若い客が少なく、インスタを始めた。", "上生菓子の写真が話題になり、海外の人が来店した。", "小豆の産地が不作で、仕入れ値が1.5倍になった。", "子どもの体験教室で、うさぎのつもりがねずみになった作品を褒めた。", "老舗の暖簾を守ることの重さを、法事の注文で知った。"], "庭師": ["松の剪定で、1本に丸一日かかった。", "脚立の上で蜂の巣に遭遇し、走って逃げた。", "お屋敷の奥様に、休憩でお茶と羊羹を出してもらった。", "夏の草むしりで、汗で作業着が3回絞れた。", "親方から「木の声を聞け」と言われたが、まだ聞こえなかった。", "施主のおじいさんが亡くなり、遺族が庭を残すと決めてくれた。", "京都の寺の庭の手入れを手伝った。", "一級造園技能士の試験に合格した。", "冬の雪吊りの作業で、指がかじかんだ。", "自分が植えた桜が10年経って満開になった。"], "林業作業員": ["チェーンソーで、樹齢60年の杉を倒した。", "山の中で鹿と目が合った。", "夏はヒル、冬は雪で、仕事場が一番の敵だった。", "日当が雨で流れて、月収が18万円だった。", "地域おこし協力隊から林業に入った若者が3人いた。", "倒した木が予定と違う方向に倒れて、肝を冷やした。", "山の上で食べるおにぎりが一番うまかった。", "スズメバチに2回刺され、エピペンを持ち歩くようになった。", "自分が植えた苗木が、孫の代で使われると思うと不思議だった。", "高性能林業機械のハーベスタを操作できるようになった。"], "コンビニ店長": ["深夜のバイトが2人辞め、自分が週5で夜勤に入った。", "恵方巻のノルマが300本で、親戚に配った。", "24時間、店の電話が鳴る気がした。", "外国人留学生のバイトが、自分より敬語がうまかった。", "レジ横のホットスナックが、夕方に全部売れた。", "本部のSVに、売上が前年比98%だと詰められた。", "万引き犯を追いかけて、駐車場で転んだ。", "年末年始も店は開いていて、元旦の朝は1人でおでんを並べた。", "常連の小学生が中学生になり、制服姿で挨拶に来た。", "廃棄の弁当を毎日食べて、5kg太った。"], "パチンコ店員": ["インカムで「〇番台、ドル箱お願いします」と1日100回言った。", "耳栓をしても、帰り道の耳鳴りが続いた。", "開店前の行列が200人できた。", "新台入替の日は、朝7時から準備した。", "お客さんに「この台出ないぞ」と怒られた。", "大当たりしたおばあちゃんに、缶コーヒーをもらった。", "タバコの煙で制服が臭くなった。分煙になってほっとした。", "景品交換の仕組みを親に説明するのに苦労した。", "閉店後の台の掃除で、玉が床に散らばっていた。", "常連さんが、来なくなった。少し心配した。"], "葬儀スタッフ": ["1日に2件の通夜を担当した。", "夜中の2時に病院から呼び出され、お迎えに行った。", "遺族に「おかげで送り出せました」と言われ、泣きそうになった。", "お経の長さで、式の進行がずれた。", "子どもの葬儀を担当して、帰りの車で泣いた。", "友引の日は休みで、まとめて洗濯をした。", "親族同士の遺産の言い争いを、静かに見守った。", "納棺の時、故人の好きだったビールを入れた。", "1級葬祭ディレクターの試験に合格した。", "「お疲れ様です」と言いそうになり、「ご愁傷様です」と言い直した。"], "新聞配達員": ["朝3時に起きて、250軒に配った。", "台風の日も、新聞は届けた。ビニールで包んで。", "犬に追いかけられて、バイクで逃げた。", "集金に行くと、毎回「来月まとめて」と言われた。", "折り込みチラシが多い日曜は、新聞が倍の重さになった。", "購読者が5年で3割減った。", "一人暮らしのおばあちゃんの新聞が溜まっていて、通報した。無事だった。", "新聞奨学生で、大学の学費を払った。", "朝焼けの中、誰もいない道を走るのが好きだった。", "元日の新聞の厚さに絶望した。"], "引越し作業員": ["冷蔵庫を背負って、エレベーターのない4階まで上がった。", "3月の繁忙期、1日に4件まわった。", "段ボールに詰めてない部屋に着いて、絶望した。", "お客さんにご祝儀で3,000円もらった。", "ピアノを運ぶのに、5人がかりだった。", "養生テープを貼る速さには自信がついた。", "作業後のコーラが一番うまかった。", "ベランダからソファを吊り下げて運んだ。", "離婚の引越しで、半分ずつ荷物を分けるのを見守った。", "肩が筋肉で盛り上がり、Tシャツのサイズが2つ上がった。"], "遊園地スタッフ": ["「いってらっしゃーい！」を1日500回言った。", "着ぐるみの中は40度を超えていた。", "迷子の子どもが泣き止まず、30分一緒に歩いた。", "ジェットコースターの点検は、毎朝6時からだった。", "雨の日、お客さんが50人しか来なかった。", "夜のパレードの後、花火を見ながら掃除した。", "プロポーズの手伝いをして、成功した。", "アトラクションが止まり、お客さんを避難誘導した。", "年間パスポートの常連さんに名前を覚えられた。", "閉園後の誰もいない園内を歩くのが好きだった。"], "ホテルマン": ["チェックインのピークで、40分で60組をさばいた。", "夜勤で、酔っ払ったお客さんの部屋番号探しを手伝った。", "外国人のお客さんに、英語・中国語・身振りで道案内した。", "お客さんの忘れ物の指輪を、3日かけて送り届けた。", "結婚記念日のお客さんにケーキをサプライズで出し、泣かれた。", "「部屋が狭い」とクレームを受け、アップグレードした。", "インバウンドで、稼働率が98%になった。", "制服のネクタイを1日中締めて、首が痛くなった。", "コンシェルジュ用に、近所のレストラン50軒を覚えた。", "ホテルのまかないのカレーが絶品だった。"], "臨床検査技師": ["1日に採血を120人した。", "「痛くない」と言われると、ガッツポーズしたくなった。", "血液ガスの検体が届くと、走って測定した。", "顕微鏡で見つけた異常細胞が、早期のがんだった。", "夜勤の検査室で、ひとりで200件の検体をさばいた。", "採血が怖くて泣く子に、シールをあげた。", "コロナ禍で、PCR検査を1日500件こなした。", "検査結果が医師に届くまで、患者さんは待っている。それを忘れなかった。", "超音波検査で、心臓の動きを見るのが好きになった。", "細胞検査士の資格を取った。"], "診療放射線技師": ["1日にCTを60件撮った。", "「息を止めてください」を1日200回言った。", "MRIの中で寝てしまう患者さんがいた。", "救急で運ばれた人のCTを、3分で撮った。", "被ばく線量のバッジを毎月確認した。", "小さな子どものレントゲンで、動かないようにあやした。", "マンモグラフィの検査で、患者さんの緊張をほぐした。", "新しいCT装置は3億円で、触るのに緊張した。", "夜間の当直で、交通事故の患者さんが5人運ばれてきた。", "放射線治療で、患者さんのがんが小さくなった。"], "作業療法士": ["脳卒中の患者さんが、3か月かけて箸を持てるようになった。", "リハビリで折り紙をして、患者さんに教わった。", "認知症の方と、毎週同じ話をした。毎回初めてのように笑ってくれた。", "退院前の家庭訪問で、玄関の段差を測った。", "理学療法士と間違えられた。", "子どもの発達支援で、ブランコに一緒に乗った。", "精神科の病棟で、手芸のプログラムを担当した。", "「料理ができるようになった」と、退院した方から写真が届いた。", "リハビリの単位数のノルマが1日21単位だった。", "自助具を自分で作った。"], "言語聴覚士": ["失語症の患者さんが、半年かけて「ありがとう」と言えるようになった。", "嚥下訓練で、ゼリーを一口飲み込めた時、家族が泣いた。", "子どものことばの教室で、初めての単語が「バナナ」だった。", "「言語聴覚士って何？」と10回は聞かれた。", "病院に言語聴覚士は自分ひとりだった。", "吃音の高校生が、面接で落ち着いて話せたと報告に来た。", "人工内耳の子どもの聞こえの訓練を担当した。", "嚥下造影検査で、むせる瞬間を何度も見た。", "発声練習で、患者さんと演歌を歌った。", "誤嚥性肺炎で亡くなった患者さんのことを、今でも思い出す。"], "歯科技工士": ["1日に銀歯を15本作った。", "夜11時まで技工所にこもり、入れ歯を仕上げた。", "歯科医院から「明日までに」と無理な納期を言われた。", "顕微鏡を覗きすぎて、肩こりがひどくなった。", "CAD/CAMの導入で、作業時間が半分になった。", "自分の作った前歯で、患者さんが笑顔で写真を撮れたと聞いた。", "1本の差し歯の技工料が5,000円で、割に合わないと思った。", "同期の半分が5年で辞めた。", "セラミックの色合わせが完璧にできた。", "石膏の粉で、髪が白くなった。"], "柔道整復師": ["接骨院で1日60人を施術した。", "高校の柔道部の脱臼を、その場で整復した。", "保険請求のルールが毎年変わり、事務作業が増えた。", "近所のおばあちゃんたちの憩いの場になっていた。", "スポーツトレーナーとして、地元の高校野球チームについた。", "捻挫した中学生が、試合に間に合った。", "院長に「回数を稼げ」と言われた。", "自分の肩が、施術のやりすぎで痛くなった。", "マラソン大会の救護テントで、30人の足をテーピングした。", "患者さんにお土産の干し柿をもらった。"], "鍼灸師": ["1日に10人に鍼を打った。", "鍼が怖いという患者さんに、1本だけ打ったら眠ってしまった。", "肩こりの会社員が、毎週通ってくれた。", "不妊治療で通っていた方から、妊娠の報告が届いた。", "お灸の煙で、部屋がいつも少しモグサ臭かった。", "「本当に効くの？」と聞かれ、論文を見せた。", "往診で、寝たきりのおじいさんに鍼をした。", "スポーツ選手の専属になった先輩がうらやましかった。", "東洋医学の勉強会に、毎月通った。", "開業1年目、患者さんが1日3人しか来なかった。"], "トリマー": ["1日にトイプードルを6匹カットした。", "暴れる柴犬に噛まれ、手に3か所穴が空いた。", "テディベアカットを頼まれ、思った以上にかわいく仕上がった。", "飼い主さんの写真の注文が「芸能人の犬と同じに」だった。", "シャンプー後のドライヤーで、腕がパンパンになった。", "老犬のトリミングで、休憩を何度も挟んだ。", "「うちの子が一番かわいい」と、全員が言った。", "毛玉だらけで来た保護犬が、見違えるほどきれいになった。", "手荒れがひどく、ハンドクリームを1日10回塗った。", "長年通ってくれた犬が亡くなったと、飼い主さんが報告に来た。"], "動物看護師": ["手術の助手で、3時間立ちっぱなしだった。", "猫に引っかかれて、腕が傷だらけになった。", "入院中の子犬に、夜中のミルクをあげた。", "安楽死に立ち会い、飼い主さんと一緒に泣いた。", "愛玩動物看護師の国家資格を取った。", "給料が手取り17万円で、将来が不安になった。", "「看護師さん」と呼ばれる日が来るとは思わなかった。", "夜間救急で、誤飲した犬が運ばれてきた。", "受付の電話で「うちの猫がしゃっくりしている」と相談された。", "元気になって退院する犬が、尻尾を振って帰っていった。"], "ネイリスト": ["1日に6人の爪を担当した。", "細いペンで、爪に富士山を描いた。", "お客さんの恋バナを、2時間聞いた。", "ジェルの匂いで、頭が痛くなった。", "推しの色でネイルしてほしいという注文が増えた。", "成人式シーズンは、朝6時から施術した。", "ネイリスト検定1級に合格した。", "指名客が月に50人になった。", "手が荒れてボロボロのお客さんが、ネイルで笑顔になった。", "同じ姿勢で座り続けて、腰が痛くなった。"], "エステティシャン": ["フェイシャルを1日8人担当した。", "コース契約の営業ノルマが月200万円だった。", "お客さんが施術中に眠ってしまうのが嬉しかった。", "自分の肌荒れを、お客さんに指摘された。", "「痩せたね」と旦那さんに言われたと、お客さんが報告してくれた。", "ハンドマッサージで、手の筋肉がつきすぎた。", "脱毛の施術が、1日4時間あった。", "新人時代、ローションの量を間違えて叱られた。", "結婚式前の花嫁を担当し、式の写真を見せてもらった。", "同僚が営業ノルマに疲れて辞めた。"], "パティシエ": ["クリスマスにケーキを600台作った。", "生クリームの泡立てで、腕がパンパンになった。", "マカロンの割れが続いて、何度もやり直した。", "誕生日ケーキのプレートに名前を書き間違えた。", "フランス修業から帰ってきた先輩の作品に感動した。", "冷蔵庫の中で、毎日の大半を過ごした気分だった。", "子どもの「おいしい！」の声が一番の報酬だった。", "夏は暑さでチョコが溶け、冬は手が冷えた。", "手取り15万円でも、作るのが好きだった。", "ショーケースが空になる夕方が、一日で一番うれしかった。"], "メイクアップアーティスト": ["朝4時からのドラマ撮影で、俳優5人のメイクをした。", "汗で崩れるメイクを、撮影の合間に10回直した。", "花嫁メイクで、お母さんが泣いた。", "メイクボックスが重すぎて、腰を痛めた。", "ファッションショーのバックステージは戦場だった。", "アシスタント時代、日給5,000円の現場があった。", "「すっぴんより若く見える」と言われて嬉しかった。", "特殊メイクで、傷を本物そっくりに作った。", "モデルの肌トラブルを、メイクで完璧に隠した。", "自分のメイクは、いつも5分で済ませた。"], "ウェディングプランナー": ["土日に結婚式を3件担当した。", "新郎新婦のケンカの仲裁を、打ち合わせ中に2回した。", "雨予報でガーデン挙式をどうするか、前日まで悩んだ。", "両家の母親の意見がぶつかり、板挟みになった。", "サプライズの手紙で、新婦が泣き崩れた。", "自分の結婚式は、まだ予定がない。", "コロナ禍で、予定していた式が全部延期になった。", "引き出物の数を1つ間違えて、冷や汗をかいた。", "担当した夫婦から、子どもが生まれたと年賀状が来た。", "平日休みで、友達と予定が合わなかった。"], "ツアーコンダクター": ["1年のうち、180日は家にいなかった。", "旅行中に客のパスポートがなくなり、大使館に走った。", "バスの中で、マイクで3時間話し続けた。", "台風で飛行機が飛ばず、40人分のホテルを探した。", "ツアー客のおばあちゃんに、孫のように可愛がられた。", "ヨーロッパ周遊で、時差ボケのまま添乗した。", "ツアー後のアンケートで「最高の添乗員」と書かれた。", "日当は1万5千円で、拘束は16時間だった。", "お客さんが集合時間に30分遅れ、バスが出発できなかった。", "世界遺産を50か所見たが、ゆっくり見たことは一度もなかった。"], "空港グランドスタッフ": ["搭乗口で、最後のお客さんを走って探した。", "欠航で、怒ったお客さん100人に囲まれた。", "制服とスカーフの巻き方を、研修で30回練習した。", "早番は朝4時半起きだった。", "重量オーバーの荷物で、お客さんとスーツケースの中身を一緒に整理した。", "「いってらっしゃいませ」と見送るのが好きだった。", "台風の日は、カウンターが戦場だった。", "出発前に泣いている留学生を励ました。", "英語のアナウンスを噛んで、恥ずかしかった。", "社員割引で、休みの日に沖縄に行った。"], "整備士（航空機）": ["夜中の格納庫で、エンジンを一晩中点検した。", "ボルト1本の締め忘れが命取りになる仕事だった。", "一等航空整備士の資格を取るのに、5年かかった。", "飛行機の出発を見送る時、いつも心の中で手を振った。", "冬の滑走路で、凍えながら点検した。", "機体の不具合で、出発を2時間遅らせる判断をした。", "英語のマニュアルを、毎日読んだ。", "耳栓をしても、エンジン音で耳が痛かった。", "新型機の研修で、アメリカに1か月行った。", "整備した飛行機に、家族が乗っていた。"], "イラストレーター": ["1枚5,000円のアイコン依頼を、1日3枚描いた。", "締め切り前日、徹夜で描き上げた。", "「無料で描いてくれませんか」とDMが来た。", "SNSに上げた絵が10万いいねされた。", "AI画像の台頭で、依頼が3割減った。", "ソシャゲのキャラデザが採用され、ガチャで自分の絵を引いた。", "ペンタブのペン先を年に20本使い潰した。", "確定申告で、レシートの山と格闘した。", "本の表紙を描いた本が、書店に平積みされていた。", "首と肩のこりで、整骨院の常連になった。"], "映像クリエイター": ["30秒のCMのために、3日間撮影した。", "編集で徹夜して、朝日を見ながらレンダリングを待った。", "クライアントの「なんか違う」で、修正が8回入った。", "ドローンで撮った映像が、県のPR動画に使われた。", "機材費で、貯金が200万円消えた。", "YouTuberの編集代行で、1本1万円の案件を月20本こなした。", "結婚式のエンドロールで、会場が泣いた。", "データが飛んで、バックアップの大切さを知った。", "短編映画が小さな映画祭で入選した。", "撮影現場の弁当が、毎回同じ唐揚げ弁当だった。"], "音響エンジニア": ["ライブで、マイクのハウリングに冷や汗をかいた。", "レコーディングで、ボーカルのテイクを50回録った。", "深夜のスタジオで、ミックスを朝までやった。", "耳を守るため、休日は静かに過ごした。", "機材の配線を、目をつぶってもできるようになった。", "フェスのPA卓で、3万人の音を操った。", "アーティストに「いい音だね」と言われ、一日中にやけた。", "本番中に電源が落ちて、心臓が止まりそうになった。", "新人時代、ケーブル巻きを1日200本した。", "自分が関わったアルバムがチャート1位になった。"], "中学校教員": ["部活の顧問で、土日も練習に付き合った。", "反抗期の生徒に「うざい」と言われた。卒業式で同じ生徒に泣かれた。", "修学旅行の夜、見回りで3時間しか寝られなかった。", "テストの採点を、120人分夜中までやった。", "保護者からの電話が、夜10時にかかってきた。", "給食の牛乳を、生徒より早く飲み干した。", "体育祭で、クラスが学年優勝した。", "不登校の生徒の家に、毎週プリントを届けた。半年後、学校に来てくれた。", "10年後、教え子が教員になったと報告に来た。", "残業代が出ないことを、教員になってから知った。"], "予備校講師": ["大教室で、300人を前に90分授業した。", "授業アンケートの点数で、翌年のコマ数が決まった。", "生徒が東大に合格したと、泣きながら報告に来た。", "センター試験の当日、会場の前で生徒に声をかけた。", "人気講師の授業は、サテライト配信で全国に流れていた。", "一年契約で、来年の仕事があるかわからなかった。", "夏期講習は、朝9時から夜9時まで授業だった。", "手作りのプリントが、毎年少しずつ厚くなった。", "ギャグがすべって、教室が静まり返った。", "浪人生の母親から、感謝の手紙が届いた。"], "塾講師": ["小学生に九九を教えて、自分も楽しくなった。", "授業の合間に、生徒の恋愛相談に乗った。", "高校受験の合格発表で、生徒と一緒に喜んだ。", "授業後の報告書を書くのに、毎日1時間かかった。", "保護者面談で、成績が上がらない理由を説明した。", "夏期講習で、1日8コマ授業した。", "「先生のおかげで数学が好きになった」と言われた。", "授業準備が無給で、時給が実質半分だった。", "宿題を忘れた生徒の言い訳が、毎回新しかった。", "教え子が、大学生になって講師として戻ってきた。"], "臨床心理士": ["公認心理師と2つ資格を持っているのに、年収は380万円だった。", "非常勤を3か所掛け持ちして、月曜はスクールカウンセラー、火曜は病院、水曜は企業の相談室に行った。", "50分のカウンセリングで、相手が最後の5分に一番大事な話をした。", "心理検査のWAISの採点で、週末が丸ごと消えた。", "「話を聞くだけで給料もらえていいね」と親戚に言われ、笑ってごまかした。", "3年通ってくれた相談者が「もう大丈夫です」と言って終結した。帰り道、少しだけ泣いた。", "守秘義務があるので、しんどい日のことを誰にも話せず、自分もスーパーバイザーに月1万円払って話を聞いてもらった。", "相談者が急に来なくなり、1か月間ずっと気になっていた。", "学会の参加費と研修費で、年に20万円が飛んでいった。", "不登校だった中学生から、高校の合格報告のハガキが届いた。"], "保健師": ["乳幼児健診で、1日に80人の赤ちゃんの体重を記録した。", "家庭訪問先がゴミ屋敷で、玄関から先に進めなかった。", "コロナの時期、保健所の電話が鳴りやまず、終電を3か月逃し続けた。", "特定保健指導で「来年までに3キロ痩せましょう」と言ったら、翌年5キロ増えて戻ってきた。", "市役所の異動で、母子保健から突然、介護保険の窓口に回された。", "虐待が疑われる家庭に、児童相談所の職員と一緒に夜8時に訪問した。", "健康まつりのブースで、骨密度測定に150人の列ができた。", "10年前に訪問した赤ちゃんのお母さんに、スーパーで「あのときの保健師さん！」と声をかけられた。", "地域の高齢者サロンで、体操を教えるつもりが、おばあちゃんたちの漬物を食べて終わった。", "自殺対策の会議資料を作りながら、去年担当した人のことを思い出した。"], "助産師": ["夜勤で4件のお産が重なり、休憩は5分だけだった。", "満月の夜は本当にお産が多い気がする、と先輩が言い、その夜も6件来た。", "初産婦さんが26時間かけて産んだ。赤ちゃんの声が聞こえた瞬間、部屋の全員が泣いた。", "陣痛中の妊婦さんに「ふざけんな！」と叫ばれた。翌日、菓子折りを持って謝りに来てくれた。", "夫が立ち会い中に貧血で倒れ、妊婦さんより先に処置した。", "死産のお母さんの赤ちゃんに、小さな服を着せて写真を撮った。", "10年前に取り上げた子が、職場体験で病院に来た。", "自宅出産の依頼で、深夜2時に車で40分の山の中まで向かった。", "母乳外来で、1日に15人のおっぱいトラブルを見た。", "手取りは夜勤手当込みで32万円。夜勤月8回の対価だと思った。"], "データサイエンティスト": ["仕事の8割はデータの前処理で、Excelの「株式会社」と「(株)」の表記ゆれを直して1日が終わった。", "上司に「AIでなんとかして」と言われたが、データが37件しかなかった。", "精度95%のモデルを作ったら、全部「該当なし」と予測していただけだった。", "週次レポートのダッシュボードを作ったが、半年後にアクセスログを見たら閲覧は自分だけだった。", "Kaggleのコンペで銅メダルを取り、LinkedInのプロフィールに書いた。", "「相関と因果は違います」と会議で5回言った。", "SQLのクエリを流したまま帰ったら、翌朝クラウドの請求が12万円になっていた。", "A/Bテストの結果「どちらも差なし」と報告したら、明らかにがっかりされた。", "作った需要予測モデルで、店舗の廃棄が月300万円減った。", "肩書がデータサイエンティストからAIエンジニアに勝手に変わっていた。"], "AIエンジニア": ["半年かけて作った機能が、新しいモデルのリリース1回で不要になった。", "GPUの順番待ちで、学習が始まるまで3日待った。", "論文を毎朝5本読むつもりが、arXivの新着が1日300本あって諦めた。", "デモ当日、LLMが自信満々に社長の名前を間違えた。", "「AIで人を減らせる？」と聞かれ、たいてい人が増えると答えた。", "プロンプトの1行を変えただけで精度が12ポイント上がり、なぜかは誰にも分からなかった。", "クラウドのGPU代で、月の予算300万円を10日で使い切った。", "親に仕事を説明したら「ChatGPTの中の人？」と言われた。", "作ったチャットボットが、問い合わせ対応の時間を月400時間減らした。", "技術カンファレンスで登壇し、質疑応答で手が震えた。"], "半導体エンジニア": ["クリーンルームの防塵服を着るのに10分かかり、トイレに行くのを我慢するようになった。", "熊本の新工場立ち上げに出向し、アパートの家賃が1年で2割上がった。", "歩留まりが1%上がり、部署で焼肉に行った。", "装置のトラブルで、夜中の3時に呼び出された。", "シリコンサイクルの不況で、ボーナスが前年の半分になった。", "翌年の好況で、ボーナスが前年の3倍になった。", "プロセス条件の温度を2℃変えるだけの検証に、2か月かかった。", "海外の装置メーカーのエンジニアと、つたない英語で24時間対応した。", "自分が関わったチップが、新型スマホに入っていると知った。", "ニュースで「半導体は産業のコメ」と聞くたびに、実家の田んぼを思い出した。"], "機械設計エンジニア": ["CADで3日かけて描いた部品が、現場で「これ組めないよ」と言われた。", "公差を0.01mm厳しくしたら、加工費が3倍になった。", "試作品のネジが1本足りず、ホームセンターに走った。", "設計変更が27回目に達し、図面のファイル名が「最終_最新_本当に最終.dwg」になった。", "工場の人に作業着で弁当を食べながら設計の不満を言われ、全部メモした。", "自分が設計した機械が、展示会で動いているのを見て誇らしかった。", "強度計算のミスに夜中に気づき、翌朝6時に出社した。", "コストダウンの指示で、部品を12点から9点に減らした。", "3D CADのライセンス更新が年間100万円だと聞いて、大事に使おうと思った。", "20年前の先輩の手描き図面が、今でも一番分かりやすかった。"], "土木技術者": ["トンネルの貫通式で、山の向こうの班と握手した。", "夏の現場で、空調服のファンが2台とも止まった。", "雨で工程が10日遅れ、土曜日がなくなった。", "橋の点検で、高所作業車に1日8時間乗っていた。", "地元の人に「この道ができて病院が近くなった」と言われた。", "山奥の現場で、コンビニまで車で40分だった。", "台風の夜、河川の水位を見張って朝まで詰め所にいた。", "役所との協議で、書類が厚さ15cmになった。", "現場事務所のカップ麺のストックが常に50個あった。", "30年前に父親が造った橋の補修を担当した。"], "品質管理": ["抜き取り検査で、1000個に1個の不良を見つけた。", "「品質は工程でつくり込む」と朝礼で毎日唱和した。", "クレーム対応で、8D報告書を英語で書いた。", "ISOの審査の前日、手順書の日付を全部確認した。", "製造部から「QCのせいで出荷できない」と言われ、肩身が狭かった。", "なぜなぜ分析で「なぜ」を7回繰り返し、最後は「人が足りないから」になった。", "異物混入の調査で、髪の毛1本を顕微鏡で見た。", "取引先の監査で、トイレの清掃記録まで見られた。", "自分が止めたロットが、のちに重大事故を防いでいたと分かった。", "QCサークル大会で発表し、全社3位になった。"], "人事": ["新卒採用の面接で、1日に22人と話した。", "説明会で「アットホームな職場です」と言うのをやめた。", "内定式の翌日、内定辞退のメールが3通来た。", "退職面談で、本当の理由が「上司が嫌」だと知っていたが、書類には「キャリアアップ」と書いた。", "給与計算の締め日に、社員の扶養の届け出漏れが見つかった。", "社員から「人事は会社の味方でしょ」と言われた。", "採用した新人が3年後に表彰されているのを見て、こっそり喜んだ。", "ハラスメント相談の聞き取りで、2時間メモを取り続けた。", "リストラの対象者リストを作る役を任された。", "人事評価の時期は、全社員から少し距離を置かれた。"], "経理": ["月末締めで、1円合わない原因を3時間探したら、切手代だった。", "決算期は毎日終電で、コンビニのおにぎりの味を全部覚えた。", "営業部の領収書に「お品代」としか書いてなく、電話で確認した。", "インボイス制度が始まり、請求書のチェック項目が倍になった。", "税務調査の前日、段ボール30箱の証憑を整理した。", "簿記2級を取ったら、資格手当が月5000円ついた。", "経費精算の締め切りを10回告知したのに、締め切り後に20件来た。", "会社の資金繰り表を見て、来月の給料が払えるか自分だけが知っていた。", "監査法人の若手に質問攻めにされ、新人時代の自分を思い出した。", "上場の日、自分が作った有価証券報告書が公開された。"], "秘書": ["役員のスケジュールが3件ダブルブッキングし、15分で全部調整した。", "お歳暮の手配リストが400件あった。", "社長の好きなお茶の温度は62℃だと覚えた。", "新幹線のチケットを取り直すこと、1日で4回。", "会食のお店選びで、個室・駅近・苦手な食材なしの条件を満たす店を30軒調べた。", "役員が会議室に忘れたスマホを持って、東京駅まで走った。", "社長の奥さんの誕生日まで手帳に書いてあった。", "担当役員が退任する日、「君がいたからやれた」と言われて泣いた。", "お客様の顔と名前を300人分覚えた。", "ゴルフコンペの組み合わせ表を作るのに、人間関係の配慮で半日かかった。"], "証券アナリスト": ["決算発表の日は朝5時に出社し、30社の短信を読んだ。", "レポートの「買い」推奨の翌日、株価が15%下がった。", "企業のIR説明会で、質問の順番を確保するため最前列に座った。", "アナリストランキングで5位に入り、ボーナスが跳ね上がった。", "社長インタビューで、本音を引き出せたのは最後の雑談だった。", "担当業界の工場見学で、ヘルメット姿の写真を撮られた。", "エクセルの業績予想モデルが3万行になった。", "市場が荒れた日、ファンドマネージャーから電話が40本かかってきた。", "「株で儲けてるんでしょ」と言われるが、自社規定で個別株は買えなかった。", "10年担当した会社の上場廃止のニュースを、オフィスで黙って読んだ。"], "アクチュアリー": ["資格試験の全科目合格まで8年かかった。", "保険料率の計算で、小数点以下第6位まで議論した。", "飲み会で「確率の専門家なら宝くじ当ててよ」と言われた。", "死亡率表をずっと眺めていたら、自分の余命を計算してしまった。", "合格発表の日、会社のフロアが静まり返った。", "準会員のまま5年が過ぎ、後輩に先を越された。", "新しい医療保険の価格を、半年かけて決めた。", "コロナの影響で、保険金の支払い予測を全部やり直した。", "正会員になり、給料が年200万円上がった。", "年金数理の説明会で、誰も質問しなかった。"], "保険営業": ["親戚と友人に一通り声をかけたら、年賀状が減った。", "1か月で新規契約20件のノルマに、残り3日で8件足りなかった。", "お客さんが亡くなり、遺族に保険金を届けに行った。「入っててよかった」と言われた。", "昼休みに企業を回り、飴を配った。", "表彰で海外旅行に連れて行ってもらった。行き先はハワイだった。", "給料はフルコミッションで、月収が80万円の月と12万円の月があった。", "同期入社の30人が、2年で5人になった。", "FPの資格を取り、名刺の肩書が2行になった。", "契約者の子どもの結婚式に呼ばれた。", "解約の電話で「もう営業に来ないで」と言われた。"], "弁理士": ["弁理士試験に4回目で受かった。合格率は6%だった。", "発明者の技術者と3時間話して、ようやく発明の本質が分かった。", "特許の明細書を1件書くのに40時間かかった。", "特許庁から拒絶理由通知が来て、反論書を書いた。", "海外の代理人とのメールで、時差のせいで夜中に返信した。", "担当した特許が、競合との訴訟で決め手になった。", "商標登録の相談で、ラーメン屋さんの店名を調べたら既に登録されていた。", "「パテント」と言うと、「パテントって何？」と親に聞かれた。", "英語の特許文献を毎日50ページ読んだ。", "独立1年目、事務所の家賃を払うと手元に残ったのは月18万円だった。"], "社会保険労務士": ["顧問先の社長から、夜11時に「従業員がLINEで辞めると言ってきた」と電話が来た。", "社労士試験に、1点足りずに2回落ちた。", "年度更新と算定基礎届の時期は、6月と7月が消えた。", "就業規則を作ったら、社長が読まずに「いいね」と言った。", "助成金の申請が通り、顧問先から高級メロンが届いた。", "労基署の調査に立ち会い、未払い残業の計算を一晩でやった。", "給与計算の代行で、1人分の住民税のミスに冷や汗をかいた。", "顧問料は月3万円で、相談は月30件来た。", "障害年金の申請が通り、依頼者から手書きの手紙をもらった。", "開業3年で、顧問先が40社になった。"], "不動産鑑定士": ["現地調査で、土地の境界を確かめるために草むらに入り、ダニに刺された。", "相続案件で、兄弟3人が別々に鑑定を依頼してきた。", "固定資産税の評価替えの時期は、市から数百件の依頼が来た。", "鑑定評価書が1件で100ページを超えた。", "試験の論文式で、民法を丸暗記した。", "地価公示の鑑定で、毎年同じ交差点に立った。", "バブル期を知る先輩の話は、だいたい最後に「あの頃はね」で終わった。", "競売物件の調査で、中に住んでいる人と鉢合わせした。", "収益還元法の計算で、利回りの0.1%の違いが評価額を5000万円変えた。", "地方の空き家の鑑定で、評価額がほぼゼロだった。"], "裁判官": ["3年ごとの転勤で、北海道、九州、四国を渡り歩いた。", "判決文を書くために、記録を段ボール5箱分読んだ。", "官舎の隣の部屋も裁判官で、エレベーターで会釈するだけだった。", "法廷で、被告人の母親が泣き崩れた。", "知人に裁判官だと言うと、なぜか敬語に変わった。", "1人で200件の事件を抱えていた。", "休日も自宅で判決文を書いていた。", "刑事裁判で、量刑を決めるのに一晩眠れなかった。", "離婚調停で、子どもの親権をめぐって両親が法廷で怒鳴り合った。", "自分の下した判決が、高裁でひっくり返った。"], "検察官": ["取り調べで、被疑者が8時間黙秘を続けた。", "起訴するか否かの判断で、記録を3日間読み込んだ。", "公判で、証人が法廷で供述を翻した。", "2年ごとの異動で、引っ越しの段ボールを捨てずにとっておくようになった。", "深夜に警察から勾留請求の書類が届き、当直で朝まで処理した。", "被害者の遺族に、法廷での意見陳述の説明をした。手が震えていた。", "司法修習の同期は、ほとんど弁護士になった。", "自分が担当した事件のドラマを見て、取り調べが現実と違いすぎて笑った。", "有罪判決が出た日、被害者の家族に深く頭を下げられた。", "検事正の決裁で、書類に赤ペンを17箇所入れられた。"], "外交官": ["在外公館に赴任し、3年でアフリカと中東と南米を転々とした。", "レセプションで1晩に名刺を80枚交換した。", "大臣の外遊の随行で、48時間寝なかった。", "現地の治安悪化で、日本人の退避支援のため空港に3日間詰めた。", "英語とフランス語に加え、アラビア語の研修を2年受けた。", "子どもが日本語より現地の言葉を先に覚えた。", "条約交渉で、1つの単語をめぐって5時間協議した。", "現地で逮捕された日本人旅行者の面会に、拘置所に行った。", "天皇誕生日のレセプションで、寿司を握ってもらうため日本から料理人を呼んだ。", "帰国したら、日本のコンビニの品揃えに感動して20分店内にいた。"], "航空管制官": ["羽田のレーダー室で、1時間に40機をさばいた。", "夜勤明けで目がチカチカし、帰りの電車で寝過ごした。", "英語の交信で、パイロットのなまりが強すぎて3回聞き返した。", "台風で着陸待ちの機体が上空に10機たまった。", "資格取得まで、訓練で2年かかった。", "「管制官って、手旗振る人？」と親戚に言われた。", "緊急事態宣言をした機体が無事着陸し、交信の最後に「サンキュー」と言われた。", "年に1回の英語試験と身体検査で、毎回緊張した。", "新人のころ、先輩に交信を止められて真っ白になった。", "正月も交代制で、空港で年を越した。"], "学芸員": ["学芸員の公募に100人応募があり、採用は1人だった。", "展覧会の準備で、借用作品の梱包に1日中立ち会った。", "収蔵庫の温湿度管理で、湿度計を1時間おきに確認した。", "企画展の来場者が目標の3万人を超え、館長が珍しく笑った。", "子ども向けのワークショップで、恐竜の骨の模型を作った。", "「学芸員は雑芸員」と先輩に言われ、本当に雑用ばかりだった。", "年収は非常勤時代200万円台で、常勤になって350万円になった。", "論文を書きたいのに、展示の準備で3年書けていない。", "作品の解説パネルを50字に縮めるのに半日かかった。", "見学に来たおじいさんが、展示を見て昔の話を30分してくれた。"], "放送作家": ["会議で企画を30本出し、通ったのは1本だった。", "深夜番組の台本を、収録の2時間前に書き直した。", "ナレーション原稿で「果たして…」を1日に5回書いた。", "レギュラー番組が4本あったのに、改編期に3本終わった。", "芸人さんに台本を無視されたが、そのアドリブの方が面白かった。", "ギャラは1本3万円で、拘束は12時間だった。", "自分の考えたコーナーが、SNSのトレンドに入った。", "エンドロールの名前が一瞬すぎて、親に「見えなかった」と言われた。", "ネタ帳がスマホのメモで2000件になった。", "YouTubeチャンネルの構成作家の仕事が増え、テレビより稼ぐようになった。"], "カメラマン": ["機材に総額400万円かかり、ローンが残っていた。", "結婚式の撮影で、新郎の父親の涙をアップで撮った。", "七五三シーズンは1日に15家族を撮った。", "雨の屋外撮影で、レンズに水滴がつき続けた。", "子どもの写真撮影で、笑わせるために変顔を1時間続けた。", "クライアントに「スマホで撮った方が良くない？」と言われた。", "撮影データのSDカードを紛失しかけて、全身から汗が出た。", "自分の写真が、駅の広告ポスターになった。", "報道の現場で、被災地の写真を撮りながら手が震えた。", "10年前に撮った家族から、「おじいちゃんの遺影に使わせてもらった」と連絡が来た。"], "NPO職員": ["子ども食堂の運営で、1日に60食を作った。", "助成金の申請書を1か月に5本書いた。", "給料は月18万円で、「やりがい搾取だよ」と友達に言われた。", "クラウドファンディングで、目標300万円に対して320万円集まった。", "ボランティアのシフト調整で、LINEグループが10個になった。", "支援していた若者から、就職が決まったと電話が来た。", "寄付者向けの年次報告書を作り、写真の許可を一人ずつ取った。", "行政との協働事業で、書類の様式が毎年変わった。", "活動がテレビで紹介され、翌週に寄付が200件届いた。", "代表が燃え尽きて、半年休んだ。"], "市議会議員": ["選挙で、駅前
